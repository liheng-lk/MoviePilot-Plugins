name: Migrate Shuk organizer v3.7.2 phase2

on:
  push:
    branches:
      - refactor/shukguangya-organizer-core-v372
    paths:
      - tools/migrate_shuk_v372_phase2.py
      - tools/update_shuk_v372_contracts.py
      - tools/fix_shuk_v372_contract_scope.py
      - .github/workflows/migrate-shuk-v372-phase2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shukguangya-organizer-core-v372
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python tools/migrate_shuk_v372_phase2.py
      - name: Update architecture contracts
        run: python tools/update_shuk_v372_contracts.py
      - name: Scope preview ordering contract
        run: python tools/fix_shuk_v372_contract_scope.py
      - name: Python syntax
        run: python -m compileall -q plugins.v3/shukguangyadisk
      - name: Shuk unit tests
        run: python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
      - name: Shuk function contracts
        run: python tests/v3/shukguangyadisk/run_contract_tests.py
      - name: Repository regression
        run: python -m unittest discover -s tests -v
      - name: GuangYa transfer regression
        run: python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Remove one-time tooling and commit
        run: |
          rm -f tools/migrate_shuk_v372_phase2.py tools/update_shuk_v372_contracts.py tools/fix_shuk_v372_contract_scope.py .github/workflows/migrate-shuk-v372-phase2.yml
          find plugins.v3 tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3 tests -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(shukguangyadisk): phase2 explicit folder terminal core v3.7.2'
          git push origin HEAD:refactor/shukguangya-organizer-core-v372
