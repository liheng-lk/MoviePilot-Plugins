name: Fix DailyNewDrama v1.3.1 API validation
on:
  push:
    branches: [dailynewdrama-v1.3.1-api-fix]
    paths: [.github/workflows/fix-dailynewdrama-v131-api.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-v1.3.1-api-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('plugins.v2/dailynewdrama/__init__.py')
          s=p.read_text(encoding='utf-8')
          old='''    def api_subscribe(self, payload: dict) -> Dict[str, Any]:\n        \"\"\"订阅页面/消息中的候选序号，并从当前页面移除已处理条目。\"\"\"\n        payload = payload or {}\n        indexes = self._parse_indexes(str(payload.get(\"indexes\") or \"\"))\n        batch_id = str(payload.get(\"batch_id\") or \"\")\n        result = self._subscribe_indexes(indexes=indexes, batch_id=batch_id)\n'''
          new='''    def api_subscribe(self, indexes: str = \"\", batch_id: str = \"\") -> Dict[str, Any]:\n        \"\"\"订阅页面候选；参数与 MoviePilot get_page 事件 params 保持一致。\"\"\"\n        parsed_indexes = self._parse_indexes(str(indexes or \"\"))\n        batch_id = str(batch_id or \"\")\n        result = self._subscribe_indexes(indexes=parsed_indexes, batch_id=batch_id)\n'''
          if old not in s:
              raise SystemExit('api_subscribe pattern not found')
          s=s.replace(old,new)
          s=s.replace('plugin_version = "1.3"','plugin_version = "1.3.1"',1)
          p.write_text(s,encoding='utf-8')
          for name in ['package.v2.json','plugin.json']:
              path=Path(name); data=json.loads(path.read_text(encoding='utf-8')); data['DailyNewDrama']['version']='1.3.1'; data['DailyNewDrama']['history']={'v1.3.1':'修复插件页面订阅按钮 API 参数校验失败','v1.3':'候选不限数量，页面一键订阅，提醒去重不再隐藏候选',**(data['DailyNewDrama'].get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          path=Path('plugins.v2/dailynewdrama/plugin.json'); data=json.loads(path.read_text(encoding='utf-8')); data['version']='1.3.1'; data['history']={'v1.3.1':'修复插件页面订阅按钮 API 参数校验失败','v1.3':'候选不限数量，页面一键订阅，提醒去重不再隐藏候选',**(data.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Add regression test
        run: |
          cat > tests/test_dailynewdrama_api_contract.py <<'PY'
          import ast, json
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          SRC=ROOT/'plugins.v2/dailynewdrama/__init__.py'
          tree=ast.parse(SRC.read_text(encoding='utf-8'))
          cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='DailyNewDrama')
          fn=next(n for n in cls.body if isinstance(n,ast.FunctionDef) and n.name=='api_subscribe')
          args=[a.arg for a in fn.args.args]
          assert args==['self','indexes','batch_id'], args
          text=SRC.read_text(encoding='utf-8')
          assert 'payload: dict' not in text[text.index('def api_subscribe'):text.index('def _remove_current_candidates')]
          assert '"api": "plugin/DailyNewDrama/subscribe"' in text
          assert '"params": {"indexes":' in text
          assert 'plugin_version = "1.3.1"' in text
          assert json.loads((ROOT/'package.v2.json').read_text())['DailyNewDrama']['version']=='1.3.1'
          assert json.loads((ROOT/'plugin.json').read_text())['DailyNewDrama']['version']=='1.3.1'
          assert json.loads((ROOT/'plugins.v2/dailynewdrama/plugin.json').read_text())['version']=='1.3.1'
          PY
      - name: Validate
        run: |
          python -m compileall -q plugins.v2/dailynewdrama
          python -m unittest discover -s tests -p 'test_dailynewdrama*.py' -v
          python tests/test_dailynewdrama_api_contract.py
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v2/dailynewdrama/__init__.py plugins.v2/dailynewdrama/plugin.json package.v2.json plugin.json tests/test_dailynewdrama_api_contract.py
          git commit -m 'fix: DailyNewDrama v1.3.1 page subscribe API contract'
          git push origin HEAD:dailynewdrama-v1.3.1-api-fix
