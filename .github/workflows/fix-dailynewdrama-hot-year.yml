name: Fix DailyNewDrama Hot RSS Year

on:
  push:
    branches: [dailynewdrama-complete]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-complete
          fetch-depth: 0
      - name: Fix source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('plugins.v2/dailynewdrama/__init__.py')
          s = p.read_text(encoding='utf-8')
          old = '''        years = re.findall(r"\\b(19\\d{2}|20\\d{2})\\b", f"{pubdate} {description}")\n        parsed_date = _parse_date_value(pubdate)\n'''
          new = '''        year_text = f"{pubdate} {description}" if source == "coming" else description\n        years = re.findall(r"\\b(19\\d{2}|20\\d{2})\\b", year_text)\n        parsed_date = _parse_date_value(pubdate)\n'''
          if old not in s:
              print('Target already fixed or source changed; no patch needed.')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate targeted tests
        run: |
          python -m compileall -q plugins.v2/dailynewdrama
          python -m unittest discover -s tests -v
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins.v2/dailynewdrama/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: do not use hot RSS pubDate as drama year'
            git push origin HEAD:dailynewdrama-complete
          fi
