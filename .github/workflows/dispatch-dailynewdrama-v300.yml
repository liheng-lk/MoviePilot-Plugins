name: Dispatch DailyNewDrama 3.0.0 V3 adaptation
on:
  push:
    branches: [main]
    paths: [.github/workflows/dispatch-dailynewdrama-v300.yml]
permissions:
  contents: write
jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-v3.0.0-adaptation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create V3 implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          src=Path('plugins.v2/dailynewdrama'); dst=Path('plugins.v3/dailynewdrama'); dst.mkdir(parents=True,exist_ok=True)
          for name in ('__init__.py','platform_sources.py','movie.jpg'):
              shutil.copy2(src/name,dst/name)
          p=dst/'__init__.py'; s=p.read_text(encoding='utf-8')
          s=s.replace('from app.core.config import settings','from app.sdk.config import settings')
          s=s.replace('from app.core.context import MediaInfo','from app.sdk.media import MediaInfo, MetaInfo')
          s=s.replace('from app.core.event import Event, eventmanager','from app.sdk.events import Event, eventmanager')
          s=s.replace('from app.core.metainfo import MetaInfo\n','')
          s=s.replace('from app.log import logger','from app.sdk.logging import logger')
          s=s.replace('from app.schemas import MediaType\nfrom app.schemas.types import EventType, MediaSource','from app.schemas.types import EventType, MediaSource, MediaType')
          s=s.replace('from app.utils.http import RequestUtils','from app.sdk.network import RequestUtils')
          s=s.replace('plugin_version = "1.3.6"','plugin_version = "3.0.0"',1)
          p.write_text(s,encoding='utf-8')
          p=dst/'platform_sources.py'; s=p.read_text(encoding='utf-8')
          s=s.replace('from app.core.config import settings','from app.sdk.config import settings')
          s=s.replace('from app.log import logger','from app.sdk.logging import logger')
          s=s.replace('from app.utils.http import RequestUtils','from app.sdk.network import RequestUtils')
          p.write_text(s,encoding='utf-8')
          (dst/'README.md').write_text('# 每日新剧助手 3.0.0\n\nMoviePilot V3 专用实现。保留 V2 1.3.6 全部功能，并迁移至 V3 SDK 与统一媒体身份合同。\n',encoding='utf-8')
          v3={'DailyNewDrama':{'name':'每日新剧助手','description':'MoviePilot V3 新剧与在播剧聚合助手，聚合豆瓣、腾讯视频、爱奇艺、优酷、芒果TV、哔哩哔哩，仅展示未入库且未订阅内容，并支持页面一键订阅。','labels':'豆瓣,腾讯视频,爱奇艺,优酷,芒果TV,哔哩哔哩,电视剧,订阅,推荐,通知','version':'3.0.0','icon':'movie.jpg','author':'liheng-lk','level':1,'system_version':'>=3.0.0','history':{'v3.0.0':'MoviePilot V3 专用首版：迁移至 plugins.v3/package.v3.json，采用 app.sdk 稳定接口及 media_source + media_id 统一媒体身份，保留多平台发现、过滤、无限候选和页面一键订阅。'}}}
          Path('package.v3.json').write_text(json.dumps(v3,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for name in ('package.v2.json','plugin.json'):
              p=Path(name); d=json.loads(p.read_text(encoding='utf-8')); d['DailyNewDrama']['v3']=False; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          td=Path('tests/v3/dailynewdrama'); td.mkdir(parents=True,exist_ok=True)
          (td/'test_plugin_contract.py').write_text('''from pathlib import Path\nimport json\nROOT=Path(__file__).resolve().parents[3]\nV3=ROOT/"plugins.v3"/"dailynewdrama"\ntext=(V3/"__init__.py").read_text(encoding="utf-8")\nplatform=(V3/"platform_sources.py").read_text(encoding="utf-8")\nidx=json.loads((ROOT/"package.v3.json").read_text(encoding="utf-8"))["DailyNewDrama"]\nv2=json.loads((ROOT/"package.v2.json").read_text(encoding="utf-8"))["DailyNewDrama"]\nassert "plugin_version = \\\"3.0.0\\\"" in text\nassert idx["version"]=="3.0.0" and idx["system_version"]==">=3.0.0"\nassert v2.get("v3") is False\nfor old in ("from app.core.config import","from app.core.context import","from app.core.event import","from app.core.metainfo import","from app.log import","from app.utils.http import"):\n    assert old not in text\nassert "from app.sdk.config import settings" in text\nassert "from app.sdk.media import MediaInfo, MetaInfo" in text\nassert "from app.sdk.events import Event, eventmanager" in text\nassert "from app.sdk.logging import logger" in text\nassert "from app.sdk.network import RequestUtils" in text\nassert "from app.sdk.config import settings" in platform\nassert "from app.sdk.logging import logger" in platform\nassert "from app.sdk.network import RequestUtils" in platform\nassert "recognize_media(meta=meta, tmdbid=" not in text\nassert "recognize_media(meta=meta, doubanid=" not in text\nassert "media_source=subscribe_media_source" in text\nassert "media_id=str(subscribe_media_id)" in text\nassert "\\\"method\\\": \\\"get\\\"" in text\nassert "\\\"apikey\\\": settings.API_TOKEN" in text\n''',encoding='utf-8')
          PY
          python -m compileall -q plugins.v3/dailynewdrama
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests -p 'test_dailynewdrama*.py' -v
      - name: Commit adaptation branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v3/dailynewdrama package.v3.json package.v2.json plugin.json tests/v3/dailynewdrama
          git commit -m 'feat: add DailyNewDrama 3.0.0 for MoviePilot V3'
          git push origin HEAD:dailynewdrama-v3.0.0-adaptation
