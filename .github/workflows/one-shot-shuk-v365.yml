name: One-shot ShukGuangYaDisk v3.6.5 compatibility fix
on:
  push:
    branches: [fix/shukguangyadisk-mp-transferpending-compat-v365]
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shukguangyadisk-mp-transferpending-compat-v365
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply MoviePilot transfer-pending compatibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'

          files = [
              plugin / 'organizer_queue_recovery.py',
              plugin / 'organizer_legacy_queue_cleanup_v343.py',
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              old_import = 'from app.application.chain.data import get_chain_transfer_pending_port'
              if old_import not in text:
                  raise SystemExit(f'missing retired import in {path}')
              text = text.replace(
                  old_import,
                  'from app.db.transferpending_oper import TransferPendingOper',
              )
              text = text.replace(
                  'get_chain_transfer_pending_port()',
                  'TransferPendingOper()',
              )
              path.write_text(text, encoding='utf-8')

          init_path = plugin / '__init__.py'
          init_text = init_path.read_text(encoding='utf-8')
          if 'plugin_version = "3.6.4"' not in init_text:
              raise SystemExit('unexpected ShukGuangYaDisk entry version')
          init_path.write_text(
              init_text.replace('plugin_version = "3.6.4"', 'plugin_version = "3.6.5"', 1),
              encoding='utf-8',
          )

          remote_entry = plugin / 'dist' / 'assets' / 'remoteEntry.js'
          remote_text = remote_entry.read_text(encoding='utf-8')
          if '?v=3.6.4' not in remote_text:
              raise SystemExit('unexpected ShukGuangYaDisk remoteEntry version')
          remote_entry.write_text(
              remote_text.replace('?v=3.6.4', '?v=3.6.5'),
              encoding='utf-8',
          )

          history_text = (
              '修复新版 MoviePilot 移除 app.application.chain.data 后插件无法加载的问题；'
              '旧全局队列迁移改用宿主保留的 app.db.transferpending_oper 兼容 ABI，'
              '继续只清理未执行的历史光鸭 pending，不绕过新版持久准入与租约 fencing。'
          )

          plugin_json_path = plugin / 'plugin.json'
          plugin_meta = json.loads(plugin_json_path.read_text(encoding='utf-8'))
          plugin_meta['version'] = '3.6.5'
          plugin_meta['history'] = {'v3.6.5': history_text, **dict(plugin_meta.get('history') or {})}
          plugin_json_path.write_text(
              json.dumps(plugin_meta, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          package_path = root / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          shuk = package['ShukGuangYaDisk']
          shuk['version'] = '3.6.5'
          shuk['history'] = {'v3.6.5': history_text, **dict(shuk.get('history') or {})}
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          test_path = root / 'tests' / 'v3' / 'shukguangyadisk' / 'test_queue_recovery_v332.py'
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('"get_chain_transfer_pending_port",', '"TransferPendingOper",')
          anchor = '    assert \'str(storage or "") not in storage_names\' in RECOVERY\n'
          addition = (
              '    assert "from app.db.transferpending_oper import TransferPendingOper" in RECOVERY\n'
              '    assert "app.application.chain.data" not in RECOVERY\n'
          )
          if addition not in test_text:
              if anchor not in test_text:
                  raise SystemExit('queue recovery test anchor missing')
              test_text = test_text.replace(anchor, addition + anchor)
          test_path.write_text(test_text, encoding='utf-8')

          legacy_test_path = root / 'tests' / 'v3' / 'shukguangyadisk' / 'test_legacy_queue_cleanup_v343.py'
          legacy_test = legacy_test_path.read_text(encoding='utf-8')
          marker = 'def test_waiting_legacy_tasks_are_removed_with_public_moviepilot_api():\n'
          compat_test = (
              'def test_v365_uses_moviepilot_supported_transferpending_compat_abi():\n'
              '    assert "from app.db.transferpending_oper import TransferPendingOper" in PATCH\n'
              '    assert "TransferPendingOper()" in PATCH\n'
              '    assert "app.application.chain.data" not in PATCH\n\n\n'
          )
          if compat_test not in legacy_test:
              if marker not in legacy_test:
                  raise SystemExit('legacy cleanup test anchor missing')
              legacy_test = legacy_test.replace(marker, compat_test + marker)
          legacy_test_path.write_text(legacy_test, encoding='utf-8')

          v364_test_path = root / 'tests' / 'v3' / 'shukguangyadisk' / 'test_move_transaction_guard_v364.py'
          v364_test = v364_test_path.read_text(encoding='utf-8')
          replacements = {
              'assert plugin_meta["version"] == "3.6.4"': 'assert plugin_meta["version"] == "3.6.5"',
              'assert package_meta["ShukGuangYaDisk"]["version"] == "3.6.4"': 'assert package_meta["ShukGuangYaDisk"]["version"] == "3.6.5"',
              'assert \'plugin_version = "3.6.4"\' in ENTRY': 'assert \'plugin_version = "3.6.5"\' in ENTRY',
              'assert \'?v=3.6.4\' in REMOTE': 'assert \'?v=3.6.5\' in REMOTE',
          }
          for old, new in replacements.items():
              if old not in v364_test:
                  raise SystemExit(f'v3.6.4 release assertion missing: {old}')
              v364_test = v364_test.replace(old, new, 1)
          # v3.6.4 feature history must remain even though current release is v3.6.5.
          if 'assert "v3.6.4" in plugin_meta["history"]' not in v364_test:
              raise SystemExit('v3.6.4 history assertion missing')
          v364_test_path.write_text(v364_test, encoding='utf-8')

          forbidden = 'app.application.chain.data'
          offenders = []
          for path in plugin.rglob('*.py'):
              if forbidden in path.read_text(encoding='utf-8'):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit(f'retired MoviePilot module remains: {offenders}')
          PY
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          find plugins.v3/shukguangyadisk -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3/shukguangyadisk -type f -name '*.pyc' -delete
      - name: ShukGuangYaDisk tests
        run: |
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
      - name: Metadata validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('package.v3.json').read_text(encoding='utf-8'))
          plugin = json.loads(Path('plugins.v3/shukguangyadisk/plugin.json').read_text(encoding='utf-8'))
          entry = Path('plugins.v3/shukguangyadisk/__init__.py').read_text(encoding='utf-8')
          remote = Path('plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js').read_text(encoding='utf-8')
          assert package['ShukGuangYaDisk']['version'] == '3.6.5'
          assert plugin['version'] == '3.6.5'
          assert 'plugin_version = "3.6.5"' in entry
          assert '?v=3.6.5' in remote
          assert 'v3.6.5' in package['ShukGuangYaDisk']['history']
          assert 'v3.6.5' in plugin['history']
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-shuk-v365.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore ShukGuangYaDisk compatibility with current MoviePilot'
          git push origin HEAD:fix/shukguangyadisk-mp-transferpending-compat-v365
