name: Prune all non-main branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_tmp_prune_all_non_main_branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Delete every branch except main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          mapfile -t branches < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}' \
              | sort -u
          )

          echo "Found ${#branches[@]} branches before pruning"
          failed=0
          deleted=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting: $branch"
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              echo "FAILED: $branch"
              failed=$((failed + 1))
            fi
          done

          echo "Deleted=$deleted Failed=$failed"
          mapfile -t remaining < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}' \
              | grep -v '^main$' || true
          )
          if (( ${#remaining[@]} > 0 )); then
            printf 'Remaining non-main branches:\n%s\n' "${remaining[@]}"
            exit 1
          fi
          echo "Branch pruning complete: main is the only branch"
