name: Finish GuangYa v1.11.1 contracts

on:
  push:
    branches:
      - hotfix/guangya-media-identity-v1111

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/guangya-media-identity-v1111
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply contract alignment
        run: python .github/tmp_finish_guangya_v1111_contracts.py
      - name: Validate GuangYa contracts
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant
          python -m unittest discover -s tests -p 'test_guangya_*.py' -v
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          git diff --check
      - name: Commit contract alignment
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.v3/guangyatransferassistant/legacy.py tests/v3/guangyatransferassistant
          git commit -m "test: align GuangYa 1.11.1 release contracts"
          git push origin HEAD:hotfix/guangya-media-identity-v1111
