name: Validate MoviePilot Plugins
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  release_sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/guangya-v1.12.20-channel-completeness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync GuangYa v1.12.20 release contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          plugin_dir = root / 'plugins.v3' / 'guangyatransferassistant'
          version = '1.12.20'
          build = '20260909-r67'
          description = (
              '更新日历驱动的固定分流助手。v1.12.20 修复频道漏触发：兼容当前 tgm 热更模板中的剧集/动漫/电影标题结构；'
              '频道分页未追到旧游标时不再推进 cursor，而是有界扩大分页深度并在必要时持久化追赶预算，避免中间消息永久漏掉。'
              '继续完整保留 v1.12.19 的高置信真实 payload 媒体匹配、requested/candidate/resolved/transfer episodes、Provider 排序/质量学习，'
              '以及 MoviePilot 权威缺集、reservation/source claim、不可分割物理文件硬栅栏。v1.12.18 空目录安全边界不变：'
              '待落盘验证继续使用 get_item 纯只读查询；失败且没有服务端 taskId 时才允许回收本次新建并再次确认仍为空的目录，其余情况全部 fail-closed 保留。'
              '来源优先级仍为观影迅雷秒传 > 光鸭直接转存 > Magnet > ED2K。'
          )
          history_text = (
              '修复频道漏触发与消息完整性：兼容当前 tgm 热更频道“📺 剧集：标题 (年份) SxxExx / 🎬 电影：标题 (年份)”模板，'
              '类型标签、年份和季集尾巴只作为结构化元数据，不再污染严格媒体标题；频道分页如果没有追到刷新前旧游标，绝不把 channel_cursors 推到当前高水位，'
              '本轮有界扩大分页深度，仍未追完则恢复旧游标并持久化下一轮 catchup 预算，避免中间未读取消息永久丢失。'
              '5 分钟频道 Push、7 天缓存补偿、AiringDue、真实 payload 身份门禁、MoviePilot 权威缺集、reservation/source claim、'
              '不可分割物理文件栅栏、v1.12.18 空目录安全边界和来源优先级全部保持。'
          )

          package_path = root / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          gy = package['GuangYaTransferAssistant']
          gy['description'] = description
          gy['version'] = version
          old_history = dict(gy.get('history') or {})
          gy['history'] = {'v1.12.20': history_text, **{k: v for k, v in old_history.items() if k != 'v1.12.20'}}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          plugin_path = plugin_dir / 'plugin.json'
          local = json.loads(plugin_path.read_text(encoding='utf-8'))
          local['description'] = description
          local['version'] = version
          plugin_path.write_text(json.dumps(local, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = plugin_dir / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          if '## v1.12.20 - 频道完整性与实时触发' not in readme:
              marker = '## v1.12.19 - 高置信媒体匹配与来源可靠性'
              section = (
                  '## v1.12.20 - 频道完整性与实时触发\n\n'
                  '- 兼容当前 tgm 热更模板 `📺 剧集：标题 (年份) SxxExx`、`📺 动漫：...` 与 `🎬 电影：标题 (年份)`，模板类型、年份、季集号只作为结构化元数据，不再污染严格媒体标题。\n'
                  '- 频道分页只有真正追到刷新前旧游标才允许推进 `channel_cursors`；积压较深时同一轮有界扩大分页，仍未追完则恢复旧游标并记录下一轮 catchup 预算，避免中间消息永久丢失。\n'
                  '- 5 分钟频道 Push、7 天缓存补偿、AiringDue、真实 payload 身份门禁、MoviePilot 权威缺集、reservation/source claim、不可分割物理文件栅栏及 v1.12.18 空目录安全边界全部保持。\n\n'
              )
              if marker in readme:
                  readme = readme.replace(marker, section + marker, 1)
              else:
                  readme = section + readme
              readme_path.write_text(readme, encoding='utf-8')

          # Only update assertions that refer to the final/public GuangYa release.
          # Historical v1.12.19 feature/history markers are intentionally left untouched.
          test_roots = [root / 'tests']
          replacements = [
              ('plugin_version = "1.12.19"', 'plugin_version = "1.12.20"'),
              ('build_id = "20260907-r66"', 'build_id = "20260909-r67"'),
              ('== "1.12.19"', '== "1.12.20"'),
              ("== '1.12.19'", "== '1.12.20'"),
              ('self.assertEqual(package["version"], "1.12.19")', 'self.assertEqual(package["version"], "1.12.20")'),
              ('self.assertEqual(local["version"], "1.12.19")', 'self.assertEqual(local["version"], "1.12.20")'),
          ]
          for base in test_roots:
              for path in base.rglob('test_*.py'):
                  text = path.read_text(encoding='utf-8')
                  original = text
                  for old, new in replacements:
                      text = text.replace(old, new)
                  # assertEqual with package/local/current final version in either argument order.
                  text = re.sub(r'(assertEqual\([^\n]*?,\s*["\'])1\.12\.19(["\']\))', r'\g<1>1.12.20\2', text)
                  if path.name == 'test_channel_completeness_v11220.py':
                      text = text.replace('test_channel_completeness_patch_is_idempotent_and_public_version_stays_v11219', 'test_channel_completeness_patch_is_idempotent_and_public_release_is_v11220')
                      text = text.replace('assert local["version"] == package["version"] == "1.12.19"', 'assert local["version"] == package["version"] == "1.12.20"')
                      if 'assert "v1.12.20" in package.get("history", {})' not in text:
                          needle = 'assert local["version"] == package["version"] == "1.12.20"\n'
                          text = text.replace(needle, needle + '    assert "v1.12.20" in package.get("history", {})\n', 1)
                  if text != original:
                      path.write_text(text, encoding='utf-8')
          PY
          git config user.name "liheng-lk"
          git config user.email "69590718+liheng-lk@users.noreply.github.com"
          git add package.v3.json plugins.v3/guangyatransferassistant/plugin.json plugins.v3/guangyatransferassistant/README.md tests
          if git diff --cached --quiet; then
            echo "release contracts already synchronized"
          else
            git commit -m "release(guangya): synchronize v1.12.20 contracts"
            git push origin HEAD:${{ github.head_ref }}
          fi
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: V3 plugin contract tests
        run: |
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: V3 dependency manifests
        run: |
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"
          python - <<'PY'
          from pathlib import Path
          import tomllib
          for path in Path('plugins.v3').glob('*/pyproject.toml'):
              with path.open('rb') as f:
                  project = tomllib.load(f)['project']
              assert project.get('dynamic') == ['version'], path
              assert project.get('requires-python') == '>=3.12', path
          shuk = Path('plugins.v3/shukguangyadisk')
          assert not (shuk / 'pyproject.toml').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          assert not (shuk / 'requirements.txt').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          PY
      - name: JSON indexes
        run: python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['plugin.json','package.v2.json','package.v3.json']]"
      - name: Cleanup test artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: No generated Python artifacts
        run: test -z "$(find . -type f -name '*.pyc' -o -type d -name '__pycache__')"
