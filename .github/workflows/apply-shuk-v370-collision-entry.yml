name: Apply Shuk v3.7 collision entry fix

on:
  push:
    branches: [refactor/shukguangya-organizer-core-v370]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply collision-entry fix
        run: python .github/scripts/fix_shuk_v370_collision_entry.py

      - name: Parse organizer runtime
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          find plugins.v3/shukguangyadisk -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3/shukguangyadisk -type f -name '*.pyc' -delete

      - name: Execute entry and destructive behavior tests
        run: |
          python tests/v3/shukguangyadisk/test_existing_target_behavior_v370.py
          python tests/v3/shukguangyadisk/test_existing_target_batch_behavior_v370.py
          python tests/v3/shukguangyadisk/test_existing_target_entry_behavior_v370.py
          python tests/v3/shukguangyadisk/test_non_actionable_state_v370.py
          python tests/v3/shukguangyadisk/test_organizer_policy_v370.py

      - name: Execute all Shuk contracts
        run: |
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py

      - name: Execute repository regressions
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Static policy invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('plugins.v3/shukguangyadisk/organizer_conflict_resolution_v353.py').read_text(encoding='utf-8')
          assert 'preview_members_valid = not (' in p
          assert 'if preview_members_valid:' in p
          assert 'if not preview_members_valid:' in p
          assert 'if safe:\n        existing_result = _handle_existing_target_groups' not in p
          print('collision entry invariants OK')
          PY

      - name: Commit fix and remove temporary tooling
        run: |
          rm -f .github/scripts/fix_shuk_v370_collision_entry.py
          rm -f .github/workflows/apply-shuk-v370-collision-entry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins.v3/shukguangyadisk/organizer_conflict_resolution_v353.py tests/v3/shukguangyadisk .github
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(shuk): enforce policy before duplicate-target resolver'
          git push origin HEAD:refactor/shukguangya-organizer-core-v370
