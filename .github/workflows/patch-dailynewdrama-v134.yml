name: Patch DailyNewDrama v1.3.4 GET auth fix
on:
  push:
    branches: [dailynewdrama-v1.3.4-get-auth-fix]
    paths: [.github/workflows/patch-dailynewdrama-v134.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-v1.3.4-get-auth-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and test
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('plugins.v2/dailynewdrama/__init__.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('plugin_version = "1.3.3"','plugin_version = "1.3.4"',1)
          s=s.replace('"methods": ["POST"],\n                "summary": "按序号订阅当前新剧",','"methods": ["GET"],\n                "summary": "按序号订阅当前新剧",',1)
          s=s.replace('"method": "post",\n                                        "params": {"indexes": str(item.get("index") or ""), "batch_id": batch_id, "apikey": settings.API_TOKEN},','"method": "get",\n                                        "params": {"indexes": str(item.get("index") or ""), "batch_id": batch_id, "apikey": settings.API_TOKEN},',1)
          # 诊断文案明确 GET query 传输层
          s=s.replace('【每日新剧助手】【页面鉴权诊断】构建订阅按钮:', '【每日新剧助手】【页面鉴权诊断】构建GET订阅按钮:', 1)
          p.write_text(s,encoding='utf-8')

          for name in ['package.v2.json','plugin.json']:
              path=Path(name); data=json.loads(path.read_text(encoding='utf-8')); item=data['DailyNewDrama']; item['version']='1.3.4'; item['history']={'v1.3.4':'修复 MoviePilot 页面订阅 POST 参数无法进入 API 鉴权层的问题，改为官方兼容的 GET + query apikey 调用',**(item.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          path=Path('plugins.v2/dailynewdrama/plugin.json'); data=json.loads(path.read_text(encoding='utf-8')); data['version']='1.3.4'; data['history']={'v1.3.4':'修复 MoviePilot 页面订阅 POST 参数无法进入 API 鉴权层的问题，改为官方兼容的 GET + query apikey 调用',**(data.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for test_name in ['tests/test_dailynewdrama_v13.py','tests/test_dailynewdrama_api_contract.py','tests/test_dailynewdrama_auth_contract.py']:
              tp=Path(test_name)
              if tp.exists():
                  ts=tp.read_text(encoding='utf-8').replace('"1.3.3"','"1.3.4"').replace("'1.3.3'","'1.3.4'")
                  # v1.3.4 contract: page must use GET and API must expose GET
                  if test_name.endswith('test_dailynewdrama_api_contract.py'):
                      ts=ts.replace("assert '\"params\": {\"indexes\":' in text", "assert '\"params\": {\"indexes\":' in text\nassert '\"method\": \"get\"' in text\nassert '\"methods\": [\"GET\"]' in text")
                  tp.write_text(ts,encoding='utf-8')
          # Dedicated regression contract
          Path('tests/test_dailynewdrama_v134_get_auth.py').write_text('''from pathlib import Path\nimport json\nROOT=Path(__file__).resolve().parents[1]\ntext=(ROOT/'plugins.v2/dailynewdrama/__init__.py').read_text(encoding='utf-8')\nassert 'plugin_version = "1.3.4"' in text\nassert '"method": "get"' in text\nassert '"methods": ["GET"]' in text\nassert '"apikey": settings.API_TOKEN' in text\nassert '【每日新剧助手】【订阅API诊断】收到请求' in text\nassert '"method": "post"' not in text[text.find('"api": "plugin/DailyNewDrama/subscribe"')-200:text.find('"api": "plugin/DailyNewDrama/subscribe"')+500]\nassert json.loads((ROOT/'package.v2.json').read_text())['DailyNewDrama']['version']=='1.3.4'\nassert json.loads((ROOT/'plugin.json').read_text())['DailyNewDrama']['version']=='1.3.4'\nassert json.loads((ROOT/'plugins.v2/dailynewdrama/plugin.json').read_text())['version']=='1.3.4'\n''',encoding='utf-8')
          PY
          python -m compileall -q plugins.v2/dailynewdrama
          python -m unittest discover -s tests -p 'test_dailynewdrama*.py' -v
          python tests/test_dailynewdrama_v134_get_auth.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v2/dailynewdrama/__init__.py plugins.v2/dailynewdrama/plugin.json package.v2.json plugin.json tests/test_dailynewdrama*.py
          git commit -m 'fix: DailyNewDrama v1.3.4 use GET query auth for page subscribe'
          git push origin HEAD:dailynewdrama-v1.3.4-get-auth-fix
