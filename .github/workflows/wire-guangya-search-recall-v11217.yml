name: Wire GuangYa v1.12.17 Search Recall

on:
  push:
    branches:
      - feat/guangya-v1.12.17-search-recall
    paths:
      - 'plugins.v3/guangyatransferassistant/**'
      - 'tests/v3/guangyatransferassistant/**'
      - 'scripts/_wire_guangya_search_recall_v11217.py'
      - '.github/workflows/wire-guangya-search-recall-v11217.yml'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guangya-v1.12.17-search-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply nested recall wiring
        run: python scripts/_wire_guangya_search_recall_v11217.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant
          find plugins.v3/guangyatransferassistant -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3/guangyatransferassistant -type f -name '*.pyc' -delete
      - name: Focused v1.12.17 behavior
        run: |
          python tests/v3/guangyatransferassistant/test_search_recall_v11217.py
          python tests/v3/guangyatransferassistant/test_movie_bilingual_identity_v11216.py
      - name: Root contracts
        run: python -m unittest discover -s tests -v
      - name: GuangYa V3 contracts
        run: python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Finalize green candidate only
        run: |
          rm -f scripts/_wire_guangya_search_recall_v11217.py
          rm -f .github/workflows/wire-guangya-search-recall-v11217.yml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No candidate changes to commit'
          else
            git commit -m 'feat(guangya): wire v1.12.17 structured search recall'
            git push origin HEAD:feat/guangya-v1.12.17-search-recall
          fi
