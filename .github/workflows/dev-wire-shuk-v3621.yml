name: Wire ShukGuangYaDisk v3.6.21 probe

on:
  push:
    branches: [fix/shuk-admission-probe-v3621]

permissions:
  contents: write

concurrency:
  group: wire-shuk-v3621
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire final runtime order and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          execution_path = Path('plugins.v3/shukguangyadisk/organizer_execution_v360.py')
          text = execution_path.read_text(encoding='utf-8')
          flag_needle = '    _v3611_retry_patch_ready: bool = False\n    _v3612_pending_patch_ready: bool = False\n'
          flag_repl = '    _v3611_retry_patch_ready: bool = False\n    _v3621_admission_probe_ready: bool = False\n    _v3612_pending_patch_ready: bool = False\n'
          assert flag_needle in text
          text = text.replace(flag_needle, flag_repl, 1)

          install_needle = '''            install_durable_retry_v3611()\n            self._v3611_retry_patch_ready = True\n        if not self._v3612_pending_patch_ready:\n'''
          install_repl = '''            install_durable_retry_v3611()\n            self._v3611_retry_patch_ready = True\n        if not self._v3621_admission_probe_ready:\n            # v3.6.21 必须晚于 v3.6.11：它要包住 durable bridge 已安装后的最终\n            # monitor fallback，才能找回被 MoviePilot 同步工作流泛化掉的精确准入冲突。\n            from .organizer_admission_conflict_probe_v3621 import install_admission_conflict_probe_v3621\n\n            install_admission_conflict_probe_v3621()\n            self._v3621_admission_probe_ready = True\n        if not self._v3612_pending_patch_ready:\n'''
          assert install_needle in text
          text = text.replace(install_needle, install_repl, 1)
          execution_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/v3/shukguangyadisk/test_admission_conflict_probe_v3621.py')
          tests = test_path.read_text(encoding='utf-8')
          needle = '    module._execution_class = lambda: Exec\n'
          count = tests.count(needle)
          assert count == 3, count
          tests = tests.replace(needle, needle + '    module._monitor_class = lambda: Exec\n')
          test_path.write_text(tests, encoding='utf-8')
          PY
          python -m compileall -q plugins.v3/shukguangyadisk tests/v3/shukguangyadisk
          find plugins.v3 tests/v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3 tests/v3 -type f -name '*.pyc' -delete
          python tests/v3/shukguangyadisk/run_contract_tests.py
      - name: Commit wiring and self-delete
        run: |
          rm -f .github/workflows/dev-wire-shuk-v3621.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.v3/shukguangyadisk/organizer_execution_v360.py \
                  tests/v3/shukguangyadisk/test_admission_conflict_probe_v3621.py \
                  .github/workflows/dev-wire-shuk-v3621.yml
          git commit -m "fix(shuk): install v3.6.21 after durable fallback"
          git push origin HEAD:fix/shuk-admission-probe-v3621
