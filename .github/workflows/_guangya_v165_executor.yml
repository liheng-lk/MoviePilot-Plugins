name: Temporary GuangYa v1.6.5 Executor
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-runtime-trigger-v1.6.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_guangya_v165.py
      - name: Validate focused plugin
        run: |
          python -m py_compile plugins.v3/guangyatransferassistant/__init__.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/v3/guangyatransferassistant/test_plugin_contract.py')
          tests = [(n, f) for n, f in ns.items() if n.startswith('test_') and callable(f)]
          for name, fn in tests:
              fn()
          print(f'{len(tests)} GuangYa contract tests passed')
          PY
          python -m json.tool package.v3.json >/dev/null
          python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Commit formal changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.v3.json plugins.v3/guangyatransferassistant/__init__.py plugins.v3/guangyatransferassistant/plugin.json tests/v3/guangyatransferassistant/test_plugin_contract.py
          git commit -m 'fix: make GuangYa hot-upgrade runtime self-starting v1.6.5'
          git push origin HEAD:fix/guangya-runtime-trigger-v1.6.5
