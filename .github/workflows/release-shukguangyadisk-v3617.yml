name: Release ShukGuangYaDisk v3.6.17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-shukguangyadisk-v3617.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump ShukGuangYaDisk to v3.6.17
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          old_version = '3.6.16'
          version = '3.6.17'
          history = (
              '增加 blocked 只读诊断，定位仍存在但不应盲目清理的安全阻断成员：启动日志与状态 API 展示实际文件路径、阻断原因、'
              '是否为 v3.6.11 persistent admission、定时复核是否到期以及 MoviePilot history/task/revision 身份；最多展示 12 条。'
              'task id 缩短显示，reason 中 access/refresh token、Authorization/Bearer 自动遮罩。诊断严格只读 OrganizerStateStore，'
              '不调用 mutate/clear_blocked/mark_*，不修改 scheduler、durable retry、MoviePilot 媒体业务规则或文件操作。'
          )

          local_meta_path = plugin / 'plugin.json'
          local_meta = json.loads(local_meta_path.read_text(encoding='utf-8'))
          assert local_meta['version'] == old_version, local_meta['version']
          local_meta['version'] = version
          local_meta['history'] = {f'v{version}': history, **dict(local_meta.get('history') or {})}
          local_meta_path.write_text(json.dumps(local_meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = root / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          market = dict(package['ShukGuangYaDisk'])
          assert market['version'] == old_version, market['version']
          market['version'] = version
          market['history'] = {f'v{version}': history, **dict(market.get('history') or {})}
          package['ShukGuangYaDisk'] = market
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          entry_path = plugin / '__init__.py'
          entry = entry_path.read_text(encoding='utf-8')
          old = f'plugin_version = "{old_version}"'
          assert old in entry
          entry_path.write_text(entry.replace(old, f'plugin_version = "{version}"', 1), encoding='utf-8')

          remote_path = plugin / 'dist' / 'assets' / 'remoteEntry.js'
          remote = remote_path.read_text(encoding='utf-8')
          assert f'?v={old_version}' in remote
          remote_path.write_text(remote.replace(f'?v={old_version}', f'?v={version}'), encoding='utf-8')
          PY
      - name: Validate release contracts
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          assert json.loads((plugin / 'plugin.json').read_text(encoding='utf-8'))['version'] == '3.6.17'
          assert json.loads((root / 'package.v3.json').read_text(encoding='utf-8'))['ShukGuangYaDisk']['version'] == '3.6.17'
          assert 'plugin_version = "3.6.17"' in (plugin / '__init__.py').read_text(encoding='utf-8')
          assert '?v=3.6.17' in (plugin / 'dist' / 'assets' / 'remoteEntry.js').read_text(encoding='utf-8')
          execution = (plugin / 'organizer_execution_v360.py').read_text(encoding='utf-8')
          diagnostics = (plugin / 'organizer_blocked_diagnostics_v3617.py').read_text(encoding='utf-8')
          assert '"runtime_hardening": "v3.6.17"' in execution
          assert 'blocked_diagnostics(self)' in execution
          assert 'plugin._state().load()' in diagnostics
          for forbidden in ('.clear_blocked(', '.mark_blocked(', '.mark_failed(', '.mark_completed('):
              assert forbidden not in diagnostics, forbidden
          PY
      - name: Commit v3.6.17 release and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/release-shukguangyadisk-v3617.yml
          git add plugins.v3/shukguangyadisk/plugin.json \
                  plugins.v3/shukguangyadisk/__init__.py \
                  plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js \
                  package.v3.json
          git commit -m "release(shukguangyadisk): v3.6.17 blocked diagnostics"
          git push origin main
