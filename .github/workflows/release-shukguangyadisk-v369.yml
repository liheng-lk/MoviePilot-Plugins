name: Release ShukGuangYaDisk v3.6.9

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-shukguangyadisk-v369.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump ShukGuangYaDisk to v3.6.9
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          old_version = '3.6.8'
          version = '3.6.9'
          history = (
              '深度运行时硬化：修复路径逐级只读第一页导致大目录第二页以后误报不存在、GuangYaApi 类级缓存跨实例污染、'
              '网络/API失败被目录 list 伪装为空目录；known-resource 单轮远端预算从 500 收敛到 24，且每个监控周期在 known '
              '检查后继续推进 50 目录 discovery 游标；成功完整读取目录后仅按直属路径局部回收已消失状态，提升短周期监控灵敏度与长期运行效率。'
          )

          local_meta_path = plugin / 'plugin.json'
          local_meta = json.loads(local_meta_path.read_text(encoding='utf-8'))
          assert local_meta['version'] == old_version, local_meta['version']
          local_meta['version'] = version
          old_history = dict(local_meta.get('history') or {})
          local_meta['history'] = {f'v{version}': history, **old_history}
          local_meta_path.write_text(json.dumps(local_meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = root / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          market = dict(package['ShukGuangYaDisk'])
          assert market['version'] == old_version, market['version']
          market['version'] = version
          market_history = dict(market.get('history') or {})
          market['history'] = {f'v{version}': history, **market_history}
          package['ShukGuangYaDisk'] = market
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          entry_path = plugin / '__init__.py'
          entry = entry_path.read_text(encoding='utf-8')
          old = f'plugin_version = "{old_version}"'
          assert old in entry, 'unexpected ShukGuangYaDisk plugin_version before v3.6.9 release'
          entry_path.write_text(entry.replace(old, f'plugin_version = "{version}"', 1), encoding='utf-8')

          remote_path = plugin / 'dist' / 'assets' / 'remoteEntry.js'
          remote = remote_path.read_text(encoding='utf-8')
          assert f'?v={old_version}' in remote, 'unexpected ShukGuangYaDisk remoteEntry cache version before v3.6.9 release'
          remote_path.write_text(remote.replace(f'?v={old_version}', f'?v={version}'), encoding='utf-8')
          PY
      - name: Validate release contracts
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          assert json.loads((plugin / 'plugin.json').read_text(encoding='utf-8'))['version'] == '3.6.9'
          assert json.loads((root / 'package.v3.json').read_text(encoding='utf-8'))['ShukGuangYaDisk']['version'] == '3.6.9'
          assert 'plugin_version = "3.6.9"' in (plugin / '__init__.py').read_text(encoding='utf-8')
          assert '?v=3.6.9' in (plugin / 'dist' / 'assets' / 'remoteEntry.js').read_text(encoding='utf-8')
          PY
      - name: Commit v3.6.9 release and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/release-shukguangyadisk-v369.yml
          git add plugins.v3/shukguangyadisk/plugin.json \
                  plugins.v3/shukguangyadisk/__init__.py \
                  plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js \
                  package.v3.json
          git commit -m "release(shukguangyadisk): v3.6.9 runtime hardening"
          git push origin main
