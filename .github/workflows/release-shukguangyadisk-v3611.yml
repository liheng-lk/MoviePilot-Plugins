name: Release ShukGuangYaDisk v3.6.11

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-shukguangyadisk-v3611.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump ShukGuangYaDisk to v3.6.11
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          old_version = '3.6.10'
          version = '3.6.11'
          history = (
              '修复 MoviePilot durable 失败任务被自动整理重新构造 planning_input 后触发“整理源文件已按不同输入准入”的问题；'
              '失败历史在重试预算内且绑定 transfer_task_id 时，改为通过 TransferExecutionCommand.request_retry 复用原 durable task/checkpoint，'
              '不再新建 planning；retry_wait/running/settling 幂等等待，端口暂时失败回插件 retry；'
              '源文件版本变化时禁止复用旧冻结计划；既有准入冲突改为按 MoviePilot durable 证据持久阻断/变化后重评，不再每10分钟盲目重撞。'
          )

          local_meta_path = plugin / 'plugin.json'
          local_meta = json.loads(local_meta_path.read_text(encoding='utf-8'))
          assert local_meta['version'] == old_version, local_meta['version']
          local_meta['version'] = version
          local_meta['history'] = {f'v{version}': history, **dict(local_meta.get('history') or {})}
          local_meta_path.write_text(json.dumps(local_meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = root / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          market = dict(package['ShukGuangYaDisk'])
          assert market['version'] == old_version, market['version']
          market['version'] = version
          market['history'] = {f'v{version}': history, **dict(market.get('history') or {})}
          package['ShukGuangYaDisk'] = market
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          entry_path = plugin / '__init__.py'
          entry = entry_path.read_text(encoding='utf-8')
          old = f'plugin_version = "{old_version}"'
          assert old in entry
          entry_path.write_text(entry.replace(old, f'plugin_version = "{version}"', 1), encoding='utf-8')

          remote_path = plugin / 'dist' / 'assets' / 'remoteEntry.js'
          remote = remote_path.read_text(encoding='utf-8')
          assert f'?v={old_version}' in remote
          remote_path.write_text(remote.replace(f'?v={old_version}', f'?v={version}'), encoding='utf-8')
          PY
      - name: Validate release contracts
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          assert json.loads((plugin / 'plugin.json').read_text(encoding='utf-8'))['version'] == '3.6.11'
          assert json.loads((root / 'package.v3.json').read_text(encoding='utf-8'))['ShukGuangYaDisk']['version'] == '3.6.11'
          assert 'plugin_version = "3.6.11"' in (plugin / '__init__.py').read_text(encoding='utf-8')
          assert '?v=3.6.11' in (plugin / 'dist' / 'assets' / 'remoteEntry.js').read_text(encoding='utf-8')
          PY
      - name: Commit v3.6.11 release and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/release-shukguangyadisk-v3611.yml
          git add plugins.v3/shukguangyadisk/plugin.json \
                  plugins.v3/shukguangyadisk/__init__.py \
                  plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js \
                  package.v3.json
          git commit -m "release(shukguangyadisk): v3.6.11 durable retry bridge"
          git push origin main
