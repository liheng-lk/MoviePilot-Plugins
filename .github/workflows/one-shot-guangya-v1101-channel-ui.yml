name: One-shot finalize GuangYaTransferAssistant v1.10.1 channel UI
on:
  push:
    branches: [fix/guangya-v1101-channel-ui]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1101-channel-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch release files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('plugins.v3/guangyatransferassistant/__init__.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('光鸭转存助手 v1.10.0 运行入口','光鸭转存助手 v1.10.1 运行入口',1)
          m='from .channel_sources_v190 import install_channel_multisource_compat\n'
          if 'from .channel_ui_v1101 import GuangYaChannelUiV1101Mixin\n' not in s: s=s.replace(m,m+'from .channel_ui_v1101 import GuangYaChannelUiV1101Mixin\n',1)
          m='class GuangYaTransferAssistant(\n    GuangYaConfigUiV1100Mixin,\n'
          if '    GuangYaChannelUiV1101Mixin,\n' not in s: s=s.replace(m,'class GuangYaTransferAssistant(\n    GuangYaChannelUiV1101Mixin,\n    GuangYaConfigUiV1100Mixin,\n',1)
          s=s.replace('plugin_version = "1.10.0"','plugin_version = "1.10.1"',1).replace('build_id = "20260901-r11"','build_id = "20260901-r12"',1); p.write_text(s,encoding='utf-8')
          p=Path('plugins.v3/guangyatransferassistant/plugin.json'); d=json.loads(p.read_text(encoding='utf-8')); d['version']='1.10.1'; d['description']='MoviePilot V3 固定分流与多来源订阅助手：响应式控制台恢复独立频道资源索引与频道配置，提供观影/迅雷/Magnet/ED2K 统一搜索、秒传预检与一键完整诊断；固定优先级“观影迅雷秒传 > 光鸭直接转存 > Magnet > ED2K”，Magnet/ED2K 继续走光鸭原生云添加。'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('package.v3.json'); d=json.loads(p.read_text(encoding='utf-8')); x=d['GuangYaTransferAssistant']; x['version']='1.10.1'; h=dict(x.get('history') or {}); x['history']={'v1.10.1':'恢复频道资源明细与独立频道配置区域，新增脱敏频道资源 API；不改变既有抓取、ResourceGroup 和转存决策逻辑。',**h}; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('plugins.v3/guangyatransferassistant/README.md'); s=p.read_text(encoding='utf-8'); a='## v1.10.0：控制台、统一搜索与秒传可靠性\n'; sec='## v1.10.1：恢复频道资源与独立配置\n\n- 首页重新展示频道索引明细：标题、TMDB、集数、来源、ResourceGroup 可用方式和缓存/过期状态。\n- 配置页新增独立“频道资源”区域，频道地址、刷新频率、抓取边界与同帖 Magnet/ED2K 开关集中管理。\n- 新增 `/channels/resources` 脱敏只读接口，不返回光鸭分享 URL 或 Magnet/ED2K 原始 URI。\n\n';
          if sec.splitlines()[0] not in s: p.write_text(s.replace(a,sec+a,1),encoding='utf-8')
          for p in Path('tests/v3/guangyatransferassistant').glob('test_*.py'):
              s=p.read_text(encoding='utf-8'); n=s.replace('== "1.10.0"','== "1.10.1"').replace('plugin_version = "1.10.0"','plugin_version = "1.10.1"').replace('build_id = "20260901-r11"','build_id = "20260901-r12"');
              if n!=s: p.write_text(n,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m pip install -q pytest
          python -m compileall -q plugins.v3/guangyatransferassistant
          python -m pytest tests/v3/guangyatransferassistant -q
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          python -m unittest discover -s tests -v
          python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['plugin.json','package.v2.json','package.v3.json']]"
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-guangya-v1101-channel-ui.yml
          git add package.v3.json plugins.v3/guangyatransferassistant tests/v3/guangyatransferassistant
          git commit -m "fix: restore channel resources and config in v1.10.1"
          git push origin HEAD:fix/guangya-v1101-channel-ui
