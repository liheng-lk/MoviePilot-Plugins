name: Patch DailyAssistant package index

on:
  push:
    branches:
      - feature/daily-gysub-v1110

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-gysub-v1110
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch package.v3.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.v3.json')
          package = json.loads(path.read_text(encoding='utf-8'))
          entry = {
              'name': '每日助手',
              'description': '全媒体榜单发现助手：聚合 Netflix/HBO/Apple TV+/Disney+/Crunchyroll/Prime/Hulu/猫眼/豆瓣/IMDb/TMDB/AniList/Bangumi/腾讯等榜单，统一 TMDB 识别后通过 GYSub 接入光鸭固定转存路线。',
              'labels': '榜单,Netflix,HBO,Apple TV+,Disney+,Crunchyroll,Amazon Prime,Hulu,猫眼,豆瓣,IMDb,TMDB,AniList,Bangumi,腾讯视频,GYSub,光鸭转存',
              'version': '1.0.0',
              'icon': 'movie.jpg',
              'author': 'liheng-lk',
              'level': 1,
              'system_version': '>=3.0.0',
              'history': {
                  'v1.0.0': '新增全媒体榜单发现层；候选统一到 TMDB 精确身份，支持手动或按榜单自动提交 GYSub，并复用光鸭转存助手现有固定路线。'
              },
          }
          package = {'DailyAssistant': entry, **{k: v for k, v in package.items() if k != 'DailyAssistant'}}
          path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit package index
        shell: bash
        run: |
          if git diff --quiet -- package.v3.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.v3.json
          git commit -m 'chore(dailyassistant): publish package index'
          git push origin HEAD:feature/daily-gysub-v1110
