name: Patch GuangYa channel ED2K v1.11.2

on:
  push:
    branches:
      - fix/guangya-channel-ed2k-cloudadd-v1112

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-channel-ed2k-cloudadd-v1112
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/tmp_patch_guangya_channel_ed2k_v1112.py
      - name: Validate focused tests
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant
          python -m unittest discover -s tests -p 'test_guangya_*.py' -v
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.v3.json plugins.v3/guangyatransferassistant tests
          git commit -m "fix: dispatch channel ED2K through GuangYa cloud add"
          git push origin HEAD:fix/guangya-channel-ed2k-cloudadd-v1112
