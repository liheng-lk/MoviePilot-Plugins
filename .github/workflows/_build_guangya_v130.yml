name: Build GuangYa Transfer v1.3.0
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_build_guangya_v130.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guangya-missing-episodes-airing-v1.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.3.0 patch
