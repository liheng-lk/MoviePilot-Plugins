              'TOTAL_EPISODE_PATTERN = re.compile(r"(?:全|共|总共|共计)\\s*(\\d{1,4})\\s*(?:集|话)", re.I)\n'
              'COMPLETE_HINT_PATTERN = re.compile(r"(?:已?完结|全集|全季|大结局|\\bcomplete\\b|\\bend\\b)", re.I)\n'
              'ONGOING_HINT_PATTERN = re.compile(r"(?:更新至|更新到|更至|连载中?|持续更新|热更中?)", re.I)\n',
              'serial constants',
          )
          replace_once(
              '    total_match = re.search(r"全\\s*(\\d{1,4})\\s*集", text)\n',
              '    total_match = TOTAL_EPISODE_PATTERN.search(text)\n',
              'total episode parser',
          )

          marker = '\ndef _safe_relative_path(value: Any) -> str:\n'
          assert marker in text, 'safe path marker missing'
          serial_helper = r'''

def _entry_serial_state(entry: Dict[str, Any]) -> Dict[str, Any]:
    """从频道消息判断当前更新集、明确总集数以及连载/完结提示。"""
    value = str(entry.get("text") or "")
    explicit_total = 0
    try:
        explicit_total = int(entry.get("total_episode_hint") or 0)
    except (TypeError, ValueError):
        explicit_total = 0
    if not explicit_total:
        total_match = TOTAL_EPISODE_PATTERN.search(value)
        if total_match:
            explicit_total = int(total_match.group(1))

    current_episode = 0
    _, episode_values = _episode_numbers(entry.get("episode_hint") or value)
    if episode_values:
        current_episode = max(episode_values)
    if not current_episode:
        current_match = re.search(r"(?:更新至|更新到|更至)\s*0*(\d{1,4})\s*(?:集|话)", value, re.I)
        if current_match:
            current_episode = int(current_match.group(1))

    complete = bool(COMPLETE_HINT_PATTERN.search(value))
    ongoing = bool(ONGOING_HINT_PATTERN.search(value)) and not complete
    return {
        "explicit_total": explicit_total,
        "current_episode": current_episode,
        "complete": complete,
        "ongoing": ongoing,
    }
'''
          text = text.replace(marker, serial_helper + marker, 1)

          replace_once(
              '    _sync_subscription_progress = True\n    _history_pages = 3\n',
              '    _sync_subscription_progress = True\n    _protect_ongoing = True\n    _ongoing_guard_days = 10\n    _history_pages = 3\n',
