name: Prepare GuangYa v1.12.16 r2

on:
  push:
    branches:
      - fix/guangya-v1.12.16-bilingual-identity
    paths:
      - .github/workflows/prepare-guangya-v11216-r2.yml
      - scripts/_prepare_guangya_v11216_r2.py

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.16-bilingual-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic migration
        run: python scripts/_prepare_guangya_v11216_r2.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: V3 plugin contract tests
        run: |
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: V3 dependency manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          for manifest in root.glob('plugins.v3/*/requirements.txt'):
              assert manifest.read_text(encoding='utf-8').strip(), manifest
          json.loads((root / 'package.v3.json').read_text(encoding='utf-8'))
          PY
      - name: JSON indexes
        run: |
          python -m json.tool package.v3.json >/dev/null
          python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Cleanup generated test artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: No generated Python artifacts
        run: |
          test -z "$(find . -type d -name '__pycache__' -print -quit)"
          test -z "$(find . -type f -name '*.pyc' -print -quit)"
      - name: Commit validated release only
        run: |
          rm -f .github/workflows/prepare-guangya-v11216.yml
          rm -f .github/workflows/prepare-guangya-v11216-r2.yml
          rm -f scripts/_prepare_guangya_v11216_r2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'release(guangya): finalize v1.12.16 bilingual identity fix'
          git push origin HEAD:fix/guangya-v1.12.16-bilingual-identity
