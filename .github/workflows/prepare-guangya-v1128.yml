name: Prepare GuangYa v1.12.8 release

on:
  push:
    branches:
      - fix/guangya-v1.12.8-gysub-bridge

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.8-gysub-bridge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.12.8 hotfix migration
        run: python scripts/_prepare_guangya_v1128.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Root unit tests
        run: python -m unittest discover -s tests -v
      - name: GuangYa V3 contract tests
        run: python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: JSON metadata checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          plugin = json.loads((root/'plugins.v3/guangyatransferassistant/plugin.json').read_text())
          package = json.loads((root/'package.v3.json').read_text())['GuangYaTransferAssistant']
          assert plugin['version'] == package['version'] == '1.12.8'
          assert 'v1.12.8' in package['history'] and 'v1.12.7' in package['history']
          PY
      - name: Remove one-shot release tooling
        run: |
          rm -f .github/workflows/prepare-guangya-v1128.yml
          rm -f scripts/_prepare_guangya_v1128.py
      - name: Commit validated v1.12.8
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'release(guangya): finalize v1.12.8 gysub command hotfix'
          git push origin HEAD:fix/guangya-v1.12.8-gysub-bridge
