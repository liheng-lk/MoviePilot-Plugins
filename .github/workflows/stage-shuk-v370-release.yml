name: Stage ShukGuangYaDisk v3.7.0 release

on:
  push:
    branches: [refactor/shukguangya-organizer-core-v370]

permissions:
  contents: write

jobs:
  stage-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate staging script syntax
        run: python -m py_compile .github/scripts/stage_shuk_v370_release.py

      - name: Apply v3.7.0 release metadata
        run: python .github/scripts/stage_shuk_v370_release.py

      - name: Parse plugin runtime
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          find plugins.v3/shukguangyadisk -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3/shukguangyadisk -type f -name '*.pyc' -delete

      - name: Run v3.7.0 focused release tests
        run: |
          python tests/v3/shukguangyadisk/test_release_v370.py
          python tests/v3/shukguangyadisk/test_organizer_policy_v370.py
          python tests/v3/shukguangyadisk/test_existing_target_behavior_v370.py
          python tests/v3/shukguangyadisk/test_existing_target_batch_behavior_v370.py
          python tests/v3/shukguangyadisk/test_existing_target_entry_behavior_v370.py
          python tests/v3/shukguangyadisk/test_non_actionable_state_v370.py

      - name: Run all Shuk tests and contracts
        run: |
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py

      - name: Run repository regression
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate JSON manifests and cross-plugin isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('package.v3.json').read_text(encoding='utf-8'))
          plugin = json.loads(Path('plugins.v3/shukguangyadisk/plugin.json').read_text(encoding='utf-8'))
          assert package['ShukGuangYaDisk']['version'] == '3.7.0'
          assert plugin['version'] == '3.7.0'
          assert package['GuangYaTransferAssistant']['version'] == '1.12.14'
          assert 'v3.7.0' in package['ShukGuangYaDisk']['history']
          assert 'v3.7.0' in plugin['history']
          print('release manifests OK')
          PY

      - name: Commit release staging and remove one-time tooling
        run: |
          rm -f .github/scripts/stage_shuk_v370_release.py
          rm -f .github/workflows/stage-shuk-v370-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'release(shukguangyadisk): stage v3.7.0 organizer policy core'
          git push origin HEAD:refactor/shukguangya-organizer-core-v370
