name: GuangYa Transfer v1.1.0 Build

on:
  pull_request:
  push:
    branches:
      - fix/guangya-transfer-auto-incremental-v1.1.0
    paths:
      - .github/workflows/guangya-transfer-v110-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-transfer-auto-incremental-v1.1.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.1.0 patch
        run: |
          python .github/fix_guangya_v110_patch.py
          python .github/guangya_transfer_v110_patch.py
      - name: Validate plugin
        run: |
          python -m py_compile plugins.v3/guangyatransferassistant/__init__.py
          python -m pip install -q pytest
          python -m pytest -q tests/v3/guangyatransferassistant/test_plugin_contract.py
          python -m json.tool package.v3.json >/dev/null
          python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          text = Path('plugins.v3/guangyatransferassistant/__init__.py').read_text(encoding='utf-8')
          required = [
              'plugin_version = "1.1.0"',
              '_process_selected_subscriptions',
              'transfer_inventory',
              '_plan_incremental_files',
              '_restore_items',
              '频道资源（',
              '同一分享热更不会重转旧文件',
          ]
          for token in required:
              assert token in text, token
          assert 'self.refresh_channels(force=True)\n        if self._auto_transfer_on_refresh' in text
          print('GuangYa transfer v1.1.0 contract OK')
          PY
      - name: Commit final plugin files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/fix_guangya_v110_patch.py .github/guangya_transfer_v110_patch.py .github/workflows/guangya-transfer-v110-build.yml
          git add plugins.v3/guangyatransferassistant/__init__.py plugins.v3/guangyatransferassistant/plugin.json package.v3.json tests/v3/guangyatransferassistant/test_plugin_contract.py
          git commit -m "feat: make GuangYa transfer automatic and incremental"
          git push origin HEAD:fix/guangya-transfer-auto-incremental-v1.1.0
