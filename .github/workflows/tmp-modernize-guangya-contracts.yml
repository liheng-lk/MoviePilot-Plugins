name: Modernize GuangYa release contracts

on:
  push:
    branches: [feature/daily-gysub-v1110]
    paths: [.github/workflows/tmp-modernize-guangya-contracts.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-gysub-v1110
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align current-release contracts while preserving historical layers
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('tests/v3/guangyatransferassistant')

          # Only assertions whose subject is the current public entry/package are upgraded.
          # Historical source modules retain their own version/build markers.
          public_version_vars = ('ENTRY', 'ENTRY_TEXT', 'entry', 'entry_text', 'texts[ENTRY]')
          public_build_vars = ('ENTRY', 'ENTRY_TEXT', 'entry', 'entry_text', 'texts[ENTRY]', 'text')
          for path in root.glob('test_*.py'):
              text = path.read_text(encoding='utf-8')

              for old in ('1.10.13', '1.10.16', '1.10.23', '1.10.24'):
                  text = text.replace(
                      f'package["version"] == local["version"] == "{old}"',
                      'package["version"] == local["version"] == "1.11.0"',
                  )
                  text = text.replace(f'package["version"] == "{old}"', 'package["version"] == "1.11.0"')
                  text = text.replace(f'local["version"] == "{old}"', 'local["version"] == "1.11.0"')
                  for var in public_version_vars:
                      text = text.replace(
                          f'\'plugin_version = "{old}"\' in {var}',
                          f'\'plugin_version = "1.11.0"\' in {var}',
                      )

              for old in ('20260902-r24', '20260902-r25', '20260902-r28', '20260902-r31', '20260902-r38', '20260903-r39', '20260903-r40'):
                  for var in public_build_vars:
                      text = text.replace(
                          f'\'build_id = "{old}"\' in {var}',
                          f'\'build_id = "20260903-r41"\' in {var}',
                      )

              path.write_text(text, encoding='utf-8')

          # Current GYING UI no longer directly inherits the historical XunleiFinal/ChannelCursor
          # layer.  It inherits the console-control/cursor aggregate, which itself retains them.
          replacements = {
              'assert "from .channel_cursor_event_v1115 import GuangYaChannelCursorEventV1115Mixin" in ui':
                  'assert "from .console_control_cursor_v1116 import GuangYaConsoleControlCursorV1116Mixin" in ui',
              'assert "class GuangYaGyingUiV1109Mixin(GuangYaChannelCursorEventV1115Mixin):" in ui':
                  'assert "class GuangYaGyingUiV1109Mixin(GuangYaConsoleControlCursorV1116Mixin):" in ui',
              'assert "from .xunlei_final_v1114 import GuangYaXunleiFinalV1114Mixin" in UI_TEXT':
                  'assert "from .console_control_cursor_v1116 import GuangYaConsoleControlCursorV1116Mixin" in UI_TEXT',
              'assert "class GuangYaGyingUiV1109Mixin(GuangYaXunleiFinalV1114Mixin):" in UI_TEXT':
                  'assert "class GuangYaGyingUiV1109Mixin(GuangYaConsoleControlCursorV1116Mixin):" in UI_TEXT',
              'assert "from .xunlei_final_v1114 import GuangYaXunleiFinalV1114Mixin" in UI':
                  'assert "from .console_control_cursor_v1116 import GuangYaConsoleControlCursorV1116Mixin" in UI',
              'assert "class GuangYaGyingUiV1109Mixin(GuangYaXunleiFinalV1114Mixin):" in UI':
                  'assert "class GuangYaGyingUiV1109Mixin(GuangYaConsoleControlCursorV1116Mixin):" in UI',
              'assert "class GuangYaGyingUiV1109Mixin(GuangYaXunleiFinalV1114Mixin):" in ui':
                  'assert "class GuangYaGyingUiV1109Mixin(GuangYaConsoleControlCursorV1116Mixin):" in ui',
          }
          for path in root.glob('test_*.py'):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # The governance contract reads gying_ui_v1109.py itself; keep its real module-local build.
          path = root / 'test_governance_v1114.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('assert \'build_id = "20260902-r25"\' in UI_TEXT', 'assert \'build_id = "20260902-r27"\' in UI_TEXT')
          path.write_text(text, encoding='utf-8')

          # Viewing logging intentionally aggregates dispatch + JSON + integrity.  Preserve all edges
          # and assert the real logging module build (r30), not the final public release build.
          path = root / 'test_viewing_dispatch_v1113.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert "class GuangYaViewingLoggingV1113Mixin(GuangYaViewingDispatchV1113Mixin):" in logging_text',
              '    assert "class GuangYaViewingLoggingV1113Mixin(" in logging_text\n'
              '    assert "GuangYaViewingDispatchV1113Mixin," in logging_text\n'
              '    assert "GuangYaXunleiJsonPipelineV1117Mixin," in logging_text\n'
              '    assert "GuangYaXunleiIntegrityV1116Mixin," in logging_text',
          )
          path.write_text(text, encoding='utf-8')

          path = root / 'test_xunlei_integrity_v1116.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert "GuangYaViewingDispatchV1113Mixin,\\n    GuangYaXunleiIntegrityV1116Mixin," in logging',
              '    assert logging.index("GuangYaViewingDispatchV1113Mixin,") < logging.index("GuangYaXunleiJsonPipelineV1117Mixin,")\n'
              '    assert logging.index("GuangYaXunleiJsonPipelineV1117Mixin,") < logging.index("GuangYaXunleiIntegrityV1116Mixin,")',
          )
          text = text.replace('assert \'build_id = "20260902-r28"\' in logging', 'assert \'build_id = "20260902-r30"\' in logging')
          path.write_text(text, encoding='utf-8')

          # A few public version assertions use subscripted/current-entry expressions that are
          # intentionally not covered by simple variable names above.
          for name in ('test_release_v1111_marker.py', 'test_resource_planner_v190_contract.py', 'test_status_ui_v191.py'):
              path = root / name
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'plugin_version = "1\.10\.(?:13|16|23|24)"', 'plugin_version = "1.11.0"', text)
              path.write_text(text, encoding='utf-8')

          # Native Magnet/ED2K cloudcollection remains a first-class release contract. Restore this
          # useful wording in public metadata rather than weakening the old contract test.
          pkg_path = Path('package.v3.json')
          package = json.loads(pkg_path.read_text(encoding='utf-8'))
          package['GuangYaTransferAssistant']['description'] = (
              '固定分流与多来源订阅助手：迅雷秒传、光鸭直接转存、Magnet/ED2K 光鸭原生云添加共用集级终态与在途栅栏；'
              '新增 TMDB 更新日历、临近播出补漏和每日全员缺集复核。'
          )
          pkg_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          plugin_path = Path('plugins.v3/guangyatransferassistant/plugin.json')
          plugin = json.loads(plugin_path.read_text(encoding='utf-8'))
          plugin['description'] = package['GuangYaTransferAssistant']['description']
          plugin_path.write_text(json.dumps(plugin, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Sanity-check modified contracts
        run: |
          python -m compileall -q tests/v3/guangyatransferassistant
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Commit modernized contracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/v3/guangyatransferassistant package.v3.json plugins.v3/guangyatransferassistant/plugin.json
          git diff --cached --check
          git commit -m "test: align GuangYa contracts with 1.11 release" || exit 0
          git push origin HEAD:feature/daily-gysub-v1110
