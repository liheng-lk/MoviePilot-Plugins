name: Temporary GuangYa v1.3.0 Executor
on:
  pull_request:
    branches: [main]
    paths:
      - '.guangya-v130-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guangya-missing-episodes-airing-v1.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute branch patch block
        shell: python
        run: |
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/_build_guangya_v130.yml').read_text(encoding='utf-8')
          matched = re.search(r'- name: Apply v1\.3\.0 patch\n\s+shell: python\n\s+run: \|\n(?P<body>.*?)(?=\n\s+- name: Python syntax)', workflow, re.S)
          if not matched:
              raise SystemExit('patch block not found')
          raw_lines = matched.group('body').splitlines()
          lines = []
          in_multiline = False
          for raw in raw_lines:
              if in_multiline:
                  line = raw
                  lines.append(line)
                  if "'''" in line:
                      in_multiline = False
                  continue
              line = raw[10:] if raw.startswith('          ') else raw
              lines.append(line)
              if line.count("'''") % 2 == 1:
                  in_multiline = True
          body = '\n'.join(lines)
          body = body.replace("api_insert = '''", "api_insert = r'''", 1)
          body = body.replace(
              "assert form_anchor in text, 'form anchor missing'",
              "textarea_line = '{\"component\": \"VTextarea\", \"props\": {\"model\": \"channel_urls\", \"label\": \"资源频道地址（每行一个）\", \"rows\": 3}}'; assert textarea_line in text, 'channel textarea missing'; form_row_start = text.rfind('                {\"component\": \"VRow\", \"content\": [\\n', 0, text.index(textarea_line)); assert form_row_start >= 0, 'channel row start missing'",
          )
          body = body.replace(
              'text = text.replace(form_anchor, form_insert + form_anchor, 1)',
              'text = text[:form_row_start] + form_insert + text[form_row_start:]',
          )
          body = body.replace(
              "replace_once(old_card, new_card, 'page subscription card')",
              "card_start = text.index('            done, total, lack = self._subscription_episode_progress(sub)\\n'); card_end = text.index('        fresh_count =', card_start); text = text[:card_start] + new_card + text[card_end:]",
          )
          body = body.replace(
              "replace_once(early, '', 'early completion')",
              "early_start = text.find('        # 兼容旧版本已经转存完'); early_end = text.index('        self.refresh_channels(force=False)\\n', early_start) if early_start >= 0 else -1; assert early_start >= 0 and early_end > early_start, 'early completion boundaries missing'; text = text[:early_start] + text[early_end:]",
          )
          body = body.replace(
              "assert notification_anchor in text, 'notification anchor missing'",
              "notification_base = text.index('                lines = [', text.index('        if unique_paths:')); notification_start = text.index('                if remaining_due_to_cap:', notification_base); notification_end = text.index('                if task_ids:', notification_start)",
          )
          body = body.replace(
              'text = text.replace(notification_anchor, notification_insert, 1)',
              'text = text[:notification_start] + notification_insert + text[notification_end:]',
          )
          exec(compile(body, '<guangya-v130-patch>', 'exec'), {})
      - name: Validate
        run: |
          python -m py_compile plugins.v3/guangyatransferassistant/__init__.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/v3/guangyatransferassistant/test_plugin_contract.py')
          tests = [(name, fn) for name, fn in ns.items() if name.startswith('test_') and callable(fn)]
          for name, fn in tests:
              fn()
              print(f'PASS {name}')
          print(f'{len(tests)} GuangYa contract tests passed')
          PY
          python -m json.tool package.v3.json >/dev/null
          python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Commit final branch files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/_build_guangya_v130.yml .guangya-v130-trigger
          git add package.v3.json plugins.v3/guangyatransferassistant/__init__.py plugins.v3/guangyatransferassistant/plugin.json tests/v3/guangyatransferassistant/test_plugin_contract.py
          git commit -m 'feat: handle missing and airing GuangYa episodes'
          git push origin HEAD:feat/guangya-missing-episodes-airing-v1.3.0
