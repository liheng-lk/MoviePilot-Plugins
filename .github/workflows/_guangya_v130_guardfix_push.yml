name: One-shot GuangYa v1.3.0 Guard Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_guangya_v130_guardfix_push.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guangya-missing-episodes-airing-v1.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch route guard cleanup
        shell: python
        run: |
          from pathlib import Path
          src = Path('plugins.v3/guangyatransferassistant/__init__.py')
          text = src.read_text(encoding='utf-8')
          wrong = '''        self._selected_subscriptions = selected
        self._clear_completion_guard(int(sid))
        self._save_config()

    def _save_config'''
          fixed = '''        self._selected_subscriptions = selected
        self._save_config()

    def _save_config'''
          assert wrong in text, 'cleanup_selected_ids erroneous guard call not found'
          text = text.replace(wrong, fixed, 1)
          remove_old = '''        self._selected_subscriptions = selected
        self._save_config()

    def _get_guangya_runtime'''
          remove_new = '''        self._selected_subscriptions = selected
        self._clear_completion_guard(int(sid))
        self._save_config()

    def _get_guangya_runtime'''
          assert remove_old in text, 'remove_selected_subscription block not found'
          text = text.replace(remove_old, remove_new, 1)
          src.write_text(text, encoding='utf-8')

          test = Path('tests/v3/guangyatransferassistant/test_plugin_contract.py')
          tt = test.read_text(encoding='utf-8')
          addition = '''\n\ndef test_route_cleanup_does_not_reference_undefined_sid():\n    cleanup = text.split("    def _cleanup_selected_ids(", 1)[1].split("    def _save_config(", 1)[0]\n    assert "_clear_completion_guard(int(sid))" not in cleanup\n    remove = text.split("    def _remove_selected_subscription(", 1)[1].split("    def _get_guangya_runtime(", 1)[0]\n    assert "_clear_completion_guard(int(sid))" in remove\n'''
          if 'test_route_cleanup_does_not_reference_undefined_sid' not in tt:
              test.write_text(tt + addition, encoding='utf-8')
      - name: Validate
        run: |
          python -m py_compile plugins.v3/guangyatransferassistant/__init__.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/v3/guangyatransferassistant/test_plugin_contract.py')
          tests = [(name, fn) for name, fn in ns.items() if name.startswith('test_') and callable(fn)]
          for name, fn in tests:
              fn()
              print(f'PASS {name}')
          print(f'{len(tests)} GuangYa contract tests passed')
          PY
          python -m json.tool package.v3.json >/dev/null
          python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Commit to feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .guangya-v130-trigger || true
          git add plugins.v3/guangyatransferassistant/__init__.py tests/v3/guangyatransferassistant/test_plugin_contract.py
          git commit -m 'fix: scope GuangYa completion guard cleanup correctly'
          git push origin HEAD:feat/guangya-missing-episodes-airing-v1.3.0
