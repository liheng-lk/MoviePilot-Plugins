name: Audit Shuk organizer v3.7 policy

on:
  push:
    branches:
      - refactor/shukguangya-organizer-core-v370

permissions:
  contents: write

concurrency:
  group: audit-shuk-v370
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse organizer runtime
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          find plugins.v3/shukguangyadisk -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3/shukguangyadisk -type f -name '*.pyc' -delete
      - name: Execute v3.7 destructive-policy behavior tests
        run: |
          python tests/v3/shukguangyadisk/test_existing_target_behavior_v370.py
          python tests/v3/shukguangyadisk/test_non_actionable_state_v370.py
          python tests/v3/shukguangyadisk/test_organizer_policy_v370.py
          python tests/v3/shukguangyadisk/test_organizer_core_v370_contract.py
      - name: Execute all Shuk contracts
        run: |
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
      - name: Execute repository regressions
        run: |
          python -m unittest discover -s tests -v
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Remove one-time audit workflow
        run: |
          rm -f .github/workflows/audit-shuk-v370.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-shuk-v370.yml
          git commit -m "chore(shuk): remove v3.7 policy audit workflow"
          git push origin HEAD:refactor/shukguangya-organizer-core-v370
