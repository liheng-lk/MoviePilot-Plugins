name: Migrate GuangYa v1.12.18 structure contracts
on:
  push:
    branches: [fix/guangya-v1.12.18-empty-dir-guard]
    paths: [.github/workflows/migrate-guangya-v11218-structure.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.18-empty-dir-guard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update only stale nested-MRO fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('tests/v3/guangyatransferassistant')
          files = [
              root / 'test_channel_prime_refresh_v11215.py',
              root / 'test_manual_check_v11211.py',
              root / 'test_movie_bilingual_identity_v11216.py',
              root / 'test_movie_identity_v1129.py',
              root / 'test_xunlei_season_fence_v11210.py',
          ]
          pattern = re.compile(
              r'^(\s*)assert "class GuangYaMovieIdentityV1129Mixin\(GuangYaMovieBilingualIdentityV11216Mixin\):" in (\w+)\s*$',
              re.M,
          )
          for path in files:
              text = path.read_text(encoding='utf-8')
              def repl(match):
                  indent, var = match.group(1), match.group(2)
                  return (
                      f'{indent}assert "class GuangYaMovieIdentityV1129Mixin(" in {var}\n'
                      f'{indent}assert "GuangYaMovieBilingualIdentityV11216Mixin," in {var}\n'
                      f'{indent}assert "GuangYaEmptyDirGuardV11218Mixin," in {var}'
                  )
              text, count = pattern.subn(repl, text)
              if count != 1:
                  raise SystemExit(f'{path}: expected one old MRO assertion, got {count}')
              path.write_text(text, encoding='utf-8')

          movie = root / 'test_movie_identity_v1129.py'
          text = movie.read_text(encoding='utf-8')
          needle = '        "GuangYaMovieBilingualIdentityV11216Mixin": _XunleiFenceBase,\n'
          insert = needle + '        "GuangYaEmptyDirGuardV11218Mixin": type("_EmptyDirGuardBase", (), {}),\n'
          if needle not in text:
              raise SystemExit('movie identity fixture base injection point missing')
          text = text.replace(needle, insert, 1)
          movie.write_text(text, encoding='utf-8')
          PY
      - name: Validate functional candidate
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant
          python -m unittest discover -s tests -v
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Remove temporary migration workflow and commit only green tree
        run: |
          rm -f .github/workflows/migrate-guangya-v11218-structure.yml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/v3/guangyatransferassistant .github/workflows/migrate-guangya-v11218-structure.yml
          git commit -m 'test(guangya): align v1.12.18 nested guard contracts'
          git push origin HEAD:fix/guangya-v1.12.18-empty-dir-guard
