name: Temporary GuangYa v1.6.0 Inflight Fix
on:
  pull_request:
    branches: [main]
    paths:
      - '.guangya-v160-inflight-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guangya-operations-v1.6.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply in-flight reservation safety
        run: python tools/fix_guangya_v160_inflight.py
      - name: Validate generated plugin
        run: |
          python -m py_compile plugins.v3/guangyatransferassistant/__init__.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/v3/guangyatransferassistant/test_plugin_contract.py')
          tests = [(name, fn) for name, fn in ns.items() if name.startswith('test_') and callable(fn)]
          for name, fn in tests:
              fn()
              print(f'PASS {name}')
          print(f'{len(tests)} GuangYa contract tests passed')
          PY
          python -m json.tool package.v3.json >/dev/null
          python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Commit formal files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .guangya-v160-inflight-trigger tools/fix_guangya_v160_inflight.py
          git add plugins.v3/guangyatransferassistant/__init__.py tests/v3/guangyatransferassistant/test_plugin_contract.py
          git commit -m 'fix: reserve in-flight GuangYa episodes across messages'
          git push origin HEAD:feat/guangya-operations-v1.6.0
