name: One-shot v1.9.4 finalize
on:
  push:
    branches: [feature/guangya-v194-completeness]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guangya-v194-completeness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize version contracts and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tests = Path('tests/v3/guangyatransferassistant')
          for path in tests.glob('test_*.py'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('== "1.9.3"', '== "1.9.4"')
              text = text.replace("plugin_version = \"1.9.3\"", "plugin_version = \"1.9.4\"")
              text = text.replace("build_id = \"20260901-r6\"", "build_id = \"20260901-r8\"")
              text = text.replace("build_id = \"20260901-r7\"", "build_id = \"20260901-r8\"")
              text = text.replace('"秒传成功占位"', '"秒传"')
              path.write_text(text, encoding='utf-8')

          for rel in (
              'plugins.v3/guangyatransferassistant/gying_hardening_v193.py',
              'plugins.v3/guangyatransferassistant/xunlei_hardening_v193.py',
              'plugins.v3/guangyatransferassistant/status_hardening_v193.py',
          ):
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              text = text.replace('build_id = "20260901-r7"', 'build_id = "20260901-r8"')
              path.write_text(text, encoding='utf-8')

          readme = Path('plugins.v3/guangyatransferassistant/README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## v1.9.3：完整观影会话 + 迅雷最高优先级秒传\n'
          section = '''## v1.9.4：观影与迅雷生产完整性收口\n\nv1.9.4 不改变资源优先级，继续固定为：\n\n`观影迅雷秒传 > 光鸭直接转存 > Magnet 光鸭云添加 > ED2K 光鸭云添加`\n\n本版重点处理真实站点与会话的边界，而不是继续增加一套下载路径：\n\n- 中文观影域名与 punycode 统一为同一个节点身份，避免重复验证、重复冷却；\n- `星际穿越.com` 等内容节点只作为节点池种子，不写死为唯一地址；旧 `gying.org` 固定默认在自动切换模式下迁移为空，由发布页、备用节点和最近成功节点共同决策；\n- 手工观影 Cookie 仅发送给用户绑定的首选节点，自动切换到其他域名不会跨域携带；各节点自己的验证/登录 Cookie 仍独立持久化；\n- GYING 搜索只有在零结果时才按 `标题+年份+季 -> 标题+年份 -> 标题` 逐级降级，并在候选同时提供年份时做二次校验；\n- Angie/伪 404 等出口阻断会被识别为节点故障并进入 failover，而不是误报“没有资源”；\n- 迅雷运行时 Device ID 持久化；captcha_token 与 client/device 作为同一身份维护；没有可复用 token 时可自动调用 `shield/captcha/init`；\n- 匿名迅雷分享请求不会携带用户账号 Authorization；`share/file_info` 没拿到 GCID 时，按同 parent_id 再请求 `share/detail?with_audit=false` 精确补 hash；\n- 配置页继续保持四区结构，PoW、发布页、备用节点、代理、Device ID、captcha 等协议级参数统一下沉“高级”；状态页继续保持五区紧凑总览。\n\n新增运行诊断：`GET /api/v1/plugin/GuangYaTransferAssistant/xunlei/runtime/status`。公开状态只返回布尔状态与模式，不返回 captcha token、device id、观影 Cookie 或密码。\n\n'''
          if marker in text and '## v1.9.4：观影与迅雷生产完整性收口' not in text:
              text = text.replace(marker, section + marker, 1)
          readme.write_text(text, encoding='utf-8')

          delivery = Path('docs/guangyatransferassistant-v194-delivery.md')
          delivery.write_text('''# 光鸭转存助手 v1.9.4 交付验收\n\n## 版本\n\n- 插件版本：`1.9.4`\n- Build：`20260901-r8`\n- 固定资源优先级：`观影迅雷秒传 > 光鸭直接转存 > Magnet > ED2K`\n\n## 本次完整性收口\n\n1. GYING 节点身份统一：中文 IDN 与 punycode 合并；当前内容节点仅作为种子，不作为硬编码唯一入口。\n2. Cookie 域隔离：手工 Cookie 只绑定首选节点；自动 failover 不跨域携带登录态。\n3. 搜索降级：零结果才从“标题+年份+季”退到“标题+年份”再退到纯标题，候选年份同时存在时必须一致。\n4. 节点故障：Angie/伪 404/阻断页进入 failover，不误判资源为空。\n5. 迅雷身份：稳定 Device ID、captcha/client/device 一致性、`shield/captcha/init` 自动初始化。\n6. 迅雷匿名分享：分享请求移除 Authorization；GCID 缺失时按同 parent_id + `with_audit=false` 二次读取。\n7. 光鸭秒传边界不变：`get_res_center_token -> check_can_flash_upload -> get_info_by_task_id`；`code=156` 直接成功；CID 缺失只读 3×20KB 样本，不下载整文件。\n8. ResourceGroup、Episode Resolver、MoviePilot 真实缺集、订阅质量规则、reservation 与 taskId 幂等全部保留。\n9. Magnet/ED2K 继续仅使用光鸭原生 cloudcollection，不进入 MoviePilot 下载器。\n10. 配置页四区、状态页五区继续保持紧凑结构，协议级设置下沉高级区。\n\n## 自动化验收\n\n必须通过仓库 `Validate MoviePilot Plugins` 的 Python syntax、Unit tests、V3 plugin contract tests、dependency manifests、JSON indexes 与生成物检查。\n\n## 仍需实机验证\n\nCI 无法替代动态站点与账号会话。最终生产烟测仍需要实际 MoviePilot + 已登录光鸭环境，以及临时 GYING 测试账号/Cookie，验证：\n\n`节点发现 -> PoW/验证 -> 登录 -> /search -> /res/downurl -> 迅雷分享 -> 光鸭秒传 -> MoviePilot 缺集/订阅进度`。\n''', encoding='utf-8')
          PY

          rm -f .github/workflows/one-shot-v194-finalize.yml

      - name: Full repository validation
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
          python -m unittest discover -s tests -v
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"
          python - <<'PY'
          from pathlib import Path
          import json, tomllib
          for path in Path('plugins.v3').glob('*/pyproject.toml'):
              with path.open('rb') as f:
                  project = tomllib.load(f)['project']
              assert project.get('dynamic') == ['version'], path
              assert project.get('requires-python') == '>=3.12', path
          shuk = Path('plugins.v3/shukguangyadisk')
          assert not (shuk / 'pyproject.toml').exists()
          assert not (shuk / 'requirements.txt').exists()
          for p in ['plugin.json','package.v2.json','package.v3.json']:
              json.load(open(p, encoding='utf-8'))
          PY
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test -z "$(find . -type f -name '*.pyc' -o -type d -name '__pycache__')"

      - name: Commit finalized release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize GuangYaTransferAssistant v1.9.4' || exit 0
          git push origin HEAD:feature/guangya-v194-completeness
