name: Patch DailyNewDrama Multiplatform

on:
  push:
    branches: [dailynewdrama-multiplatform]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-multiplatform
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_dailynewdrama_multiplatform.py
      - name: Syntax check
        run: |
          python -m py_compile plugins.v2/dailynewdrama/__init__.py plugins.v2/dailynewdrama/platform_sources.py
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v2/dailynewdrama/__init__.py
          git diff --cached --quiet || git commit -m 'feat: integrate five streaming platform sources'
          git push
