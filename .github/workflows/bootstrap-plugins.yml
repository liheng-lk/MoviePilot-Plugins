name: Bootstrap MoviePilot plugin collection

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import Guangya Helper v1.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/liheng-lk/guangya-helper.git /tmp/guangya
          rm -rf plugins.v2/shukguangyadisk
          cp -a /tmp/guangya/plugins.v2/shukguangyadisk plugins.v2/shukguangyadisk
          find plugins.v2/shukguangyadisk -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find plugins.v2/shukguangyadisk -type f -name '*.pyc' -delete || true

          # 本合集成为后续正式维护地址，保留内部插件ID兼容旧安装。
          python - <<'PY'
          from pathlib import Path
          root = Path('plugins.v2/shukguangyadisk')
          suffixes = {'.py','.js','.vue','.json','.md','.css','.html'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in suffixes:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              text = text.replace('https://github.com/liheng-lk/guangya-helper', 'https://github.com/liheng-lk/MoviePilot-Plugins')
              text = text.replace('https://github.com/liheng-lk/guangya-helper.git', 'https://github.com/liheng-lk/MoviePilot-Plugins.git')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Copy daily drama icon
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jxxghp/MoviePilot-Plugins.git /tmp/mp-official
          icon="$(find /tmp/mp-official/plugins.v2 -type f -path '*/doubanrank/movie.jpg' -print -quit || true)"
          if [ -n "$icon" ]; then
            cp "$icon" plugins.v2/dailynewdrama/movie.jpg
          else
            icon="$(find /tmp/mp-official -type f -name 'movie.jpg' -print -quit || true)"
            [ -n "$icon" ] && cp "$icon" plugins.v2/dailynewdrama/movie.jpg || true
          fi

      - name: Fix one-time run behavior and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('plugins.v2/dailynewdrama/__init__.py')
          s = p.read_text(encoding='utf-8')
          # “立即运行一次”通过一次性 date service 触发，执行后保存为 false。
          old = '''        if self._onlyonce:\n            self._onlyonce = False\n            self._save_config_state()\n'''
          new = '''        # onlyonce 由 get_service() 注册一次性任务，避免保存配置时同步阻塞。\n'''
          s = s.replace(old, new)
          old2 = '''        services = []\n        if self._enabled:\n'''
          new2 = '''        services = []\n        if self._onlyonce:\n            self._onlyonce = False\n            self._save_config_state()\n            services.append({\n                "id": "DailyNewDramaOnce",\n                "name": "立即刷新每日新剧",\n                "trigger": "date",\n                "func": self.refresh_and_notify,\n                "kwargs": {},\n            })\n        if self._enabled:\n'''
          s = s.replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY

          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .DS_Store
          node_modules/
          .vite/
          EOF

      - name: Validate plugin source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q plugins.v2/dailynewdrama plugins.v2/shukguangyadisk
          find plugins.v2 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 -type f -name '*.pyc' -delete
          if [ -d plugins.v2/shukguangyadisk/dist/assets ]; then
            find plugins.v2/shukguangyadisk/dist/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -r -n1 node --check
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('plugin.json'), Path('package.v2.json'), Path('plugins.v2/dailynewdrama/plugin.json'), Path('plugins.v2/shukguangyadisk/plugin.json')]:
              json.loads(p.read_text(encoding='utf-8'))
              print('OK', p)
          PY

      - name: Commit generated collection
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-plugins.yml .bootstrap-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: bootstrap plugin collection with Guangya Helper and Daily New Drama'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
