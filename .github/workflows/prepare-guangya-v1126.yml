name: Prepare GuangYa v1.12.6 release
on:
  push:
    branches: [fix/guangya-v1.12.6-fast-recall]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.6-fast-recall
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release migration
        run: python scripts/_prepare_guangya_v1126.py
      - name: Patch release test contracts
        run: python scripts/_patch_guangya_v1126_tests.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: V3 plugin contract tests
        run: |
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Dependency and JSON checks
        run: |
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"
          python - <<'PY'
          from pathlib import Path
          import json, tomllib
          for path in Path('plugins.v3').glob('*/pyproject.toml'):
              with path.open('rb') as f:
                  project = tomllib.load(f)['project']
              assert project.get('dynamic') == ['version'], path
              assert project.get('requires-python') == '>=3.12', path
          assert not (Path('plugins.v3/shukguangyadisk') / 'pyproject.toml').exists()
          for p in ['plugin.json', 'package.v2.json', 'package.v3.json']:
              json.load(open(p, encoding='utf-8'))
          PY
      - name: Commit validated v1.12.6 migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release(guangya): finalize v1.12.6 fast recall"
          git push origin HEAD:fix/guangya-v1.12.6-fast-recall
