name: Prepare GuangYa v1.12.15 release r2

on:
  push:
    branches:
      - fix/guangya-v1.12.15-channel-reconcile

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.15-channel-reconcile
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited release migration
        run: |
          python scripts/_prepare_guangya_v11215_release.py
          python scripts/_patch_guangya_v11215_v3_release_tests.py
      - name: Validate release migration
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
          python -m unittest discover -s tests -v
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"
          python - <<'PY'
          from pathlib import Path
          import tomllib
          for path in Path('plugins.v3').glob('*/pyproject.toml'):
              with path.open('rb') as f:
                  project = tomllib.load(f)['project']
              assert project.get('dynamic') == ['version'], path
              assert project.get('requires-python') == '>=3.12', path
          shuk = Path('plugins.v3/shukguangyadisk')
          assert not (shuk / 'pyproject.toml').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          assert not (shuk / 'requirements.txt').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          PY
          python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['plugin.json','package.v2.json','package.v3.json']]"
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test -z "$(find . -type f -name '*.pyc' -o -type d -name '__pycache__')"
      - name: Commit validated release
        run: |
          rm -f .github/workflows/_prepare-guangya-v11215-release.yml .github/workflows/_prepare-guangya-v11215-release-r2.yml scripts/_prepare_guangya_v11215_release.py scripts/_patch_guangya_v11215_v3_release_tests.py
          git config user.name "liheng-lk"
          git config user.email "69590718+liheng-lk@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release(guangya): promote v1.12.15 channel reconciliation"
          git push origin HEAD:fix/guangya-v1.12.15-channel-reconcile
