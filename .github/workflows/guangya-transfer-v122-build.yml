name: Build GuangYa Transfer v1.2.2
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.head_ref == 'fix/guangya-transfer-subscription-search-v1.2.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-transfer-subscription-search-v1.2.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.2.2 patch
        run: python .github/guangya_transfer_v122_search_completion_patch.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v3
          find plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3 -type f -name '*.pyc' -delete
      - name: GuangYa regression tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/v3/guangyatransferassistant/test_plugin_contract.py
      - name: JSON indexes
        run: python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['package.v3.json','plugins.v3/guangyatransferassistant/plugin.json']]"
      - name: Static completion contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text = Path('plugins.v3/guangyatransferassistant/__init__.py').read_text(encoding='utf-8')
          assert 'plugin_version = "1.2.2"' in text
          assert '"component": "VAutocomplete"' in text
          assert '_subscription_episode_progress' in text
          assert 'SubscribeChain().finish_subscribe_or_not' in text
          assert 'force=True' in text
          assert '_remove_selected_subscription' in text
          assert '已通过 MoviePilot 官方流程移入订阅历史并从活动订阅移除' in text
          package = json.loads(Path('package.v3.json').read_text(encoding='utf-8'))
          assert package['GuangYaTransferAssistant']['version'] == '1.2.2'
          print('GuangYa v1.2.2 search/completion contract OK')
          PY
      - name: Commit final files and remove build helpers
        run: |
          rm -f .github/guangya_transfer_v122_search_completion_patch.py .github/workflows/guangya-transfer-v122-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.v3.json plugins.v3/guangyatransferassistant/__init__.py plugins.v3/guangyatransferassistant/plugin.json tests/v3/guangyatransferassistant/test_plugin_contract.py .github
          git commit -m "feat: add GuangYa subscription search and completion lifecycle"
          git push origin HEAD:fix/guangya-transfer-subscription-search-v1.2.2
