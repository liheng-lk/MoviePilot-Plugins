name: Rerun DailyNewDrama v1.3.3 diagnostics
on:
  push:
    branches: [dailynewdrama-v1.3.3-diagnostics]
    paths: [.github/workflows/diagnose-dailynewdrama-v133-rerun.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-v1.3.3-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('plugins.v2/dailynewdrama/__init__.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('plugin_version = "1.3.2"','plugin_version = "1.3.3"',1)
          marker='        cards = []\n        for item in items:\n'
          diag='''        page_token = str(getattr(settings, "API_TOKEN", "") or "")\n        page_token_hash = hashlib.sha256(page_token.encode("utf-8")).hexdigest()[:8] if page_token else "-"\n        logger.info("【每日新剧助手】【页面鉴权诊断】构建订阅按钮: batch_id=%s, items=%s, apikey_present=%s, apikey_len=%s, apikey_sha256_8=%s", batch_id, len(items), bool(page_token), len(page_token), page_token_hash)\n\n        cards = []\n        for item in items:\n'''
          if '【每日新剧助手】【页面鉴权诊断】构建订阅按钮' not in s:
              if marker not in s: raise SystemExit('page marker missing')
              s=s.replace(marker,diag,1)
          old='''        if apikey != settings.API_TOKEN:\n            return {"success": False, "message": "API密钥错误", "handled_indexes": []}\n        parsed_indexes = self._parse_indexes(str(indexes or ""))\n        batch_id = str(batch_id or "")\n        result = self._subscribe_indexes(indexes=parsed_indexes, batch_id=batch_id)\n'''
          new='''        received_token = str(apikey or "")\n        expected_token = str(getattr(settings, "API_TOKEN", "") or "")\n        received_hash = hashlib.sha256(received_token.encode("utf-8")).hexdigest()[:8] if received_token else "-"\n        expected_hash = hashlib.sha256(expected_token.encode("utf-8")).hexdigest()[:8] if expected_token else "-"\n        logger.info("【每日新剧助手】【订阅API诊断】收到请求: indexes=%s, batch_id=%s, apikey_present=%s, apikey_len=%s, apikey_sha256_8=%s, expected_present=%s, expected_len=%s, expected_sha256_8=%s, match=%s", indexes, batch_id, bool(received_token), len(received_token), received_hash, bool(expected_token), len(expected_token), expected_hash, received_token == expected_token)\n        if received_token != expected_token:\n            logger.warning("【每日新剧助手】【订阅API诊断】插件内部鉴权失败: received_len=%s expected_len=%s received_hash=%s expected_hash=%s", len(received_token), len(expected_token), received_hash, expected_hash)\n            return {"success": False, "message": "API密钥错误", "handled_indexes": []}\n        parsed_indexes = self._parse_indexes(str(indexes or ""))\n        batch_id = str(batch_id or "")\n        logger.info("【每日新剧助手】【订阅API诊断】鉴权通过，准备执行订阅: parsed_indexes=%s, batch_id=%s", parsed_indexes, batch_id)\n        result = self._subscribe_indexes(indexes=parsed_indexes, batch_id=batch_id)\n        logger.info("【每日新剧助手】【订阅API诊断】订阅链返回: success=%s, handled_indexes=%s, message=%s", result.get("success"), result.get("handled_indexes"), str(result.get("message") or "")[:300])\n'''
          if '【每日新剧助手】【订阅API诊断】收到请求' not in s:
              if old not in s: raise SystemExit('api marker missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          for name in ['package.v2.json','plugin.json']:
              path=Path(name); data=json.loads(path.read_text(encoding='utf-8')); item=data['DailyNewDrama']; item['version']='1.3.3'; item['history']={'v1.3.3':'增加页面订阅 API 鉴权诊断日志',**(item.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          path=Path('plugins.v2/dailynewdrama/plugin.json'); data=json.loads(path.read_text(encoding='utf-8')); data['version']='1.3.3'; data['history']={'v1.3.3':'增加页面订阅 API 鉴权诊断日志',**(data.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for test_name in ['tests/test_dailynewdrama_v13.py','tests/test_dailynewdrama_api_contract.py','tests/test_dailynewdrama_auth_contract.py']:
              tp=Path(test_name)
              if tp.exists():
                  ts=tp.read_text(encoding='utf-8').replace('"1.3.2"','"1.3.3"').replace("'1.3.2'","'1.3.3'").replace('plugin_version = "1.3.2"','plugin_version = "1.3.3"')
                  tp.write_text(ts,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m compileall -q plugins.v2/dailynewdrama
          python -m unittest discover -s tests -p 'test_dailynewdrama*.py' -v
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v2/dailynewdrama/__init__.py plugins.v2/dailynewdrama/plugin.json package.v2.json plugin.json tests/test_dailynewdrama*.py
          git commit -m 'diagnostics: DailyNewDrama v1.3.3 auth logging'
          git push origin HEAD:dailynewdrama-v1.3.3-diagnostics
