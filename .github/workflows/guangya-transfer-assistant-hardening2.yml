name: GuangYa Transfer Assistant Hardening 2
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  harden:
    if: github.head_ref == 'feature/guangya-transfer-assistant-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guangya-transfer-assistant-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('plugins.v3/guangyatransferassistant/__init__.py')
          s=p.read_text(encoding='utf-8')
          a='''        entries: List[Dict[str, Any]] = []\n        errors = []\n        seen = set()\n        for source_url in self._source_urls():'''
          b='''        entries: List[Dict[str, Any]] = []\n        errors = []\n        seen = set()\n        source_successes = 0\n        for source_url in self._source_urls():'''
          assert a in s
          s=s.replace(a,b,1)
          a='''                found = _extract_channel_entries(response.text or "", source_url, label)\n                for item in found:'''
          b='''                source_successes += 1\n                found = _extract_channel_entries(response.text or "", source_url, label)\n                for item in found:'''
          assert a in s
          s=s.replace(a,b,1)
          a='''        entries.sort(key=lambda item: int(item.get("priority") or 0))\n        payload = {'''
          b='''        entries.sort(key=lambda item: int(item.get("priority") or 0))\n        if not entries and current.get("items") and (errors or source_successes == 0):\n            logger.warning("【光鸭转存助手】本轮频道抓取未得到有效分享，保留上次索引，避免临时网络异常误触发原生下载")\n            self.save_data("last_run", {\n                "success": False,\n                "time": datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),\n                "count": len(current.get("items") or []),\n                "errors": errors or ["频道返回空数据，已保留上次索引"],\n                "stale_index": True,\n            })\n            return list(current.get("items") or [])\n        payload = {'''
          assert a in s
          s=s.replace(a,b,1)
          a='''        valid = {int(getattr(item, "id", 0) or 0) for item in self._list_subscriptions("N,R,P")}\n        selected = [sid for sid in self._selected_subscriptions if sid in valid]'''
          b='''        valid = {int(getattr(item, "id", 0) or 0) for item in self._list_subscriptions("N,R,P")}\n        # 启动阶段订阅查询暂时不可用时，保留用户已经勾选的路由。\n        if not valid:\n            return\n        selected = [sid for sid in self._selected_subscriptions if sid in valid]'''
          assert a in s
          s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
          t=Path('tests/v3/guangyatransferassistant/test_plugin_contract.py')
          q=t.read_text(encoding='utf-8')
          q += '\nassert "stale_index" in text\nassert "source_successes" in text\nassert "if not valid:" in text\n' if 'stale_index' not in q else ''
          t.write_text(q,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant
          python tests/v3/guangyatransferassistant/test_plugin_contract.py
          python -m json.tool package.v3.json >/dev/null
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v3/guangyatransferassistant/__init__.py tests/v3/guangyatransferassistant/test_plugin_contract.py
          git commit -m "fix: preserve GuangYa routing across transient source failures"
          git push origin HEAD:feature/guangya-transfer-assistant-v1
