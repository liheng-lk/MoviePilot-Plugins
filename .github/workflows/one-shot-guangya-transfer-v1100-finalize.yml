name: One-shot finalize GuangYaTransferAssistant v1.10.0

on:
  push:
    branches:
      - feature/guangyatransferassistant-v1100-ui-runtime

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guangyatransferassistant-v1100-ui-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply integration
        run: python scripts/finalize_guangya_transfer_v1100.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: GuangYaTransferAssistant focused tests
        run: |
          python -m pytest tests/v3/guangyatransferassistant -q
          python -m unittest tests.v3.guangyatransferassistant.test_v1100_functional_dryrun -v
      - name: Repository unit tests
        run: python -m unittest discover -s tests -v
      - name: V3 plugin contract tests
        run: |
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: V3 dependency manifests
        run: |
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"
          python - <<'PY'
          from pathlib import Path
          import tomllib
          for path in Path('plugins.v3').glob('*/pyproject.toml'):
              with path.open('rb') as f:
                  project = tomllib.load(f)['project']
              assert project.get('dynamic') == ['version'], path
              assert project.get('requires-python') == '>=3.12', path
          shuk = Path('plugins.v3/shukguangyadisk')
          assert not (shuk / 'pyproject.toml').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          assert not (shuk / 'requirements.txt').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          PY
      - name: JSON indexes
        run: python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['plugin.json','package.v2.json','package.v3.json']]"
      - name: Cleanup test artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: No generated Python artifacts
        run: test -z "$(find . -type f -name '*.pyc' -o -type d -name '__pycache__')"
      - name: Commit finalized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-guangya-transfer-v1100.yml
          git rm .github/workflows/one-shot-guangya-transfer-v1100-finalize.yml
          git rm scripts/finalize_guangya_transfer_v1100.py
          git add plugins.v3/guangyatransferassistant package.v3.json tests/v3/guangyatransferassistant
          git commit -m "光鸭转存助手 v1.10.0：重构控制台并修复搜索与秒传可靠性"
          git push origin HEAD:feature/guangyatransferassistant-v1100-ui-runtime
