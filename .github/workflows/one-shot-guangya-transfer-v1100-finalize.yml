name: One-shot finalize GuangYaTransferAssistant v1.10.0

on:
  push:
    branches:
      - feature/guangyatransferassistant-v1100-ui-runtime

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guangyatransferassistant-v1100-ui-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply integration
        run: python scripts/finalize_guangya_transfer_v1100.py
      - name: Python syntax
        run: python -m compileall -q plugins.v3/guangyatransferassistant
      - name: GuangYaTransferAssistant tests
        run: python -m pytest tests/v3/guangyatransferassistant -q
      - name: Repository V3 validation
        run: python -m pytest tests/v3 -q
      - name: Commit finalized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-guangya-transfer-v1100.yml
          git rm .github/workflows/one-shot-guangya-transfer-v1100-finalize.yml
          git rm scripts/finalize_guangya_transfer_v1100.py
          git add plugins.v3/guangyatransferassistant package.v3.json tests/v3/guangyatransferassistant
          git commit -m "光鸭转存助手 v1.10.0：重构控制台并修复搜索与秒传可靠性"
          git push origin HEAD:feature/guangyatransferassistant-v1100-ui-runtime
