name: Prepare GuangYa v1.12.7 release

on:
  push:
    branches:
      - fix/guangya-v1.12.7-resource-gate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.7-resource-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.12.7 release migration
        run: python scripts/_prepare_guangya_v1127.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Root unit tests
        run: python -m unittest discover -s tests -v
      - name: GuangYa V3 contract tests
        run: python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: JSON metadata checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          package = json.loads((root / 'package.v3.json').read_text(encoding='utf-8'))
          plugin = json.loads((root / 'plugins.v3/guangyatransferassistant/plugin.json').read_text(encoding='utf-8'))
          assert package['GuangYaTransferAssistant']['version'] == '1.12.7'
          assert plugin['version'] == '1.12.7'
          assert 'v1.12.7' in package['GuangYaTransferAssistant']['history']
          assert 'v1.12.6' in package['GuangYaTransferAssistant']['history']
          PY
      - name: Remove one-shot release tooling
        run: rm -f .github/workflows/prepare-guangya-v1127.yml scripts/_prepare_guangya_v1127.py
      - name: Commit validated v1.12.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 0
          fi
          git commit -m 'release(guangya): finalize v1.12.7 resource gate recovery'
          git push origin HEAD:fix/guangya-v1.12.7-resource-gate
