name: Apply GuangYa media identity v1.11.1

on:
  push:
    branches: [hotfix/guangya-media-identity-v1111]
    paths: [.github/workflows/tmp-guangya-media-identity-v1111-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/guangya-media-identity-v1111
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse staged patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/tmp-guangya-media-identity-v1111.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"
          Path('/tmp/identity_patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/identity_patch.py
      - name: Validate focused patch
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tests/test_guangya_media_identity_v1111.py')
          spec = importlib.util.spec_from_file_location('identity_tests', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          count = 0
          for name, value in sorted(vars(module).items()):
              if name.startswith('test_') and callable(value):
                  value()
                  count += 1
          print(f'focused identity tests: {count} passed')
          if count < 8:
              raise SystemExit('identity regression tests were not all executed')
          PY
          git diff --check
      - name: Commit runtime wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v3/guangyatransferassistant package.v3.json tests/test_guangya_media_identity_v1111.py
          git diff --cached --check
          git commit -m "fix: enforce actual media identity before GuangYa transfer"
          git push origin HEAD:hotfix/guangya-media-identity-v1111
