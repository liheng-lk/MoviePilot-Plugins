name: Sync DailyNewDrama v1.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync runtime version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('plugins.v2/dailynewdrama/__init__.py')
          s = p.read_text(encoding='utf-8')
          old = '    plugin_version = "1.0"'
          new = '    plugin_version = "1.1"'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/bump-dailynewdrama-1.1.yml
          python -m py_compile plugins.v2/dailynewdrama/__init__.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins.v2/dailynewdrama/__init__.py .github/workflows/bump-dailynewdrama-1.1.yml
          git diff --cached --quiet || git commit -m 'chore: sync DailyNewDrama runtime to v1.1'
          git push
