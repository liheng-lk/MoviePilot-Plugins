name: Fix DailyNewDrama v1.3.2 API key contract
on:
  push:
    branches: [dailynewdrama-v1.3.2-apikey-fix]
    paths: [.github/workflows/fix-dailynewdrama-v132-apikey.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-v1.3.2-apikey-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.3.2 hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('plugins.v2/dailynewdrama/__init__.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('plugin_version = "1.3.1"','plugin_version = "1.3.2"',1)
          old='''    def api_subscribe(self, indexes: str = "", batch_id: str = "") -> Dict[str, Any]:\n        """订阅页面候选；参数与 MoviePilot get_page 事件 params 保持一致。"""\n        parsed_indexes = self._parse_indexes(str(indexes or ""))\n        batch_id = str(batch_id or "")\n        result = self._subscribe_indexes(indexes=parsed_indexes, batch_id=batch_id)\n'''
          new='''    def api_subscribe(self, indexes: str = "", batch_id: str = "", apikey: str = "") -> Dict[str, Any]:\n        """订阅页面候选；参数与 MoviePilot get_page 事件 params 保持一致。"""\n        if apikey != settings.API_TOKEN:\n            return {"success": False, "message": "API密钥错误", "handled_indexes": []}\n        parsed_indexes = self._parse_indexes(str(indexes or ""))\n        batch_id = str(batch_id or "")\n        result = self._subscribe_indexes(indexes=parsed_indexes, batch_id=batch_id)\n'''
          if old not in s:
              raise SystemExit('api_subscribe v1.3.1 pattern not found')
          s=s.replace(old,new)
          old_params='''"params": {"indexes": str(item.get("index") or ""), "batch_id": batch_id},'''
          new_params='''"params": {"indexes": str(item.get("index") or ""), "batch_id": batch_id, "apikey": settings.API_TOKEN},'''
          if old_params not in s:
              raise SystemExit('page subscribe params pattern not found')
          s=s.replace(old_params,new_params)
          p.write_text(s,encoding='utf-8')
          for name in ['package.v2.json','plugin.json']:
              path=Path(name); data=json.loads(path.read_text(encoding='utf-8')); item=data['DailyNewDrama']; item['version']='1.3.2'; item['history']={'v1.3.2':'修复页面订阅按钮 apikey 鉴权失败，按 MoviePilot 官方页面 API 合同自动携带 API Token',**(item.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          path=Path('plugins.v2/dailynewdrama/plugin.json'); data=json.loads(path.read_text(encoding='utf-8')); data['version']='1.3.2'; data['history']={'v1.3.2':'修复页面订阅按钮 apikey 鉴权失败，按 MoviePilot 官方页面 API 合同自动携带 API Token',**(data.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          tp=Path('tests/test_dailynewdrama_v13.py')
          ts=tp.read_text(encoding='utf-8').replace('plugin_version = "1.3.1"','plugin_version = "1.3.2"').replace('"1.3.1"','"1.3.2"')
          tp.write_text(ts,encoding='utf-8')
          PY
      - name: Add API key regression test
        run: |
          cat > tests/test_dailynewdrama_apikey_contract.py <<'PY'
          import ast, json
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          SRC=ROOT/'plugins.v2/dailynewdrama/__init__.py'
          text=SRC.read_text(encoding='utf-8')
          tree=ast.parse(text)
          cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='DailyNewDrama')
          fn=next(n for n in cls.body if isinstance(n,ast.FunctionDef) and n.name=='api_subscribe')
          assert [a.arg for a in fn.args.args]==['self','indexes','batch_id','apikey']
          assert '"apikey": settings.API_TOKEN' in text
          block=text[text.index('def api_subscribe'):text.index('def _remove_current_candidates')]
          assert 'apikey != settings.API_TOKEN' in block
          assert 'API密钥错误' in block
          assert 'plugin_version = "1.3.2"' in text
          assert json.loads((ROOT/'package.v2.json').read_text())['DailyNewDrama']['version']=='1.3.2'
          assert json.loads((ROOT/'plugin.json').read_text())['DailyNewDrama']['version']=='1.3.2'
          assert json.loads((ROOT/'plugins.v2/dailynewdrama/plugin.json').read_text())['version']=='1.3.2'
          PY
      - name: Validate
        run: |
          python -m compileall -q plugins.v2/dailynewdrama
          python -m unittest discover -s tests -p 'test_dailynewdrama*.py' -v
          python tests/test_dailynewdrama_apikey_contract.py
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v2/dailynewdrama/__init__.py plugins.v2/dailynewdrama/plugin.json package.v2.json plugin.json tests/test_dailynewdrama_v13.py tests/test_dailynewdrama_apikey_contract.py
          git commit -m 'fix: DailyNewDrama v1.3.2 page API key contract'
          git push origin HEAD:dailynewdrama-v1.3.2-apikey-fix
