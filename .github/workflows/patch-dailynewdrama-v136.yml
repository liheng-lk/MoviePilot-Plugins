name: Patch DailyNewDrama v1.3.6 subscribe identity fix
on:
  push:
    branches: [dailynewdrama-v1.3.6-subscribe-identity-fix]
    paths: [.github/workflows/patch-dailynewdrama-v136.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-v1.3.6-subscribe-identity-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('plugins.v2/dailynewdrama/__init__.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('plugin_version = "1.3.5"', 'plugin_version = "1.3.6"', 1)
          old='''                sid, err_msg = subscribe_chain.add(\n                    title=mediainfo.title,\n                    year=mediainfo.year,\n                    mtype=MediaType.TV,\n                    tmdbid=mediainfo.tmdb_id,\n                    doubanid=item.get("doubanid") or mediainfo.douban_id,\n                    season=meta.begin_season,\n                    message=False,\n                    exist_ok=True,\n                    username="每日新剧助手",\n                )'''
          new='''                subscribe_media_source = getattr(mediainfo, "media_source", None) or MediaSource.TMDB\n                subscribe_media_id = getattr(mediainfo, "media_id", None) or getattr(mediainfo, "tmdb_id", None)\n                if not subscribe_media_id:\n                    failed.append(f"{index}.{item.get('title')}(缺少媒体ID)")\n                    continue\n                logger.info(\n                    "【每日新剧助手】【订阅链诊断】准备创建订阅: title=%s, media_source=%s, media_id=%s, season=%s",\n                    mediainfo.title, subscribe_media_source, subscribe_media_id, meta.begin_season\n                )\n                sid, err_msg = subscribe_chain.add(\n                    title=mediainfo.title,\n                    year=mediainfo.year,\n                    mtype=MediaType.TV,\n                    media_source=subscribe_media_source,\n                    media_id=str(subscribe_media_id),\n                    season=meta.begin_season,\n                    message=False,\n                    exist_ok=True,\n                    username="每日新剧助手",\n                )'''
          if old not in s:
              raise SystemExit('target SubscribeChain.add block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          history='适配新版 MoviePilot SubscribeChain.add 统一媒体身份参数：移除旧 tmdbid/doubanid kwargs，改用 media_source + media_id，修复 Subscribe 模型 invalid keyword argument tmdbid'
          for name in ['package.v2.json','plugin.json']:
              path=Path(name); data=json.loads(path.read_text(encoding='utf-8')); item=data['DailyNewDrama']; item['version']='1.3.6'; item['history']={'v1.3.6':history,**(item.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          path=Path('plugins.v2/dailynewdrama/plugin.json'); data=json.loads(path.read_text(encoding='utf-8')); data['version']='1.3.6'; data['history']={'v1.3.6':history,**(data.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for tp in Path('tests').glob('test_dailynewdrama*.py'):
              ts=tp.read_text(encoding='utf-8').replace('"1.3.5"','"1.3.6"').replace("'1.3.5'","'1.3.6'")
              tp.write_text(ts,encoding='utf-8')
          Path('tests/test_dailynewdrama_v136_subscribe_identity.py').write_text('''from pathlib import Path\nimport json\nROOT=Path(__file__).resolve().parents[1]\ntext=(ROOT/'plugins.v2/dailynewdrama/__init__.py').read_text(encoding='utf-8')\nassert 'plugin_version = "1.3.6"' in text\nblock=text[text.index('sid, err_msg = subscribe_chain.add(')-800:text.index('sid, err_msg = subscribe_chain.add(')+900]\nassert 'tmdbid=' not in block\nassert 'doubanid=' not in block\nassert 'media_source=subscribe_media_source' in block\nassert 'media_id=str(subscribe_media_id)' in block\nassert '【每日新剧助手】【订阅链诊断】准备创建订阅' in text\nassert json.loads((ROOT/'package.v2.json').read_text())['DailyNewDrama']['version']=='1.3.6'\nassert json.loads((ROOT/'plugin.json').read_text())['DailyNewDrama']['version']=='1.3.6'\nassert json.loads((ROOT/'plugins.v2/dailynewdrama/plugin.json').read_text())['version']=='1.3.6'\n''',encoding='utf-8')
          PY
          python -m compileall -q plugins.v2/dailynewdrama
          python -m unittest discover -s tests -p 'test_dailynewdrama*.py' -v
          python tests/test_dailynewdrama_v135_media_identity.py
          python tests/test_dailynewdrama_v136_subscribe_identity.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v2/dailynewdrama/__init__.py plugins.v2/dailynewdrama/plugin.json package.v2.json plugin.json tests/test_dailynewdrama*.py
          git commit -m 'fix: DailyNewDrama v1.3.6 adapt SubscribeChain identity API'
          git push origin HEAD:dailynewdrama-v1.3.6-subscribe-identity-fix
