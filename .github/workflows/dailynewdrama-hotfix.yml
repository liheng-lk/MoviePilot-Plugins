name: DailyNewDrama V3 hotfix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/dailynewdrama-library-notify-complete' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dailynewdrama-library-notify-complete
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply DailyNewDrama 3.0.1 hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          src_path = Path('plugins.v3/dailynewdrama/__init__.py')
          text = src_path.read_text(encoding='utf-8')

          old = '    plugin_version = "3.0.0"'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, '    plugin_version = "3.0.1"')

          marker = '''    return f"{air_date.isoformat()} · 已开播{-days}天"\n\n\nclass DailyNewDrama(_PluginBase):'''
          helper = '''    return f"{air_date.isoformat()} · 已开播{-days}天"\n\n\ndef _media_library_has_content(mediainfo: MediaInfo, complete: bool, no_exists: Dict[str, Any]) -> bool:\n    """只要媒体库中已有该剧任意一季或任意一集，就视为已入库。\n\n    MoviePilot 的 get_no_exists_info() 对电视剧只有在全部季集完整时 complete 才为 True；\n    部分入库会以缺失季集结构返回。这里根据缺失结构反推“媒体库是否已有任何内容”，\n    避免正在追更、缺集或只入库部分季的剧集继续出现在每日推荐中。\n    """\n    if complete:\n        return True\n    if not no_exists:\n        return False\n\n    seasons = getattr(mediainfo, "seasons", None) or {}\n    expected_seasons = {int(season) for season, episodes in seasons.items() if episodes}\n    if not expected_seasons:\n        return False\n\n    missing_seasons = set()\n    for season_map in no_exists.values():\n        if not isinstance(season_map, dict):\n            continue\n        for season, detail in season_map.items():\n            try:\n                missing_seasons.add(int(season))\n            except (TypeError, ValueError):\n                continue\n            missing_episodes = getattr(detail, "episodes", None)\n            if missing_episodes is None and isinstance(detail, dict):\n                missing_episodes = detail.get("episodes")\n            if missing_episodes:\n                return True\n\n    return bool(expected_seasons - missing_seasons)\n\n\nclass DailyNewDrama(_PluginBase):'''
          assert marker in text
          text = text.replace(marker, helper, 1)

          text = text.replace(
              '    def refresh_and_notify(self, send_message: bool = True, suppress_recent: bool = True) -> List[Dict[str, Any]]:',
              '    def refresh_and_notify(self, send_message: bool = True, suppress_recent: bool = False) -> List[Dict[str, Any]]:',
              1,
          )

          old_filter = '''                exist_flag, _ = DownloadChain().get_no_exists_info(meta=meta, mediainfo=mediainfo)\n                if exist_flag:\n                    logger.info("【每日新剧助手】过滤媒体库已存在: %s", mediainfo.title_year)\n                    continue'''
          new_filter = '''                exist_flag, no_exists = DownloadChain().get_no_exists_info(meta=meta, mediainfo=mediainfo)\n                if _media_library_has_content(mediainfo, exist_flag, no_exists):\n                    logger.info("【每日新剧助手】过滤媒体库已存在内容: %s", mediainfo.title_year)\n                    continue'''
          assert text.count(old_filter) == 2, text.count(old_filter)
          text = text.replace(old_filter, new_filter)

          assert '        chunk_size = 20' in text
          text = text.replace('        chunk_size = 20', '        chunk_size = 8', 1)
          text = text.replace(
              '            lines = ["已过滤媒体库已有和现有订阅；重复提醒只影响消息，不影响插件页面候选：", ""]',
              '            lines = ["完整候选列表：已过滤媒体库中已有任意内容及现有订阅。", ""]',
              1,
          )

          text = text.replace(
              '"label": "重复提醒间隔(天)", "placeholder": "7"',
              '"label": "重复提醒记录(兼容)", "placeholder": "7"',
              1,
          )
          text = text.replace(
              '"text": "页面候选不限数量，仅过滤媒体库已有和 MoviePilot 已订阅内容；重复提醒间隔只影响消息推送，不会让候选从页面消失。每张剧集卡片可直接点击订阅。"',
              '"text": "页面和定时消息均输出完整候选；媒体库中只要已有该剧任意一集或任意一季即过滤，同时过滤 MoviePilot 已订阅内容。消息按较小批次发送，避免渠道长度或按钮限制导致缺项。"',
              1,
          )

          src_path.write_text(text, encoding='utf-8')

          package_path = Path('package.v3.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          daily = package['DailyNewDrama']
          daily['version'] = '3.0.1'
          daily['description'] = 'MoviePilot V3 新剧与在播剧聚合助手，聚合豆瓣、腾讯视频、爱奇艺、优酷、芒果TV、哔哩哔哩；媒体库中已有任意剧集即过滤，并支持完整分批通知与页面一键订阅。'
          history = daily.setdefault('history', {})
          daily['history'] = {
              'v3.0.1': '修复媒体库部分入库剧集未过滤；定时推送默认发送完整候选，并缩小单条消息批次，避免重复提醒抑制和消息渠道长度/按钮限制导致推送缺项。',
              **history,
          }
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          contract_path = Path('tests/v3/dailynewdrama/test_plugin_contract.py')
          contract = contract_path.read_text(encoding='utf-8')
          contract = contract.replace('assert "plugin_version = \\"3.0.0\\"" in text', 'assert "plugin_version = \\"3.0.1\\"" in text')
          contract = contract.replace('assert idx["version"]=="3.0.0" and idx["system_version"]==">=3.0.0"', 'assert idx["version"]=="3.0.1" and idx["system_version"]==">=3.0.0"')
          extra = '''\n# 3.0.1 regression contracts\nassert "def _media_library_has_content" in text\nassert "suppress_recent: bool = False" in text\nassert "chunk_size = 8" in text\nassert text.count("_media_library_has_content(mediainfo, exist_flag, no_exists)") == 2\nassert "完整候选列表" in text\n\nimport ast\ntree = ast.parse(text)\nhelper_node = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "_media_library_has_content")\nhelper_node.returns = None\nfor arg in helper_node.args.args:\n    arg.annotation = None\nmodule = ast.Module(body=[helper_node], type_ignores=[])\nast.fix_missing_locations(module)\nns = {}\nexec(compile(module, str(V3 / "__init__.py"), "exec"), ns)\nhelper = ns["_media_library_has_content"]\n\nclass _Media:\n    seasons = {1: [1, 2, 3], 2: [1, 2]}\n\nclass _Missing:\n    def __init__(self, episodes):\n        self.episodes = episodes\n\nassert helper(_Media(), True, {}) is True\nassert helper(_Media(), False, {"tmdb:1": {1: _Missing([]), 2: _Missing([])}}) is False\nassert helper(_Media(), False, {"tmdb:1": {1: _Missing([3]), 2: _Missing([])}}) is True\nassert helper(_Media(), False, {"tmdb:1": {2: _Missing([])}}) is True\n'''
          if '# 3.0.1 regression contracts' not in contract:
              contract += extra
          contract_path.write_text(contract, encoding='utf-8')
          PY
      - name: Validate patched plugin
        run: |
          python -m compileall -q plugins.v3/dailynewdrama
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m json.tool package.v3.json >/dev/null
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v3/dailynewdrama/__init__.py package.v3.json tests/v3/dailynewdrama/test_plugin_contract.py
          git commit -m "fix: DailyNewDrama 3.0.1 library filtering and complete notifications"
          git push origin HEAD:fix/dailynewdrama-library-notify-complete
