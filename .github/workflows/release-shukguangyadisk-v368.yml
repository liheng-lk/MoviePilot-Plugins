name: Release ShukGuangYaDisk v3.6.8

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-shukguangyadisk-v368.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump ShukGuangYaDisk to v3.6.8
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          version = '3.6.8'
          history = (
              '修复已整理/已搬空资源残留 pending 持续优先回访：终态成功后即时收口；'
              '按直属状态机证据批量清理陈旧 pending；同轮最多清理 50 个搬空目录并同步移出 known-resource；'
              '保留 stabilizing/history_wait/retry_wait/inflight 的真实等待资源，避免历史任务阻塞新资源扫描。'
          )

          local_meta_path = plugin / 'plugin.json'
          local_meta = json.loads(local_meta_path.read_text(encoding='utf-8'))
          local_meta['version'] = version
          old_history = dict(local_meta.get('history') or {})
          local_meta['history'] = {f'v{version}': history, **old_history}
          local_meta_path.write_text(json.dumps(local_meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = root / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          market = dict(package['ShukGuangYaDisk'])
          market['version'] = version
          market_history = dict(market.get('history') or {})
          market['history'] = {f'v{version}': history, **market_history}
          package['ShukGuangYaDisk'] = market
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          entry_path = plugin / '__init__.py'
          entry = entry_path.read_text(encoding='utf-8')
          old = 'plugin_version = "3.6.7"'
          assert old in entry, 'unexpected ShukGuangYaDisk plugin_version before v3.6.8 release'
          entry_path.write_text(entry.replace(old, f'plugin_version = "{version}"', 1), encoding='utf-8')

          remote_path = plugin / 'dist' / 'assets' / 'remoteEntry.js'
          remote = remote_path.read_text(encoding='utf-8')
          assert '?v=3.6.7' in remote, 'unexpected ShukGuangYaDisk remoteEntry cache version before v3.6.8 release'
          remote_path.write_text(remote.replace('?v=3.6.7', f'?v={version}'), encoding='utf-8')
          PY
      - name: Validate release contracts
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          assert json.loads((plugin / 'plugin.json').read_text(encoding='utf-8'))['version'] == '3.6.8'
          assert json.loads((root / 'package.v3.json').read_text(encoding='utf-8'))['ShukGuangYaDisk']['version'] == '3.6.8'
          assert 'plugin_version = "3.6.8"' in (plugin / '__init__.py').read_text(encoding='utf-8')
          assert '?v=3.6.8' in (plugin / 'dist' / 'assets' / 'remoteEntry.js').read_text(encoding='utf-8')
          PY
      - name: Commit v3.6.8 release and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/release-shukguangyadisk-v368.yml
          git add plugins.v3/shukguangyadisk/plugin.json \
                  plugins.v3/shukguangyadisk/__init__.py \
                  plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js \
                  package.v3.json
          git commit -m "release(shukguangyadisk): v3.6.8 terminal pending cleanup"
          git push origin main
