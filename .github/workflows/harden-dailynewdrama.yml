name: Harden Daily New Drama

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'harden-dailynewdrama'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('plugins.v2/dailynewdrama/__init__.py')
          s = p.read_text(encoding='utf-8')

          if 'import uuid\n' not in s:
              s = s.replace('import re\n', 'import re\nimport uuid\n', 1)

          # Protect one bad media item from aborting the entire daily refresh.
          start = s.index('        for raw in raw_items:\n')
          end = s.index('        payload = {\n', start)
          block = s[start:end]
          if '【每日新剧助手】处理候选条目失败' not in block:
              lines = block.splitlines(True)
              head = lines[0]
              body = ''.join('    ' + line if line.strip() else line for line in lines[1:])
              block = head + '            try:\n' + body + '            except Exception as err:\n                logger.warning("【每日新剧助手】处理候选条目失败 %s: %s", raw.get("title"), err)\n                continue\n\n'
              s = s[:start] + block + s[end:]

          # A recognized item without TMDB id cannot be safely subscribed later.
          needle = '                if not mediainfo or mediainfo.type != MediaType.TV:\n                    continue\n'
          repl = needle + '                if not mediainfo.tmdb_id:\n                    logger.warning("【每日新剧助手】过滤无 TMDB ID 条目: %s", mediainfo.title_year)\n                    continue\n'
          if '过滤无 TMDB ID 条目' not in s:
              s = s.replace(needle, repl, 1)

          # Give every refresh its own immutable batch id so old notification buttons never point at a new list.
          needle = '        current_year = datetime.datetime.now().year\n\n'
          if 'batch_id = ' not in s[s.index('def refresh_and_notify'):s.index('def _recognize')]:
              s = s.replace(needle, needle + '        batch_id = datetime.datetime.now().strftime("%Y%m%d%H%M%S") + "-" + uuid.uuid4().hex[:8]\n\n', 1)

          s = s.replace('        payload = {\n            "date": datetime.datetime.now().strftime("%Y-%m-%d"),', '        payload = {\n            "batch_id": batch_id,\n            "date": datetime.datetime.now().strftime("%Y-%m-%d"),', 1)

          needle = '        self.save_data("daily_candidates", payload)\n'
          if 'candidate_batches' not in s[s.index('def refresh_and_notify'):s.index('def _recognize')]:
              repl = '''        self.save_data("daily_candidates", payload)\n        batches = self.get_data("candidate_batches") or []\n        batches = [b for b in batches if isinstance(b, dict) and b.get("batch_id") != batch_id]\n        batches.append(payload)\n        self.save_data("candidate_batches", batches[-20:])\n'''
              s = s.replace(needle, repl, 1)

          # Message callbacks carry batch id; manual /newdrama_sub continues to use the latest batch.
          s = s.replace('    def _send_candidates(self, items: List[Dict[str, Any]], channel=None, userid=None):', '    def _send_candidates(self, items: List[Dict[str, Any]], channel=None, userid=None, batch_id: str = ""):', 1)
          needle = '        lines = ["已自动过滤媒体库已有内容和现有订阅：", ""]\n'
          if 'if not batch_id:' not in s[s.index('def _send_candidates'):s.index('def _parse_indexes')]:
              s = s.replace(needle, '        if not batch_id:\n            batch_id = str((self.get_data("daily_candidates") or {}).get("batch_id") or "")\n' + needle, 1)
          s = s.replace('"callback_data": f"[PLUGIN]{self.__class__.__name__}|sub|{item[\'index\']}"', '"callback_data": f"[PLUGIN]{self.__class__.__name__}|sub|{batch_id}|{item[\'index\']}"', 1)

          old = '''        text = str(event_data.get("text") or "")\n        if not text.startswith("sub|"):\n            return\n        try:\n            index = int(text.split("|", 1)[1])\n        except (TypeError, ValueError):\n            return\n        result = self._subscribe_indexes([index])\n'''
          new = '''        text = str(event_data.get("text") or "")\n        if not text.startswith("sub|"):\n            return\n        parts = text.split("|")\n        try:\n            if len(parts) >= 3:\n                batch_id = parts[1]\n                index = int(parts[2])\n            else:\n                batch_id = ""\n                index = int(parts[1])\n        except (TypeError, ValueError, IndexError):\n            return\n        result = self._subscribe_indexes([index], batch_id=batch_id)\n'''
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace('    def _subscribe_indexes(self, indexes: List[int]) -> Dict[str, Any]:', '    def _subscribe_indexes(self, indexes: List[int], batch_id: str = "") -> Dict[str, Any]:', 1)
          old = '''        data = self.get_data("daily_candidates") or {}\n        items = data.get("items") or []\n'''
          new = '''        data = self.get_data("daily_candidates") or {}\n        if batch_id and str(data.get("batch_id") or "") != batch_id:\n            batches = self.get_data("candidate_batches") or []\n            data = next((b for b in reversed(batches) if isinstance(b, dict) and str(b.get("batch_id") or "") == batch_id), {})\n            if not data:\n                return {"success": False, "message": "该推荐批次已过期，请发送 /newdrama 获取最新列表。"}\n        items = data.get("items") or []\n'''
          idx = s.index('    def _subscribe_indexes')
          tail = s[idx:]
          if old in tail and '该推荐批次已过期' not in tail:
              tail = tail.replace(old, new, 1)
              s = s[:idx] + tail

          # Do not overclaim the source: tv_hot is a current Douban hot-TV feed filtered to recent years.
          s = s.replace('每天推送豆瓣近期新剧，自动过滤已订阅和媒体库已有内容，并支持按序号订阅。', '每天推送豆瓣近期热门剧集候选，自动过滤已订阅和媒体库已有内容，并支持按序号订阅。')
          s = s.replace('每天读取豆瓣热门电视剧榜，只保留近年剧集；', '每天读取豆瓣热门电视剧榜并筛选近年剧集；')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Add permanent validation suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests .github/workflows
          cat > tests/test_dailynewdrama_logic.py <<'PY'
          import ast
          import json
          import re
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = ROOT / 'plugins.v2/dailynewdrama/__init__.py'

          def load_parse_indexes():
              tree = ast.parse(SOURCE.read_text(encoding='utf-8'))
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == 'DailyNewDrama':
                      for fn in node.body:
                          if isinstance(fn, ast.FunctionDef) and fn.name == '_parse_indexes':
                              fn.decorator_list = []
                              module = ast.Module(body=[fn], type_ignores=[])
                              ast.fix_missing_locations(module)
                              ns = {'re': re, 'List': list}
                              exec(compile(module, str(SOURCE), 'exec'), ns)
                              return ns['_parse_indexes']
              raise AssertionError('_parse_indexes not found')

          class DailyNewDramaTests(unittest.TestCase):
              def test_index_parser(self):
                  parse = load_parse_indexes()
                  self.assertEqual(parse('1,3'), [1, 3])
                  self.assertEqual(parse('1-3'), [1, 2, 3])
                  self.assertEqual(parse('3-1'), [1, 2, 3])
                  self.assertEqual(parse('1， 3 5'), [1, 3, 5])
                  self.assertEqual(parse('0,x,-1'), [])

              def test_batch_safe_callbacks_present(self):
                  text = SOURCE.read_text(encoding='utf-8')
                  self.assertIn('candidate_batches', text)
                  self.assertIn('|sub|{batch_id}|', text)
                  self.assertIn('该推荐批次已过期', text)

              def test_runtime_guards_present(self):
                  text = SOURCE.read_text(encoding='utf-8')
                  self.assertIn('处理候选条目失败', text)
                  self.assertIn('过滤无 TMDB ID 条目', text)
                  self.assertIn('get_no_exists_info', text)
                  self.assertIn('subscribe_chain.exists', text)

              def test_plugin_indexes(self):
                  for name in ('plugin.json', 'package.v2.json'):
                      data = json.loads((ROOT / name).read_text(encoding='utf-8'))
                      self.assertIn('DailyNewDrama', data)
                      self.assertIn('ShukGuangYaDisk', data)

          if __name__ == '__main__':
              unittest.main()
          PY

          cat > .github/workflows/validate.yml <<'YML'
          name: Validate MoviePilot Plugins
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Python syntax
                  run: |
                    python -m compileall -q plugins.v2
                    find plugins.v2 -type d -name '__pycache__' -prune -exec rm -rf {} +
                    find plugins.v2 -type f -name '*.pyc' -delete
                - name: Unit tests
                  run: python -m unittest discover -s tests -v
                - name: JSON indexes
                  run: python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['plugin.json','package.v2.json']]"
                - name: No generated Python artifacts
                  run: test -z "$(find . -type f -name '*.pyc' -o -type d -name '__pycache__')"
          YML

      - name: Validate now
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q plugins.v2
          find plugins.v2 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 -type f -name '*.pyc' -delete
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          for p in ('plugin.json','package.v2.json'):
              json.load(open(p, encoding='utf-8'))
              print('OK', p)
          PY

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -f .harden-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: harden daily new drama runtime and add CI'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
