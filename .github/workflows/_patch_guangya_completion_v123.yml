name: Patch GuangYa Transfer v1.2.3
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_patch_guangya_completion_v123.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-transfer-completion-imports-v1.2.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply completion hotfix
        shell: python
        run: |
          from pathlib import Path
          import json

          src = Path('plugins.v3/guangyatransferassistant/__init__.py')
          text = src.read_text(encoding='utf-8')
          old = 'from app.chain.subscribe import SubscribeChain\n'
          new = 'from app.chain.subscribe import SubscribeChain, build_subscribe_meta\nfrom app.chain.media import MediaChain\n'
          assert old in text, 'subscribe import not found'
          text = text.replace(old, new, 1)
          text = text.replace('plugin_version = "1.2.2"', 'plugin_version = "1.2.3"', 1)

          old_status = '"状态：部分转存完成，剩余保持转存路线等待下轮" if partial else "状态：增量转存已确认完成",'
          new_status = '"状态：转存完成，MoviePilot订阅已完成并移入历史" if completed_subscription else ("状态：部分转存完成，剩余保持转存路线等待下轮" if partial else "状态：增量转存已确认完成"),'
          assert old_status in text, 'notification status block not found'
          text = text.replace(old_status, new_status, 1)

          old_log = 'logger.info("【光鸭转存助手】【通知】已发送%s通知：#%s %s", "部分转存" if partial else "增量转存成功", sid, getattr(subscribe, "name", ""))'
          new_log = 'logger.info("【光鸭转存助手】【通知】已发送%s通知：#%s %s", "订阅完成" if completed_subscription else ("部分转存" if partial else "增量转存成功"), sid, getattr(subscribe, "name", ""))'
          assert old_log in text, 'notification log block not found'
          text = text.replace(old_log, new_log, 1)

          old_return = 'return {"success": True, "handled": True, "message": f"增量转存成功，本次新增 {len(unique_paths)} 个文件", "new_count": len(unique_paths), "target_path": target_path, "remaining": remaining_due_to_cap}'
          new_return = 'return {"success": True, "handled": True, "completed": completed_subscription, "message": (f"转存完成，本次新增 {len(unique_paths)} 个文件；订阅已移入历史" if completed_subscription else f"增量转存成功，本次新增 {len(unique_paths)} 个文件"), "new_count": len(unique_paths), "target_path": target_path, "remaining": remaining_due_to_cap}'
          assert old_return in text, 'success return block not found'
          text = text.replace(old_return, new_return, 1)
          src.write_text(text, encoding='utf-8')

          pj = Path('plugins.v3/guangyatransferassistant/plugin.json')
          data = json.loads(pj.read_text(encoding='utf-8'))
          data['version'] = '1.2.3'
          data['description'] = '固定转存订阅，支持订阅快速搜索、剧集进度同步，并修复转存完成后未触发 MoviePilot 官方订阅完成流程的问题。'
          pj.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pkg = Path('package.v3.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          item = data['GuangYaTransferAssistant']
          item['version'] = '1.2.3'
          item['description'] = '光鸭订阅固定分流：订阅选择支持快速搜索；转存集数实时同步 MoviePilot，修复完成后活动订阅未自动移除。'
          history = item.get('history') or {}
          item['history'] = {
              'v1.2.3': '修复订阅已完成 N/N、剩余0但仍留在活动订阅的问题：补齐 MoviePilot 官方完成链所需 build_subscribe_meta/MediaChain 运行时依赖；转存确认成功后立即执行完成流程，完成后通知明确显示已移入订阅历史。',
              **history,
          }
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test = Path('tests/v3/guangyatransferassistant/test_plugin_contract.py')
          tt = test.read_text(encoding='utf-8')
          tt = tt.replace('assert package["version"] == "1.2.2" and local["version"] == "1.2.2"', 'assert package["version"] == "1.2.3" and local["version"] == "1.2.3"')
          tt = tt.replace('assert \'plugin_version = "1.2.2"\' in text', 'assert \'plugin_version = "1.2.3"\' in text')
          marker = '    assert "subscribe_search" in text and "new_subscribe_search" in text\n'
          extra = '    assert "from app.chain.subscribe import SubscribeChain, build_subscribe_meta" in text\n    assert "from app.chain.media import MediaChain" in text\n    assert "MoviePilot订阅已完成并移入历史" in text\n'
          assert marker in tt, 'test marker not found'
          tt = tt.replace(marker, extra + marker, 1)
          test.write_text(tt, encoding='utf-8')
      - name: Python syntax
        run: python -m py_compile plugins.v3/guangyatransferassistant/__init__.py
      - name: GuangYa tests
        run: python -m pytest -q tests/v3/guangyatransferassistant/test_plugin_contract.py
      - name: JSON indexes
        run: python -m json.tool package.v3.json >/dev/null && python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Runtime dependency contract
        run: |
          grep -F 'from app.chain.subscribe import SubscribeChain, build_subscribe_meta' plugins.v3/guangyatransferassistant/__init__.py
          grep -F 'from app.chain.media import MediaChain' plugins.v3/guangyatransferassistant/__init__.py
          grep -F 'MoviePilot订阅已完成并移入历史' plugins.v3/guangyatransferassistant/__init__.py
      - name: Commit final files and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/_patch_guangya_completion_v123.yml
          git add package.v3.json plugins.v3/guangyatransferassistant/__init__.py plugins.v3/guangyatransferassistant/plugin.json tests/v3/guangyatransferassistant/test_plugin_contract.py
          git commit -m 'fix: complete GuangYa subscriptions after transfer'
          git push origin HEAD:fix/guangya-transfer-completion-imports-v1.2.3
