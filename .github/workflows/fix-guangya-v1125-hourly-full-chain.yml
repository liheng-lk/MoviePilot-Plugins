name: Fix GuangYa v1.12.5 hourly full-chain pull

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-guangya-v1125-hourly-full-chain.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply hourly full-chain dispatch fix
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          path = root / 'plugins.v3' / 'guangyatransferassistant' / 'dispatch_policy_v1125.py'
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '- 主动 GYING 只由更新日历服务统一驱动：TV/动漫先按 due_uncovered 过滤，电影按外部\n'
              '  检索冷却参与；日历不可用时才退回旧的“真实缺集 + 冷却”语义；',
              '- 常规主动完整资源链只由更新日历服务统一驱动：TV/动漫先按 due_uncovered 过滤，电影按待处理状态参与；\n'
              '  每小时只复查今天应处理且仍未覆盖的媒体，依次复用迅雷秒传、光鸭分享、Magnet、ED2K；\n'
              '  日历不可用时才退回旧的“真实缺集 + 有界冷却”语义；',
              1,
          )

          old_cooldown = '''        try:\n            cooldown = max(900, int(getattr(self, "_external_search_cooldown_minutes_v1114", 180) or 180) * 60)\n        except (TypeError, ValueError):\n            cooldown = 180 * 60\n        return not last_at or now - last_at >= cooldown\n'''
          new_cooldown = '''        # AiringDue 本身每 60 分钟运行；这里的职责只是避免同一媒体在一个小时窗口内\n        # 被并发/补偿触发重复访问外部资源站。非今日媒体会在后续日历 gate 被直接排除。\n        cooldown = 60 * 60\n        return not last_at or now - last_at >= cooldown\n'''
          if old_cooldown not in text:
              raise SystemExit('expected v1.12.5 cooldown block not found')
          text = text.replace(old_cooldown, new_cooldown, 1)

          marker = '    def _smart_pull_due_ids_v1125(self) -> List[int]:\n'
          if marker not in text:
              raise SystemExit('smart pull marker not found')
          claim = '''    def _claim_external_search_round_v1114(self, subscribe: Any, force: bool = False) -> bool:\n        """今日到期媒体允许每小时进入一次完整外部资源链；其它模式继续沿用全局治理冷却。"""\n        reader = getattr(self, "_route_source_mode_value_v1115", None)\n        mode = str(reader() if callable(reader) else getattr(self, "_route_source_mode_v1115", "") or "")\n        if force or mode != "airing_pull":\n            return bool(super()._claim_external_search_round_v1114(subscribe, force=force))\n\n        sid = int(getattr(subscribe, "id", 0) or 0)\n        if sid <= 0:\n            return False\n        try:\n            state = dict(self._external_search_state_v1114() or {})\n        except Exception:\n            state = {}\n        row = dict(state.get(str(sid)) or {})\n        try:\n            last_at = float(row.get("last_at") or 0)\n        except (TypeError, ValueError):\n            last_at = 0.0\n        now = time.time()\n        cooldown = 60 * 60\n        allowed = not last_at or now - last_at >= cooldown\n        self._external_round_allowed_v1114[sid] = allowed\n        if allowed:\n            state[str(sid)] = {\n                **row,\n                "last_at": now,\n                "last_time": self._now_text(),\n                "cooldown_minutes": 60,\n                "origin": "airing_full_chain_v1125",\n            }\n            if len(state) > 1000:\n                state = dict(sorted(\n                    state.items(),\n                    key=lambda pair: float((pair[1] or {}).get("last_at") or 0),\n                    reverse=True,\n                )[:1000])\n            self.save_data("external_search_guard", state)\n        else:\n            remaining = max(1, int((cooldown - (now - last_at)) / 60))\n            self._plugin_log(\n                "INFO",\n                "【光鸭转存助手】【今日资源复查】#%s %s 已在本小时执行过完整资源链，约 %s 分钟后允许再次复查",\n                sid,\n                str(getattr(subscribe, "name", "") or ""),\n                remaining,\n            )\n        return allowed\n\n'''
          if 'origin": "airing_full_chain_v1125"' not in text:
              text = text.replace(marker, claim + marker, 1)

          text = text.replace(
              '# 每小时 AiringDue：唯一常规主动 GYING 时钟，严格服从外部检索冷却。',
              '# 每小时 AiringDue：只处理今日到期媒体，并执行完整资源链；同媒体一小时最多一次。',
              1,
          )
          text = text.replace(
              '"【光鸭转存助手】【主动拉取】日历/电影冷却筛选后执行 %s 个订阅；5 分钟频道 tick 不再启动 GYING",',
              '"【光鸭转存助手】【今日资源复查】本小时执行 %s 个到期订阅的完整资源链；频道仍按 5 分钟 Push 实时抢跑",',
              1,
          )
          text = text.replace(
              '"mode": "single_airing_pull",',
              '"mode": "hourly_due_full_chain",',
              1,
          )

          path.write_text(text, encoding='utf-8')

          test_path = root / 'tests' / 'v3' / 'guangyatransferassistant' / 'test_hourly_full_chain_v1125.py'
          test_path.write_text(r'''from __future__ import annotations

import ast
from pathlib import Path


ROOT = Path(__file__).resolve().parents[3]
PLUGIN = ROOT / "plugins.v3" / "guangyatransferassistant"
POLICY = (PLUGIN / "dispatch_policy_v1125.py").read_text(encoding="utf-8")
XUNLEI = (PLUGIN / "xunlei_flash_v193.py").read_text(encoding="utf-8")
VIEWING = (PLUGIN / "viewing_dispatch_v1113.py").read_text(encoding="utf-8")


def _method(name: str, next_name: str) -> str:
    start = POLICY.index(f"    def {name}(")
    end = POLICY.index(f"    def {next_name}(", start)
    return POLICY[start:end]


def test_policy_parses_after_hourly_full_chain_change():
    ast.parse(POLICY)


def test_airing_selector_uses_one_hour_window_not_global_180_minute_guard():
    cooldown = _method("_external_cooldown_due_v1125", "_claim_external_search_round_v1114")
    assert "cooldown = 60 * 60" in cooldown
    assert "_external_search_cooldown_minutes_v1114" not in cooldown


def test_airing_pull_claim_has_dedicated_hourly_external_window():
    claim = _method("_claim_external_search_round_v1114", "_smart_pull_due_ids_v1125")
    assert 'mode != "airing_pull"' in claim
    assert "cooldown = 60 * 60" in claim
    assert '"cooldown_minutes": 60' in claim
    assert '"origin": "airing_full_chain_v1125"' in claim
    assert "super()._claim_external_search_round_v1114" in claim


def test_hourly_due_runs_normal_subscription_chain_not_channel_only_worker():
    due = _method("_calendar_due_check_v1110", "_repair_signature_v1125")
    assert '_run_v1115_mode_batch(' in due
    assert '"airing_pull"' in due
    assert "force=False" in due
    assert '"hourly_due_full_chain"' in due
    assert "完整资源链" in due


def test_normal_subscription_chain_keeps_xunlei_first_then_fallback_sources():
    xunlei_method = XUNLEI.split("    def _try_transfer_subscription_inner(", 1)[1].split(
        "    def api_xunlei_flash_test(", 1
    )[0]
    assert "flash = self._dispatch_xunlei_flash(subscribe)" in xunlei_method
    assert "if flash.get(\"handled\")" in xunlei_method
    assert "lower = super()._try_transfer_subscription_inner" in xunlei_method

    viewing_method = VIEWING.split("    def _try_transfer_subscription_inner(", 1)[1]
    assert "lower = dict(super()._try_transfer_subscription_inner" in viewing_method
    assert "viewing = self._dispatch_viewing_external_v1113(subscribe)" in viewing_method
    assert "if viewing.get(\"actions\")" in viewing_method
''', encoding='utf-8')
          PY

      - name: Validate plugin contracts
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant
          python -m unittest discover -s tests/v3/guangyatransferassistant -p 'test_*.py' -v
          python tests/v3/guangyatransferassistant/run_contract_tests.py

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-guangya-v1125-hourly-full-chain.yml
          git add plugins.v3/guangyatransferassistant/dispatch_policy_v1125.py \
                  tests/v3/guangyatransferassistant/test_hourly_full_chain_v1125.py
          git commit -m "fix(guangya): hourly due media runs full source chain"
          git push origin main
