name: Finalize GuangYa v1.12.15 r62

on:
  push:
    branches:
      - fix/guangya-v1.12.15-channel-reconcile

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.15-channel-reconcile
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final release truth
        run: python scripts/_finalize_guangya_v11215_r62.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: V3 plugin contract tests
        run: |
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: V3 dependency manifests
        run: |
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"
          python - <<'PY'
          from pathlib import Path
          import tomllib
          for path in Path('plugins.v3').glob('*/pyproject.toml'):
              with path.open('rb') as f:
                  project = tomllib.load(f)['project']
              assert project.get('dynamic') == ['version'], path
              assert project.get('requires-python') == '>=3.12', path
          shuk = Path('plugins.v3/shukguangyadisk')
          assert not (shuk / 'pyproject.toml').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          assert not (shuk / 'requirements.txt').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          PY
      - name: JSON indexes
        run: python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['plugin.json','package.v2.json','package.v3.json','plugins.v3/guangyatransferassistant/plugin.json']]"
      - name: Cleanup test artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: No generated Python artifacts
        run: test -z "$(find . -type f -name '*.pyc' -o -type d -name '__pycache__')"
      - name: Commit validated r62
        run: |
          rm -f .github/workflows/_finalize-guangya-v11215-r62.yml scripts/_finalize_guangya_v11215_r62.py
          git config user.name "liheng-lk"
          git config user.email "69590718+liheng-lk@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release(guangya): finalize v1.12.15 channel prewarm r62"
          git push origin HEAD:fix/guangya-v1.12.15-channel-reconcile
