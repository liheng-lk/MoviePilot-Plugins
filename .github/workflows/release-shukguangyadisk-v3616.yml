name: Release ShukGuangYaDisk v3.6.16

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-shukguangyadisk-v3616.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump ShukGuangYaDisk to v3.6.16
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          old_version = '3.6.15'
          version = '3.6.16'
          history = (
              '完善 v3.6.15 retry/pending 可观测性：状态页与自检直接展示重试总数、退避中、已到期和最大尝试次数，'
              'retry_due 大于 0 时明确提示已到期待重试，并兼容旧后端只有 state_retry_wait/retry_wait 的返回。'
              '同时移除 v3.5.x 已过时的“目录粘性事务/当前剧集目录”前端文案，改为当前单 Worker 串行、等待资源优先复查、'
              '无活动执行时同一监控周期继续 known/discovery 的真实语义；不修改后端调度、持久状态 schema 或 MoviePilot 媒体业务规则。'
          )

          local_meta_path = plugin / 'plugin.json'
          local_meta = json.loads(local_meta_path.read_text(encoding='utf-8'))
          assert local_meta['version'] == old_version, local_meta['version']
          local_meta['version'] = version
          local_meta['history'] = {f'v{version}': history, **dict(local_meta.get('history') or {})}
          local_meta_path.write_text(json.dumps(local_meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = root / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          market = dict(package['ShukGuangYaDisk'])
          assert market['version'] == old_version, market['version']
          market['version'] = version
          market['history'] = {f'v{version}': history, **dict(market.get('history') or {})}
          package['ShukGuangYaDisk'] = market
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          entry_path = plugin / '__init__.py'
          entry = entry_path.read_text(encoding='utf-8')
          old = f'plugin_version = "{old_version}"'
          assert old in entry
          entry_path.write_text(entry.replace(old, f'plugin_version = "{version}"', 1), encoding='utf-8')

          remote_path = plugin / 'dist' / 'assets' / 'remoteEntry.js'
          remote = remote_path.read_text(encoding='utf-8')
          assert f'?v={old_version}' in remote
          remote_path.write_text(remote.replace(f'?v={old_version}', f'?v={version}'), encoding='utf-8')
          PY
      - name: Validate release contracts
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          page = (plugin / 'dist' / 'assets' / '__federation_expose_AssistantPage-v352.js').read_text(encoding='utf-8')
          assert json.loads((plugin / 'plugin.json').read_text(encoding='utf-8'))['version'] == '3.6.16'
          assert json.loads((root / 'package.v3.json').read_text(encoding='utf-8'))['ShukGuangYaDisk']['version'] == '3.6.16'
          assert 'plugin_version = "3.6.16"' in (plugin / '__init__.py').read_text(encoding='utf-8')
          assert '?v=3.6.16' in (plugin / 'dist' / 'assets' / 'remoteEntry.js').read_text(encoding='utf-8')
          for token in ('state_retry_total', 'state_retry_due', 'state_retry_max_attempts', "'重试总数'", "'已到期'"):
              assert token in page, token
          assert 'sticky_tv_group_path' not in page
          PY
      - name: Commit v3.6.16 release and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/release-shukguangyadisk-v3616.yml
          git add plugins.v3/shukguangyadisk/plugin.json \
                  plugins.v3/shukguangyadisk/__init__.py \
                  plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js \
                  package.v3.json
          git commit -m "release(shukguangyadisk): v3.6.16 retry observability"
          git push origin main
