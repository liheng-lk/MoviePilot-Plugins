name: ShukGuangYaDisk V4 One-shot Patch

on:
  push:
    branches:
      - rebuild/shukguangyadisk-v4
    paths:
      - '.github/workflows/shukguangyadisk-v4-autopatch.yml'

permissions:
  contents: write

jobs:
  patch-webdav-put:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/shukguangyadisk-v4
          fetch-depth: 0

      - name: Patch WebDAV PUT existing-target handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('plugins.v3/shukguangyadisk/__init__.py')
          source = path.read_text(encoding='utf-8')

          method_start = source.index('    def _handle_put(self, request: Request, path: str) -> Response:')
          method_end = source.index('    def _handle_move(self, request: Request, path: str) -> Response:', method_start)
          block = source[method_start:method_end]

          marker = '        # 将上传内容写入临时文件（同步环境下从 _body 缓存读取）\n'
          if block.count(marker) != 1:
              raise SystemExit(f'WebDAV PUT body marker count={block.count(marker)}; refusing ambiguous patch')
          block = block.replace(
              marker,
              '        # PUT 响应区分新建(201)与覆盖(204)，并避免旧实现引用未定义的 item。\n'
              '        existing_item = self._api.get_item(PathLib(path))\n\n'
              + marker,
              1,
          )

          old = 'return Response(status_code=201 if not item else 204)'
          new = 'return Response(status_code=201 if not existing_item else 204)'
          if block.count(old) != 1:
              raise SystemExit(f'WebDAV PUT response marker count={block.count(old)}; refusing ambiguous patch')
          block = block.replace(old, new, 1)

          source = source[:method_start] + block + source[method_end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify focused source change
        run: |
          python -m py_compile plugins.v3/shukguangyadisk/__init__.py
          grep -F 'existing_item = self._api.get_item(PathLib(path))' plugins.v3/shukguangyadisk/__init__.py
          grep -F '201 if not existing_item else 204' plugins.v3/shukguangyadisk/__init__.py
          ! grep -F '201 if not item else 204' plugins.v3/shukguangyadisk/__init__.py

      - name: Commit focused fix
        run: |
          if git diff --quiet -- plugins.v3/shukguangyadisk/__init__.py; then
            echo 'No source change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins.v3/shukguangyadisk/__init__.py
          git commit -m 'fix(shukguangyadisk): repair WebDAV PUT response state'
          git push origin HEAD:rebuild/shukguangyadisk-v4
