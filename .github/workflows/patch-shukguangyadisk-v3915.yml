name: Patch ShukGuangYaDisk v3.9.15

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-shukguangyadisk-v3915.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v3.9.15 patch
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import json
          import re
          from pathlib import Path

          init_path = Path('plugins.v3/shukguangyadisk/__init__.py')
          package_path = Path('package.v3.json')
          text = init_path.read_text(encoding='utf-8')

          pattern = re.compile(r'(_BUNDLED_SOURCES:\s*_BundleDict\[str, str\]\s*=\s*_bundle_json\.loads\()(' + r'"(?:\\.|[^"\\])*"' + r')(\))', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('cannot locate _BUNDLED_SOURCES json literal')
          payload = ast.literal_eval(match.group(2))
          sources = json.loads(payload)
          module_name = 'organizer_queue_recovery'
          module = sources[module_name]

          attrs_old = '''    _queue_guard_marker_key = "organize_v332_queue_guard"\n    _isolated_recovery_marker_key = "organize_v340_isolated_recovery"\n'''
          attrs_new = '''    _queue_guard_marker_key = "organize_v332_queue_guard"\n    _isolated_recovery_marker_key = "organize_v340_isolated_recovery"\n    _stale_pending_cleanup_marker_key = "organize_v3915_stale_durable_pending_cleanup"\n    _stale_pending_cleanup_limit = 200\n    _stale_pending_cleanup_lease_seconds = 120\n'''
          if attrs_new not in module:
              if attrs_old not in module:
                  raise SystemExit('cannot locate queue recovery class attrs')
              module = module.replace(attrs_old, attrs_new, 1)

          old_discard = '''            try:\n                pending_oper.discard(storage=storage, src_path=src_path)\n                global_vars.stop_transfer(str(src_path))\n                quarantined.append(str(src_path))\n            except Exception as err:  # noqa: BLE001\n                errors.append(f"{storage}:{src_path}: {err}")\n'''
          new_discard = '''            try:\n                deleted = int(pending_oper.discard(storage=storage, src_path=src_path) or 0)\n                if deleted > 0:\n                    global_vars.stop_transfer(str(src_path))\n                    quarantined.append(str(src_path))\n            except Exception as err:  # noqa: BLE001\n                errors.append(f"{storage}:{src_path}: {err}")\n'''
          if new_discard not in module:
              if old_discard not in module:
                  raise SystemExit('cannot locate legacy discard block')
              module = module.replace(old_discard, new_discard, 1)

          method_marker = '    def _apply_legacy_queue_migration_once(self) -> Dict[str, Any]:\n'
          if '_cleanup_stale_durable_pending_v3915' not in module:
              if method_marker not in module:
                  raise SystemExit('cannot locate migration method marker')
              injected = r'''    def _cleanup_stale_durable_pending_v3915(self) -> Dict[str, Any]:
        """安全清理已丢失源文件且仍被 MoviePilot durable admission 反复回放的旧任务。"""
        result: Dict[str, Any] = {
            "version": "3.9.15",
            "scanned": 0,
            "legacy_deleted": 0,
            "claimed": 0,
            "missing_deleted": 0,
            "source_exists": 0,
            "protected": 0,
            "uncertain": 0,
            "remaining": 0,
            "sample": [],
            "errors": [],
            "skipped": "",
        }
        if not getattr(self, "_guangya_api", None):
            result["skipped"] = "guangya_api_unavailable"
            return result

        pending_oper = TransferPendingOper()
        try:
            try:
                rows = list(pending_oper.list_all(limit=5000) or [])
            except TypeError:
                rows = list(pending_oper.list_all() or [])
        except Exception as err:  # noqa: BLE001
            result["skipped"] = "pending_list_failed"
            result["errors"].append(str(err))
            return result

        storage_names = self._queue_guard_storage_names()
        candidates = [
            (str(storage or ""), str(src_path or ""))
            for storage, src_path in rows
            if str(storage or "") in storage_names
            and src_path
            and self._queue_guard_path_matches(str(src_path))
        ]
        if not candidates:
            marker = dict(result)
            marker["checked_at"] = time.time()
            marker["completed"] = True
            self.save_data(self._stale_pending_cleanup_marker_key, marker)
            return result

        try:
            chain = TransferChain()
            admissions = getattr(chain, "transfer_admission_repository", None)
            if admissions is None:
                admissions = getattr(chain, "_transfer_admissions", None)
        except Exception as err:  # noqa: BLE001
            admissions = None
            result["errors"].append(f"repository:{err}")
        if admissions is None:
            result["skipped"] = "admission_repository_unavailable"
            return result

        owner_id = f"shuk-guangya-v3915-{id(self)}"
        for storage, src_path in candidates[: self._stale_pending_cleanup_limit]:
            result["scanned"] += 1
            try:
                legacy_deleted = int(
                    pending_oper.discard(storage=storage, src_path=src_path) or 0
                )
            except Exception as err:  # noqa: BLE001
                legacy_deleted = 0
                result["errors"].append(f"legacy:{storage}:{src_path}:{err}")
            if legacy_deleted > 0:
                result["legacy_deleted"] += legacy_deleted
                global_vars.stop_transfer(src_path)
                if len(result["sample"]) < 20:
                    result["sample"].append({"path": src_path, "action": "legacy_deleted"})
                continue

            try:
                row = pending_oper.get_by_identity(storage=storage, src_path=src_path)
            except Exception as err:  # noqa: BLE001
                result["uncertain"] += 1
                result["errors"].append(f"identity:{storage}:{src_path}:{err}")
                continue
            task_id = str(getattr(row, "task_id", "") or "") if row is not None else ""
            if not task_id:
                continue

            try:
                admission = admissions.claim_task(
                    task_id=task_id,
                    owner_id=owner_id,
                    lease_seconds=self._stale_pending_cleanup_lease_seconds,
                )
            except Exception as err:  # noqa: BLE001
                result["uncertain"] += 1
                result["errors"].append(f"claim:{task_id}:{err}")
                continue
            if admission is None:
                result["protected"] += 1
                continue

            lease_token = str(getattr(admission, "lease_token", "") or "")
            if not lease_token:
                result["protected"] += 1
                continue
            result["claimed"] += 1

            try:
                source_item = self._guangya_api.get_item(Path(src_path))
            except Exception as err:  # noqa: BLE001
                result["uncertain"] += 1
                result["errors"].append(f"remote:{storage}:{src_path}:{err}")
                try:
                    admissions.release_claim(
                        task_id=task_id,
                        lease_token=lease_token,
                        error=f"光鸭 v3.9.15 远端复核失败，保留任务: {err}",
                    )
                except Exception as release_err:  # noqa: BLE001
                    result["errors"].append(f"release:{task_id}:{release_err}")
                continue

            if source_item is not None:
                result["source_exists"] += 1
                try:
                    admissions.release_claim(
                        task_id=task_id,
                        lease_token=lease_token,
                        error="光鸭 v3.9.15 复核：源文件仍存在，保留恢复任务",
                    )
                except Exception as err:  # noqa: BLE001
                    result["errors"].append(f"release:{task_id}:{err}")
                continue

            try:
                deleted = int(
                    admissions.abandon_unstarted(
                        task_id=task_id,
                        lease_token=lease_token,
                    )
                    or 0
                )
            except Exception as err:  # noqa: BLE001
                deleted = 0
                result["errors"].append(f"abandon:{task_id}:{err}")

            if deleted > 0:
                result["missing_deleted"] += deleted
                global_vars.stop_transfer(src_path)
                if len(result["sample"]) < 20:
                    result["sample"].append({"path": src_path, "action": "missing_deleted"})
                continue

            result["protected"] += 1
            try:
                admissions.release_claim(
                    task_id=task_id,
                    lease_token=lease_token,
                    error="光鸭 v3.9.15 复核：源文件已不存在，但任务已有执行证据，保留",
                )
            except Exception as err:  # noqa: BLE001
                result["errors"].append(f"release:{task_id}:{err}")

        try:
            try:
                remaining_rows = list(pending_oper.list_all(limit=5000) or [])
            except TypeError:
                remaining_rows = list(pending_oper.list_all() or [])
            result["remaining"] = sum(
                1
                for storage, src_path in remaining_rows
                if str(storage or "") in storage_names
                and src_path
                and self._queue_guard_path_matches(str(src_path))
            )
        except Exception as err:  # noqa: BLE001
            result["errors"].append(f"remaining:{err}")

        marker = dict(result)
        marker["checked_at"] = time.time()
        marker["completed"] = result["remaining"] == 0
        self.save_data(self._stale_pending_cleanup_marker_key, marker)
        if result["legacy_deleted"] or result["missing_deleted"]:
            logger.warning(
                "【光鸭云盘助手】【v3.9.15旧任务清理】扫描=%s，旧ABI删除=%s，确认源不存在删除=%s，"
                "源仍存在=%s，受保护=%s，不确定=%s，剩余=%s",
                result["scanned"],
                result["legacy_deleted"],
                result["missing_deleted"],
                result["source_exists"],
                result["protected"],
                result["uncertain"],
                result["remaining"],
            )
        return result

'''
              module = module.replace(method_marker, injected + method_marker, 1)

          old_apply = '''    def _apply_legacy_queue_migration_once(self) -> Dict[str, Any]:\n        marker = self.get_data(self._queue_guard_marker_key) or {}\n        if isinstance(marker, dict) and marker.get("applied"):\n            return marker\n        result = self._quarantine_legacy_pending()\n'''
          new_apply = '''    def _apply_legacy_queue_migration_once(self) -> Dict[str, Any]:\n        durable_cleanup = self._cleanup_stale_durable_pending_v3915()\n        marker = self.get_data(self._queue_guard_marker_key) or {}\n        if isinstance(marker, dict) and marker.get("applied"):\n            marker = dict(marker)\n            marker["v3915_stale_pending_cleanup"] = durable_cleanup\n            self.save_data(self._queue_guard_marker_key, marker)\n            return marker\n        result = self._quarantine_legacy_pending()\n'''
          if new_apply not in module:
              if old_apply not in module:
                  raise SystemExit('cannot locate migration method head')
              module = module.replace(old_apply, new_apply, 1)

          old_marker_tail = '''            "restart_required": bool(result.get("quarantined")),\n        }\n'''
          new_marker_tail = '''            "restart_required": bool(result.get("quarantined")),\n            "v3915_stale_pending_cleanup": durable_cleanup,\n        }\n'''
          if new_marker_tail not in module:
              if old_marker_tail not in module:
                  raise SystemExit('cannot locate migration marker tail')
              module = module.replace(old_marker_tail, new_marker_tail, 1)

          if 'from pathlib import Path\n' not in module:
              module = 'from pathlib import Path\n' + module

          sources[module_name] = module
          new_payload = json.dumps(sources, ensure_ascii=False, separators=(',', ':'))
          new_literal = json.dumps(new_payload, ensure_ascii=False)
          text = text[:match.start(2)] + new_literal + text[match.end(2):]
          text = text.replace('光鸭云盘助手 v3.9.14 单文件运行时。', '光鸭云盘助手 v3.9.15 单文件运行时。', 1)
          text = text.replace('v3.9.14 MoviePilot V3 SDK 运行态保障：', 'v3.9.15 MoviePilot V3 SDK 运行态保障：', 1)
          text = text.replace('ShukGuangYaDisk.plugin_version = "3.9.14"', 'ShukGuangYaDisk.plugin_version = "3.9.15"', 1)
          init_path.write_text(text, encoding='utf-8')

          package = json.loads(package_path.read_text(encoding='utf-8'))
          plugin = package['ShukGuangYaDisk']
          plugin['version'] = '3.9.15'
          history = plugin.get('history') or {}
          note = (
              '修复历史 TransferPending 反复 claim 但源文件已不存在的问题：旧兼容 discard 现在严格检查实际删除数；'
              '新增 durable admission 安全清理，在惰性监控启动后仅处理当前光鸭存储且位于监控根内的历史登记，先取得 canonical lease，'
              '再向光鸭远端复核源路径，确认不存在时通过 MoviePilot abandon_unstarted 删除，源仍存在、网络不确定、有效租约或已有执行证据一律保留并释放 claim；'
              '使用独立 v3.9.15 迁移标记，已执行过 v3.3/v3.4 旧迁移的安装也会重新检查。'
          )
          plugin['history'] = {'v3.9.15': note, **{k: v for k, v in history.items() if k != 'v3.9.15'}}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Static verification: top-level bundle and every embedded Python module must compile.
          compile(text, str(init_path), 'exec')
          for name, source in sources.items():
              compile(source, f'<single-init:{name}>', 'exec')
          assert '_cleanup_stale_durable_pending_v3915' in sources[module_name]
          assert 'abandon_unstarted' in sources[module_name]
          assert 'deleted = int(pending_oper.discard' in sources[module_name]
          assert package['ShukGuangYaDisk']['version'] == '3.9.15'
          print(f'verified {len(sources)} embedded modules; v3.9.15 patch ready')
          PY

          rm -f .github/workflows/patch-shukguangyadisk-v3915.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.v3/shukguangyadisk/__init__.py package.v3.json .github/workflows/patch-shukguangyadisk-v3915.yml
          git diff --cached --check
          git commit -m "fix(shukguangyadisk): clear stale durable pending tasks in v3.9.15"
          git push origin HEAD:main
