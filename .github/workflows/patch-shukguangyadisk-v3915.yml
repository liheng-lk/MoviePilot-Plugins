name: Patch ShukGuangYaDisk v3.9.15

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-shukguangyadisk-v3915.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify patch
        run: python .github/patch_shukguangyadisk_v3915.py
      - name: Commit v3.9.15
        run: |
          rm -f .github/workflows/patch-shukguangyadisk-v3915.yml
          rm -f .github/patch_shukguangyadisk_v3915.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.v3/shukguangyadisk/__init__.py package.v3.json .github
          git diff --cached --check
          git commit -m "fix(shukguangyadisk): clear stale durable pending tasks in v3.9.15"
          git push origin HEAD:main
