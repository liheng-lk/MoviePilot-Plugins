name: Prepare GuangYa v1.12.16

on:
  push:
    branches:
      - fix/guangya-v1.12.16-bilingual-identity
    paths:
      - .github/workflows/prepare-guangya-v11216.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.16-bilingual-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare public release metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plugin_dir = Path('plugins.v3/guangyatransferassistant')
          entry_path = plugin_dir / '__init__.py'
          entry = entry_path.read_text(encoding='utf-8')
          entry = entry.replace('"""光鸭转存助手 v1.12.15 运行入口。', '"""光鸭转存助手 v1.12.16 运行入口。', 1)
          anchor = 'v1.12.15 修复频道已有资源但未触发转存：'
          if anchor not in entry:
              raise SystemExit('v1.12.15 entry history anchor missing')
          history_line = ('v1.12.16 修复电影双语真实资源被身份门禁误杀：仅在观影 discovery 已命中订阅、真实分享顶层同时包含订阅标题与第二语言标题、年份精确一致且真实视频文件精确命中该第二语言标题时救回；错误电影、错误年份、纯外文无同分享桥接、电视剧仍硬拒绝，不引入模糊匹配。\n')
          if history_line not in entry:
              pos = entry.index(anchor)
              line_start = entry.rfind('\n', 0, pos) + 1
              entry = entry[:line_start] + history_line + entry[line_start:]
          marker = 'class GuangYaTransferAssistant('
          head, tail = entry.split(marker, 1)
          tail = tail.replace('plugin_version = "1.12.15"', 'plugin_version = "1.12.16"', 1)
          tail = tail.replace('build_id = "20260906-r62"', 'build_id = "20260906-r63"', 1)
          entry_path.write_text(head + marker + tail, encoding='utf-8')

          plugin_json_path = plugin_dir / 'plugin.json'
          plugin = json.loads(plugin_json_path.read_text(encoding='utf-8'))
          plugin['version'] = '1.12.16'
          plugin['description'] = (
              '更新日历驱动的固定分流助手：5 分钟频道 Push 被动消费并补偿复核 7 天频道缓存；当天应播 TV/动漫每 10 分钟快速追更；电影每 60 分钟复查。'
              'v1.12.16 修复电影双语真实资源身份误杀：仅当观影发现已命中订阅、同一真实迅雷分享顶层同时包含订阅标题与第二语言标题、年份精确一致，且真实视频文件精确命中该第二语言标题时允许救回；错误年份/错误电影/纯外文无桥接/TV 仍拒绝，不使用模糊匹配。'
              'v1.12.15 的频道缓存补偿与新增订阅先强刷配置频道、必要时有界历史回溯继续保留；v1.12.14 的 MoviePilot 权威缺集、真实 payload 身份和不可分割物理文件硬栅栏保持。'
              '来源优先级仍为观影迅雷秒传 > 光鸭直接转存 > Magnet > ED2K，Magnet/ED2K 使用光鸭原生 cloudcollection。'
          )
          plugin_json_path.write_text(json.dumps(plugin, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = Path('package.v3.json')
          package = package_path.read_text(encoding='utf-8')
          marker = '  "GuangYaTransferAssistant": {'
          before, section = package.split(marker, 1)
          section = section.replace('"version": "1.12.15"', '"version": "1.12.16"', 1)
          desc_old = '"description": "更新日历驱动的固定分流助手'
          if desc_old in section:
              start = section.index(desc_old)
              end = section.index('\n', start)
              new_desc = ('    "description": "更新日历驱动的固定分流助手：频道/观影统一支持光鸭分享、迅雷分享、Magnet、ED2K；v1.12.16 增加严格电影双语真实资源身份桥，仅在 discovery、同分享双语顶层、年份与真实视频第二语言标题形成闭环时救回，错误电影/年份/无桥接/TV 继续拒绝；v1.12.15 新订阅频道预热与历史回溯、v1.12.14 权威缺集和物理文件硬栅栏保持。来源优先级：观影迅雷秒传 > 光鸭直接转存 > Magnet > ED2K。",')
              section = section[:start] + new_desc.lstrip() + section[end:]
          hist_marker = '    "history": {\n'
          if hist_marker not in section:
              raise SystemExit('GuangYa package history marker missing')
          history = '      "v1.12.16": "修复《荣光与暗影》类电影双语真实资源被迅雷身份门禁误杀：仅在观影 discovery 已命中订阅、同一真实分享顶层同时包含订阅标题与第二语言标题、资源年份精确一致且真实视频文件精确命中第二语言标题时救回；PASS_CODE_ERROR/分享删除继续失败，错误电影/错误年份/纯外文无同分享桥接/TV 继续硬拒绝，不引入编辑距离、拼音或包含式模糊匹配；来源优先级与 v1.12.15 频道缓存、新订阅预热、v1.12.14 权威缺集/物理文件安全规则不变。",\n'
          if '"v1.12.16"' not in section.split(hist_marker, 1)[1][:400]:
              section = section.replace(hist_marker, hist_marker + history, 1)
          package_path.write_text(before + marker + section, encoding='utf-8')

          readme_path = plugin_dir / 'README.md'
          if readme_path.exists():
              readme = readme_path.read_text(encoding='utf-8')
              if '## v1.12.16' not in readme:
                  release_note = ('## v1.12.16 - 电影双语真实资源身份修复\n\n'
                      '- 修复同一电影在观影/迅雷中以“中文标题 + 第二语言标题”展示、实际视频使用第二语言标题时被误判为跨媒体的问题。\n'
                      '- 仅在 discovery 命中订阅、同一真实分享形成双语闭环、年份精确一致且真实视频精确命中第二语言标题时救回。\n'
                      '- 错误电影、错误年份、纯外文无同分享桥接、电视剧继续拒绝；不使用模糊标题匹配。\n'
                      '- 来源优先级与 v1.12.15 频道预热、v1.12.14 防重复/缺集硬栅栏保持不变。\n\n')
                  readme = release_note + readme
                  readme_path.write_text(readme, encoding='utf-8')
          PY
      - name: Migrate current-release contracts only
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('tests/test_guangya_channel_ed2k_v1112.py'),
              Path('tests/test_guangya_episode_fence_v1124.py'),
              Path('tests/test_guangya_media_identity_v1111.py'),
              Path('tests/test_guangya_release_v1110.py'),
              Path('tests/v3/shukguangyadisk/test_release_v370.py'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('1.12.15', '1.12.16')
              text = text.replace('20260906-r62', '20260906-r63')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: V3 plugin contract tests
        run: |
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: V3 dependency manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          for manifest in root.glob('plugins.v3/*/requirements.txt'):
              assert manifest.read_text(encoding='utf-8').strip(), manifest
          json.loads((root / 'package.v3.json').read_text(encoding='utf-8'))
          PY
      - name: JSON indexes
        run: |
          python -m json.tool package.v3.json >/dev/null
          python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Cleanup test artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: No generated Python artifacts
        run: |
          test -z "$(find . -type d -name '__pycache__' -print -quit)"
          test -z "$(find . -type f -name '*.pyc' -print -quit)"
      - name: Commit only if every gate passed
        run: |
          rm -f .github/workflows/prepare-guangya-v11216.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v3/guangyatransferassistant/__init__.py plugins.v3/guangyatransferassistant/plugin.json plugins.v3/guangyatransferassistant/README.md package.v3.json tests/test_guangya_channel_ed2k_v1112.py tests/test_guangya_episode_fence_v1124.py tests/test_guangya_media_identity_v1111.py tests/test_guangya_release_v1110.py tests/v3/shukguangyadisk/test_release_v370.py .github/workflows/prepare-guangya-v11216.yml
          git diff --cached --quiet && exit 0
          git commit -m 'release(guangya): promote v1.12.16 bilingual identity fix'
          git push origin HEAD:fix/guangya-v1.12.16-bilingual-identity
