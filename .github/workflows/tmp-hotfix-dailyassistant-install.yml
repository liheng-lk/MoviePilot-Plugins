name: Hotfix DailyAssistant install loader

on:
  push:
    branches: [hotfix/dailyassistant-install-v111]
    paths: [.github/workflows/tmp-hotfix-dailyassistant-install.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/dailyassistant-install-v111
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix MoviePilot loader class discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          entry = Path('plugins.v3/dailyassistant/__init__.py')
          text = entry.read_text(encoding='utf-8')
          old = '''class DailyAssistant(DailyAssistantV110Mixin, DailyAssistantV100):\n    """v1.1.0 最终运行类。"""\n\n    plugin_version = "1.1.0"\n\n\n__all__ = ["DailyAssistant"]\n'''
          new = '''class DailyAssistant(DailyAssistantV110Mixin, DailyAssistantV100):\n    """v1.1.1 最终运行类。"""\n\n    plugin_version = "1.1.1"\n\n\n# MoviePilot PluginLoader 按模块 globals 插入顺序寻找第一个 _PluginBase 子类。\n# v1.1.0 暴露了 DailyAssistantV100，导致宿主先加载旧基类而不是 DailyAssistant。\n# 最终类创建完成后删除旧公开符号，只保留正式插件类供 Loader 发现。\ndel DailyAssistantV100\n\n__all__ = ["DailyAssistant"]\n'''
          if old not in text:
              raise SystemExit('DailyAssistant final class block not found')
          entry.write_text(text.replace(old, new), encoding='utf-8')

          package_path = Path('package.v3.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          item = package['DailyAssistant']
          item['version'] = '1.1.1'
          item['description'] = '全媒体榜单发现助手：修复 MoviePilot V3 插件类发现导致安装失败；保留多榜单合并、48小时故障缓存、GYSub 落库对账与光鸭固定转存路线。'
          history = item.setdefault('history', {})
          item['history'] = {
              'v1.1.1': '修复安装失败：MoviePilot PluginLoader 会按模块符号顺序加载首个插件基类，v1.1.0 暴露 DailyAssistantV100 导致误加载旧类；现在只向宿主暴露最终 DailyAssistant 插件类。',
              **history,
          }
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = Path('plugins.v3/dailyassistant/README.md')
          rt = readme.read_text(encoding='utf-8')
          if '## v1.1.1：修复 MoviePilot 安装失败' not in rt:
              rt = '# 每日助手\n\n## v1.1.1：修复 MoviePilot 安装失败\n\n- 修复 v1.1.0 同时向 MoviePilot 暴露 `DailyAssistantV100` 与最终 `DailyAssistant` 两个插件类，宿主 Loader 按模块顺序误选旧基类的问题。\n- 最终运行时只暴露 `DailyAssistant`，版本与插件市场索引统一为 v1.1.1。\n\n' + rt.removeprefix('# 每日助手\n\n')
              readme.write_text(rt, encoding='utf-8')

          test = Path('tests/test_dailyassistant_loader_v111.py')
          test.write_text('''import json\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nENTRY = (ROOT / "plugins.v3/dailyassistant/__init__.py").read_text(encoding="utf-8")\nPACKAGE = json.loads((ROOT / "package.v3.json").read_text(encoding="utf-8"))\n\n\ndef test_dailyassistant_exposes_only_final_loader_candidate():\n    final_pos = ENTRY.index("class DailyAssistant(DailyAssistantV110Mixin, DailyAssistantV100):")\n    delete_pos = ENTRY.index("del DailyAssistantV100")\n    export_pos = ENTRY.index("__all__ = [\\\"DailyAssistant\\\"]")\n    assert final_pos < delete_pos < export_pos\n    assert "plugin_version = \\\"1.1.1\\\"" in ENTRY[final_pos:export_pos]\n\n\ndef test_dailyassistant_market_version_is_v111():\n    assert PACKAGE["DailyAssistant"]["version"] == "1.1.1"\n    assert "v1.1.1" in PACKAGE["DailyAssistant"]["history"]\n''', encoding='utf-8')
          PY
      - name: Validate hotfix
        run: |
          python -m compileall -q plugins.v3/dailyassistant
          python -m unittest discover -s tests -v
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python -c "import json; json.load(open('package.v3.json', encoding='utf-8'))"
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v3/dailyassistant package.v3.json tests/test_dailyassistant_loader_v111.py
          git diff --cached --check
          git commit -m "fix: make DailyAssistant installable on MoviePilot V3"
          git push origin HEAD:hotfix/dailyassistant-install-v111
