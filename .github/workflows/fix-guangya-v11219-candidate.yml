name: Fix GuangYa v1.12.19 candidate
on:
  push:
    branches: [fix/guangya-v1.12.19-persistent-empty-dir-lease]
    paths: [.github/workflows/fix-guangya-v11219-candidate.yml]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.19-persistent-empty-dir-lease
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic candidate fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          prod = Path('plugins.v3/guangyatransferassistant/empty_dir_lease_v11219.py')
          text = prod.read_text(encoding='utf-8')
          old = 'grace = int(self._empty_dir_lease_grace_v11219 or 120)'
          new = 'grace = max(0, int(getattr(self, "_empty_dir_lease_grace_v11219", 120)))'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = 'grace = int(self._empty_dir_share_grace_v11219 or 300)'
          new = 'grace = max(0, int(getattr(self, "_empty_dir_share_grace_v11219", 300)))'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''            record = self._mark_terminal_v11219(str(key), record)\n            if now - float(record.get("terminal_seen_at") or now) < grace:\n                continue'''
          new = '''            record = self._mark_terminal_v11219(str(key), record)\n            terminal_seen_at = float(record.get("terminal_seen_at") or 0)\n            terminal_age = max(0.0, time.time() - terminal_seen_at)\n            if grace > 0 and terminal_age < grace:\n                continue'''
          assert old in text
          text = text.replace(old, new, 1)
          prod.write_text(text, encoding='utf-8')

          # 历史结构合同：验证新增 lease 包住旧 guard，而不是假设 movie identity 直接继承 guard。
          paths = [
              'tests/v3/guangyatransferassistant/test_channel_prime_refresh_v11215.py',
              'tests/v3/guangyatransferassistant/test_manual_check_v11211.py',
              'tests/v3/guangyatransferassistant/test_movie_bilingual_identity_v11216.py',
              'tests/v3/guangyatransferassistant/test_xunlei_season_fence_v11210.py',
          ]
          for raw in paths:
              path = Path(raw)
              body = path.read_text(encoding='utf-8')
              assert 'GuangYaEmptyDirGuardV11218Mixin,' in body
              body = body.replace('GuangYaEmptyDirGuardV11218Mixin,', 'GuangYaEmptyDirLeaseV11219Mixin,')
              path.write_text(body, encoding='utf-8')

          path = Path('tests/v3/guangyatransferassistant/test_movie_identity_v1129.py')
          body = path.read_text(encoding='utf-8')
          assert '"GuangYaEmptyDirGuardV11218Mixin": type("_EmptyDirGuardBase", (), {}),' in body
          body = body.replace(
              '"GuangYaEmptyDirGuardV11218Mixin": type("_EmptyDirGuardBase", (), {}),',
              '"GuangYaEmptyDirLeaseV11219Mixin": type("_EmptyDirLeaseBase", (), {}),',
              1,
          )
          assert 'assert "GuangYaEmptyDirGuardV11218Mixin," in text' in body
          body = body.replace(
              'assert "GuangYaEmptyDirGuardV11218Mixin," in text',
              'assert "GuangYaEmptyDirLeaseV11219Mixin," in text',
              1,
          )
          path.write_text(body, encoding='utf-8')

          path = Path('tests/v3/guangyatransferassistant/test_empty_dir_guard_v11218.py')
          body = path.read_text(encoding='utf-8')
          old = '''    assert "from .empty_dir_guard_v11218 import GuangYaEmptyDirGuardV11218Mixin" in text\n    assert "GuangYaMovieBilingualIdentityV11216Mixin," in text\n    assert "GuangYaEmptyDirGuardV11218Mixin," in text\n    assert 'plugin_version = "1.12.18"' in SOURCE.read_text(encoding="utf-8")'''
          new = '''    lease = (PLUGIN / "empty_dir_lease_v11219.py").read_text(encoding="utf-8")\n    assert "from .empty_dir_lease_v11219 import GuangYaEmptyDirLeaseV11219Mixin" in text\n    assert "GuangYaMovieBilingualIdentityV11216Mixin," in text\n    assert "GuangYaEmptyDirLeaseV11219Mixin," in text\n    assert "class GuangYaEmptyDirLeaseV11219Mixin(GuangYaEmptyDirGuardV11218Mixin):" in lease\n    assert "from .empty_dir_guard_v11218 import GuangYaEmptyDirGuardV11218Mixin" in lease\n    assert 'plugin_version = "1.12.18"' in SOURCE.read_text(encoding="utf-8")'''
          assert old in body
          body = body.replace(old, new, 1)
          path.write_text(body, encoding='utf-8')
          PY
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Root unit tests
        run: python -m unittest discover -s tests -v
      - name: GuangYa full contracts
        run: python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Commit only green candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins.v3/guangyatransferassistant/empty_dir_lease_v11219.py tests/v3/guangyatransferassistant
          git diff --cached --quiet && exit 0
          git commit -m 'fix(guangya): validate persistent empty-dir lease behavior'
          git push origin HEAD:fix/guangya-v1.12.19-persistent-empty-dir-lease
