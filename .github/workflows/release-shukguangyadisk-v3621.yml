name: Release ShukGuangYaDisk v3.6.21

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-shukguangyadisk-v3621
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify v3.6.21 regression code
        run: |
          test -f plugins.v3/shukguangyadisk/organizer_admission_conflict_probe_v3621.py
          grep -q 'install_admission_conflict_probe_v3621()' plugins.v3/shukguangyadisk/organizer_execution_v360.py
          grep -q 'test_real_datang_two_conflicts_hidden_by_generic_message_become_blocked_not_retry' tests/v3/shukguangyadisk/test_admission_conflict_probe_v3621.py
          grep -q 'previous_fallback = monitor_cls._fallback_terminal_state' plugins.v3/shukguangyadisk/organizer_admission_conflict_probe_v3621.py

      - name: Materialize v3.6.21 release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old = "3.6.20"
          new = "3.6.21"
          history_text = (
              "修复 MoviePilot 内部 TransferAdmissionConflictError 在同步整理 workflow 中已记录完整异常、"
              "但公开返回被统一泛化为“整理任务处理失败，请稍后重试”后，v3.6.11 无法从 message 识别"
              "准入冲突并误把成员写入普通 retry 的问题：在宿主 TransactionalTransferAdmissionRepository.admit "
              "异常边界只读记录精确 storage+src_path+冲突事实并原样 re-raise；每个光鸭私有 Worker 使用线程本地"
              "隔离探针，最终 fallback 即使收到通用失败也能只将真实冲突成员写入 v3.6.11 persistent blocked，"
              "同批其它普通失败继续按原语义 retry。探针必须晚于 v3.6.11 安装并包住 MRO 最前的 monitor fallback；"
              "其它存储/路径和普通异常零副作用，不修改 MoviePilot planning/admission/durable 数据、媒体业务或文件操作。"
          )

          plugin_path = Path("plugins.v3/shukguangyadisk/plugin.json")
          plugin = json.loads(plugin_path.read_text(encoding="utf-8"))
          assert plugin["version"] == old, ("unexpected plugin version", plugin["version"])
          plugin["version"] = new
          plugin["history"] = {f"v{new}": history_text, **dict(plugin.get("history") or {})}
          plugin_path.write_text(json.dumps(plugin, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          package_path = Path("package.v3.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          shuk = package["ShukGuangYaDisk"]
          assert shuk["version"] == old, ("unexpected market version", shuk["version"])
          shuk["version"] = new
          shuk["history"] = {f"v{new}": history_text, **dict(shuk.get("history") or {})}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          entry_path = Path("plugins.v3/shukguangyadisk/__init__.py")
          entry = entry_path.read_text(encoding="utf-8")
          needle = f'plugin_version = "{old}"'
          assert entry.count(needle) == 1, "unexpected __init__.py version marker"
          entry_path.write_text(entry.replace(needle, f'plugin_version = "{new}"', 1), encoding="utf-8")

          remote_path = Path("plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js")
          remote = remote_path.read_text(encoding="utf-8")
          needle = f"?v={old}"
          assert remote.count(needle) == 1, "unexpected remoteEntry version marker"
          remote_path.write_text(remote.replace(needle, f"?v={new}", 1), encoding="utf-8")
          PY

      - name: Validate transformed v3.6.21 tree
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          python - <<'PY'
          from pathlib import Path
          import json
          version = "3.6.21"
          plugin = json.loads(Path("plugins.v3/shukguangyadisk/plugin.json").read_text(encoding="utf-8"))
          package = json.loads(Path("package.v3.json").read_text(encoding="utf-8"))["ShukGuangYaDisk"]
          entry = Path("plugins.v3/shukguangyadisk/__init__.py").read_text(encoding="utf-8")
          remote = Path("plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js").read_text(encoding="utf-8")
          assert plugin["version"] == package["version"] == version
          assert f'plugin_version = "{version}"' in entry
          assert f'?v={version}' in remote
          assert f"v{version}" in plugin["history"] and f"v{version}" in package["history"]
          PY
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"

      - name: Commit guarded release and self-delete
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -f .github/workflows/release-shukguangyadisk-v3621.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.v3.json \
            plugins.v3/shukguangyadisk/plugin.json \
            plugins.v3/shukguangyadisk/__init__.py \
            plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js \
            .github/workflows/release-shukguangyadisk-v3621.yml
          git commit -m "release(shukguangyadisk): v3.6.21 exact admission conflict probe"
          git pull --rebase origin main
          python -m compileall -q plugins.v3/shukguangyadisk
          find plugins.v3/shukguangyadisk -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3/shukguangyadisk -type f -name '*.pyc' -delete
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          git push origin HEAD:main
