name: Patch DailyNewDrama v1.3.5 media identity fix
on:
  push:
    branches: [dailynewdrama-v1.3.5-media-identity-fix]
    paths: [.github/workflows/patch-dailynewdrama-v135.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-v1.3.5-media-identity-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('plugins.v2/dailynewdrama/__init__.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from app.schemas.types import EventType', 'from app.schemas.types import EventType, MediaSource', 1)
          s=s.replace('plugin_version = "1.3.4"', 'plugin_version = "1.3.5"', 1)
          s=s.replace('self.chain.recognize_media(meta=meta, tmdbid=tmdbinfo.get("id"))', 'self.chain.recognize_media(meta=meta, mtype=MediaType.TV, media_source=MediaSource.TMDB, media_id=str(tmdbinfo.get("id")))')
          s=s.replace('self.chain.recognize_media(meta=meta, doubanid=doubanid)', 'self.chain.recognize_media(meta=meta, mtype=MediaType.TV, media_source=MediaSource.Douban, media_id=str(doubanid))')
          s=s.replace('self.chain.recognize_media(meta=meta, tmdbid=item.get("tmdbid"))', 'self.chain.recognize_media(meta=meta, mtype=MediaType.TV, media_source=MediaSource.TMDB, media_id=str(item.get("tmdbid")))')
          p.write_text(s,encoding='utf-8')
          history='适配新版 MoviePilot ChainBase.recognize_media 媒体身份参数：tmdbid/doubanid 改为 media_source + media_id，修复页面订阅进入业务链后报 unexpected keyword argument tmdbid'
          for name in ['package.v2.json','plugin.json']:
              path=Path(name); data=json.loads(path.read_text(encoding='utf-8')); item=data['DailyNewDrama']; item['version']='1.3.5'; item['history']={'v1.3.5':history,**(item.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          path=Path('plugins.v2/dailynewdrama/plugin.json'); data=json.loads(path.read_text(encoding='utf-8')); data['version']='1.3.5'; data['history']={'v1.3.5':history,**(data.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for tp in Path('tests').glob('test_dailynewdrama*.py'):
              ts=tp.read_text(encoding='utf-8').replace('"1.3.4"','"1.3.5"').replace("'1.3.4'","'1.3.5'")
              tp.write_text(ts,encoding='utf-8')
          Path('tests/test_dailynewdrama_v135_media_identity.py').write_text('''from pathlib import Path\nimport json\nROOT=Path(__file__).resolve().parents[1]\ntext=(ROOT/'plugins.v2/dailynewdrama/__init__.py').read_text(encoding='utf-8')\nassert 'from app.schemas.types import EventType, MediaSource' in text\nassert 'plugin_version = "1.3.5"' in text\nassert 'recognize_media(meta=meta, tmdbid=' not in text\nassert 'recognize_media(meta=meta, doubanid=' not in text\nassert 'media_source=MediaSource.TMDB, media_id=str(item.get("tmdbid"))' in text\nassert 'media_source=MediaSource.TMDB, media_id=str(tmdbinfo.get("id"))' in text\nassert 'media_source=MediaSource.Douban, media_id=str(doubanid)' in text\nassert json.loads((ROOT/'package.v2.json').read_text())['DailyNewDrama']['version']=='1.3.5'\nassert json.loads((ROOT/'plugin.json').read_text())['DailyNewDrama']['version']=='1.3.5'\nassert json.loads((ROOT/'plugins.v2/dailynewdrama/plugin.json').read_text())['version']=='1.3.5'\n''',encoding='utf-8')
          PY
          python -m compileall -q plugins.v2/dailynewdrama
          python -m unittest discover -s tests -p 'test_dailynewdrama*.py' -v
          python tests/test_dailynewdrama_v134_get_auth.py
          python tests/test_dailynewdrama_v135_media_identity.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v2/dailynewdrama/__init__.py plugins.v2/dailynewdrama/plugin.json package.v2.json plugin.json tests/test_dailynewdrama*.py
          git commit -m 'fix: DailyNewDrama v1.3.5 adapt recognize_media identity API'
          git push origin HEAD:dailynewdrama-v1.3.5-media-identity-fix
