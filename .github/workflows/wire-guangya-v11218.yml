name: Wire GuangYa v1.12.18
on:
  push:
    branches: [feat/guangya-v1.12.18-candidate-ranking]
    paths:
      - '.github/workflows/wire-guangya-v11218.yml'
      - 'scripts/_wire_guangya_v11218.py'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guangya-v1.12.18-candidate-ranking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.12.18 wiring
        run: python scripts/_wire_guangya_v11218.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Root unit tests
        run: python -m unittest discover -s tests -v
      - name: GuangYa V3 contracts
        run: python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Dependency and JSON gates
        run: |
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"
          python - <<'PY'
          from pathlib import Path
          import json, tomllib
          for path in Path('plugins.v3').glob('*/pyproject.toml'):
              with path.open('rb') as f:
                  project = tomllib.load(f)['project']
              assert project.get('dynamic') == ['version'], path
              assert project.get('requires-python') == '>=3.12', path
          for p in ['plugin.json','package.v2.json','package.v3.json']:
              json.load(open(p, encoding='utf-8'))
          PY
      - name: Cleanup one-shot tooling
        run: |
          rm -f scripts/_wire_guangya_v11218.py .github/workflows/wire-guangya-v11218.yml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit validated candidate only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(guangya): wire v1.12.18 candidate ranking'
          git push origin HEAD:feat/guangya-v1.12.18-candidate-ranking
