name: One-shot post-final validate GuangYaTransferAssistant v1.10.0

on:
  push:
    branches:
      - feature/guangyatransferassistant-v1100-ui-runtime

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guangyatransferassistant-v1100-ui-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused behavioral and UI contracts
        run: |
          python -m pip install -q pytest
          python -m compileall -q plugins.v3/guangyatransferassistant
          python -m pytest tests/v3/guangyatransferassistant -q
          python -m unittest tests.v3.guangyatransferassistant.test_v1100_functional_dryrun -v
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Official repository validation
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
          python -m unittest discover -s tests -v
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"
          python - <<'PY'
          from pathlib import Path
          import tomllib
          for path in Path('plugins.v3').glob('*/pyproject.toml'):
              with path.open('rb') as f:
                  project = tomllib.load(f)['project']
              assert project.get('dynamic') == ['version'], path
              assert project.get('requires-python') == '>=3.12', path
          shuk = Path('plugins.v3/shukguangyadisk')
          assert not (shuk / 'pyproject.toml').exists()
          assert not (shuk / 'requirements.txt').exists()
          PY
          python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['plugin.json','package.v2.json','package.v3.json']]"
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test -z "$(find . -type f -name '*.pyc' -o -type d -name '__pycache__')"
      - name: Remove one-shot validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-v1100-post-final-validation.yml
          git commit -m "chore: remove v1.10.0 post-final validation workflow"
          git push origin HEAD:feature/guangyatransferassistant-v1100-ui-runtime
