name: One-shot GuangYaTransferAssistant v1.9.6 subscribe contract compatibility
on:
  push:
    branches: [fix/guangyatransferassistant-subscribe-contract-v196]
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangyatransferassistant-subscribe-contract-v196
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply MoviePilot subscribe contract compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          plugin = root / 'plugins.v3' / 'guangyatransferassistant'
          legacy = plugin / 'legacy.py'
          text = legacy.read_text(encoding='utf-8')
          old = 'from app.chain.subscribe import SubscribeChain, build_subscribe_meta\n'
          new = '''from app.chain.subscribe import SubscribeChain\n\ntry:\n    # MoviePilot V3 当前订阅合同：build_subscribe_meta 已从 Chain 根入口迁移到 application contract。\n    from app.application.subscription.contract import build_subscribe_meta\nexcept ImportError:  # 兼容仍从 app.chain.subscribe 导出的早期 V3 小版本\n    from app.chain.subscribe import build_subscribe_meta\n'''
          if old not in text:
              raise SystemExit('legacy subscribe import not found')
          legacy.write_text(text.replace(old, new, 1), encoding='utf-8')

          entry = plugin / '__init__.py'
          entry_text = entry.read_text(encoding='utf-8')
          entry_text = entry_text.replace('光鸭转存助手 v1.9.5 运行入口。', '光鸭转存助手 v1.9.6 运行入口。', 1)
          entry_text = entry_text.replace('v1.9.5 迁移 PluginManager 到 MoviePilot V3 稳定 SDK。', 'v1.9.5 迁移 PluginManager 到 MoviePilot V3 稳定 SDK；v1.9.6 兼容 MoviePilot 最新订阅合同拆分，修复安装期 build_subscribe_meta 导入失败。', 1)
          entry_text = entry_text.replace('plugin_version = "1.9.5"', 'plugin_version = "1.9.6"', 1)
          entry_text = entry_text.replace('build_id = "20260901-r9"', 'build_id = "20260901-r10"', 1)
          entry.write_text(entry_text, encoding='utf-8')

          history = (
              '兼容 MoviePilot 最新订阅架构拆分：SubscribeChain 继续使用 app.chain.subscribe 稳定入口，'
              'build_subscribe_meta 改从 app.application.subscription.contract 导入，并保留早期 V3 的旧入口回退；'
              '修复新版 MoviePilot 中 app.chain.subscribe 仅导出 SubscribeChain 时导致的插件安装/加载失败。'
          )

          local_path = plugin / 'plugin.json'
          local = json.loads(local_path.read_text(encoding='utf-8'))
          local['version'] = '1.9.6'
          local_path.write_text(json.dumps(local, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = root / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          meta = package['GuangYaTransferAssistant']
          meta['version'] = '1.9.6'
          meta['history'] = {'v1.9.6': history, **dict(meta.get('history') or {})}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          tests = root / 'tests' / 'v3' / 'guangyatransferassistant'
          for path in tests.glob('test_*.py'):
              body = path.read_text(encoding='utf-8')
              if '1.9.5' in body or '20260901-r9' in body:
                  path.write_text(body.replace('1.9.5', '1.9.6').replace('20260901-r9', '20260901-r10'), encoding='utf-8')

          compat = tests / 'test_subscribe_contract_v196.py'
          compat.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[3]\nPLUGIN = ROOT / "plugins.v3" / "guangyatransferassistant"\nLEGACY = (PLUGIN / "legacy.py").read_text(encoding="utf-8")\nENTRY = (PLUGIN / "__init__.py").read_text(encoding="utf-8")\n\n\ndef test_v196_uses_current_moviepilot_subscribe_contract():\n    assert "from app.chain.subscribe import SubscribeChain" in LEGACY\n    assert "from app.application.subscription.contract import build_subscribe_meta" in LEGACY\n    assert "from app.chain.subscribe import SubscribeChain, build_subscribe_meta" not in LEGACY\n\n\ndef test_v196_keeps_early_v3_fallback():\n    assert "except ImportError" in LEGACY\n    assert "from app.chain.subscribe import build_subscribe_meta" in LEGACY\n\n\ndef test_v196_release_marker():\n    assert 'plugin_version = "1.9.6"' in ENTRY\n    assert 'build_id = "20260901-r10"' in ENTRY\n''', encoding='utf-8')

          readme = plugin / 'README.md'
          readme_text = readme.read_text(encoding='utf-8')
          marker = '\n## v1.9.5：MoviePilot V3 插件管理 SDK 兼容\n'
          section = '''\n## v1.9.6：MoviePilot 最新订阅合同兼容\n\n- `SubscribeChain` 继续走 `app.chain.subscribe` 稳定公开入口。\n- `build_subscribe_meta` 按 MoviePilot 最新 V3 架构改从 `app.application.subscription.contract` 导入；早期 V3 保留兼容回退。\n- 修复新版 MoviePilot 的 `app.chain.subscribe` 只公开 `SubscribeChain` 后，转存助手在安装/加载阶段直接 `ImportError` 的问题。\n- 本次仍只修改光鸭转存助手，不修改光鸭云盘助手。\n'''
          if section not in readme_text:
              if marker in readme_text:
                  readme_text = readme_text.replace(marker, section + marker, 1)
              else:
                  readme_text = section + readme_text
          readme.write_text(readme_text, encoding='utf-8')
          PY
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant
          find plugins.v3/guangyatransferassistant -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3/guangyatransferassistant -type f -name '*.pyc' -delete
      - name: GuangYaTransferAssistant contracts
        run: |
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Repository validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          package = json.loads((root/'package.v3.json').read_text(encoding='utf-8'))['GuangYaTransferAssistant']
          local = json.loads((root/'plugins.v3/guangyatransferassistant/plugin.json').read_text(encoding='utf-8'))
          entry = (root/'plugins.v3/guangyatransferassistant/__init__.py').read_text(encoding='utf-8')
          legacy = (root/'plugins.v3/guangyatransferassistant/legacy.py').read_text(encoding='utf-8')
          assert package['version'] == local['version'] == '1.9.6'
          assert 'v1.9.6' in package['history']
          assert 'plugin_version = "1.9.6"' in entry
          assert 'build_id = "20260901-r10"' in entry
          assert 'from app.application.subscription.contract import build_subscribe_meta' in legacy
          assert 'from app.chain.subscribe import SubscribeChain, build_subscribe_meta' not in legacy
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-guangya-transfer-v196.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: adapt GuangYaTransferAssistant to MoviePilot subscribe contract'
          git push origin HEAD:fix/guangyatransferassistant-subscribe-contract-v196
