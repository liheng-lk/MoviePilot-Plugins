name: Patch DailyNewDrama FlareSolverr

on:
  push:
    branches: [dailynewdrama-flaresolverr]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-flaresolverr
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_dailynewdrama_flaresolverr.py
      - name: Validate
        run: |
          python -m compileall -q plugins.v2/dailynewdrama
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          for path in ['plugin.json', 'package.v2.json', 'plugins.v2/dailynewdrama/plugin.json']:
              json.load(open(path, encoding='utf-8'))
          print('JSON OK')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch_dailynewdrama_flaresolverr.py
          rm -f .github/workflows/patch-dailynewdrama-flaresolverr.yml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Douban direct and FlareSolverr fallback'
          git push origin HEAD:dailynewdrama-flaresolverr
