name: Rerun DailyNewDrama v1.3.4 GET auth fix
on:
  push:
    branches: [dailynewdrama-v1.3.4-get-auth-fix]
    paths: [.github/workflows/patch-dailynewdrama-v134-rerun.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-v1.3.4-get-auth-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p=Path('plugins.v2/dailynewdrama/__init__.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('plugin_version = "1.3.3"','plugin_version = "1.3.4"',1)
          # Change only subscribe API registration and subscribe page event.
          anchor='"path": "/subscribe"'
          pos=s.find(anchor)
          if pos < 0: raise SystemExit('subscribe route missing')
          route=s[pos:pos+350]
          route2=route.replace('"methods": ["POST"]','"methods": ["GET"]',1)
          if route==route2: raise SystemExit('subscribe route POST marker missing')
          s=s[:pos]+route2+s[pos+len(route):]
          api_anchor='"api": "plugin/DailyNewDrama/subscribe"'
          pos=s.find(api_anchor)
          if pos < 0: raise SystemExit('subscribe page api missing')
          start=max(0,pos-250); end=min(len(s),pos+700); block=s[start:end]
          block2=block.replace('"method": "post"','"method": "get"',1)
          if block==block2: raise SystemExit('page POST marker missing')
          s=s[:start]+block2+s[end:]
          s=s.replace('【每日新剧助手】【页面鉴权诊断】构建订阅按钮:', '【每日新剧助手】【页面鉴权诊断】构建GET订阅按钮:', 1)
          p.write_text(s,encoding='utf-8')

          history='修复 MoviePilot 页面订阅 POST 参数无法进入 API 鉴权层的问题，改为官方兼容的 GET + query apikey 调用'
          for name in ['package.v2.json','plugin.json']:
              path=Path(name); data=json.loads(path.read_text(encoding='utf-8')); item=data['DailyNewDrama']; item['version']='1.3.4'; item['history']={'v1.3.4':history,**(item.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          path=Path('plugins.v2/dailynewdrama/plugin.json'); data=json.loads(path.read_text(encoding='utf-8')); data['version']='1.3.4'; data['history']={'v1.3.4':history,**(data.get('history') or {})}; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Update version-only assertions in all dailynewdrama tests.
          for tp in Path('tests').glob('test_dailynewdrama*.py'):
              ts=tp.read_text(encoding='utf-8')
              for old in ['1.3.3','1.3.2','1.3.1']:
                  ts=ts.replace(f'"{old}"', '"1.3.4"').replace(f"'{old}'", "'1.3.4'")
              # Old API contract expected page POST; v1.3.4 deliberately uses GET so apikey is query-visible to host security.
              ts=ts.replace("assert '\"method\": \"post\"' in text", "assert '\"method\": \"get\"' in text")
              ts=ts.replace("assert '\"methods\": [\"POST\"]' in text", "assert '\"methods\": [\"GET\"]' in text")
              tp.write_text(ts,encoding='utf-8')

          Path('tests/test_dailynewdrama_v134_get_auth.py').write_text('''from pathlib import Path\nimport json\nROOT=Path(__file__).resolve().parents[1]\ntext=(ROOT/'plugins.v2/dailynewdrama/__init__.py').read_text(encoding='utf-8')\npos=text.index('"api": "plugin/DailyNewDrama/subscribe"')\nblock=text[max(0,pos-250):pos+650]\nassert '"method": "get"' in block\nassert '"apikey": settings.API_TOKEN' in block\npos2=text.index('"path": "/subscribe"')\nroute=text[pos2:pos2+350]\nassert '"methods": ["GET"]' in route\nassert 'plugin_version = "1.3.4"' in text\nassert '【每日新剧助手】【订阅API诊断】收到请求' in text\nassert json.loads((ROOT/'package.v2.json').read_text())['DailyNewDrama']['version']=='1.3.4'\nassert json.loads((ROOT/'plugin.json').read_text())['DailyNewDrama']['version']=='1.3.4'\nassert json.loads((ROOT/'plugins.v2/dailynewdrama/plugin.json').read_text())['version']=='1.3.4'\n''',encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m compileall -q plugins.v2/dailynewdrama
          python -m unittest discover -s tests -p 'test_dailynewdrama*.py' -v
          python tests/test_dailynewdrama_v134_get_auth.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v2/dailynewdrama/__init__.py plugins.v2/dailynewdrama/plugin.json package.v2.json plugin.json tests/test_dailynewdrama*.py
          git commit -m 'fix: DailyNewDrama v1.3.4 GET query auth for page subscribe'
          git push origin HEAD:dailynewdrama-v1.3.4-get-auth-fix
