name: Release ShukGuangYaDisk v3.6.15

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-shukguangyadisk-v3615.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump ShukGuangYaDisk to v3.6.15
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          old_version = '3.6.14'
          version = '3.6.15'
          history = (
              '修复真实等待 pending 仍会独占整个监控 tick、导致 known scan/continuous discovery 被长期饿死的问题：'
              'stabilizing/retry_wait/history_wait 等无活动执行等待态优先复查后，在同一 tick 继续既有 v3.6.9 known/discovery；'
              'scheduled、inflight/durable、目录/API失败与 worker_not_accept 仍保持单资源/故障阻断。'
              'retry 状态统计拆分 retry_total、未到期 retry_wait 与已到期 retry_due，并显示最大 attempts，'
              '避免将全部 retry 行误报为退避等待；不修改持久状态 schema、MoviePilot history/durable 判定或媒体业务规则。'
          )

          local_meta_path = plugin / 'plugin.json'
          local_meta = json.loads(local_meta_path.read_text(encoding='utf-8'))
          assert local_meta['version'] == old_version, local_meta['version']
          local_meta['version'] = version
          local_meta['history'] = {f'v{version}': history, **dict(local_meta.get('history') or {})}
          local_meta_path.write_text(json.dumps(local_meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = root / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          market = dict(package['ShukGuangYaDisk'])
          assert market['version'] == old_version, market['version']
          market['version'] = version
          market['history'] = {f'v{version}': history, **dict(market.get('history') or {})}
          package['ShukGuangYaDisk'] = market
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          entry_path = plugin / '__init__.py'
          entry = entry_path.read_text(encoding='utf-8')
          old = f'plugin_version = "{old_version}"'
          assert old in entry
          entry_path.write_text(entry.replace(old, f'plugin_version = "{version}"', 1), encoding='utf-8')

          remote_path = plugin / 'dist' / 'assets' / 'remoteEntry.js'
          remote = remote_path.read_text(encoding='utf-8')
          assert f'?v={old_version}' in remote
          remote_path.write_text(remote.replace(f'?v={old_version}', f'?v={version}'), encoding='utf-8')
          PY
      - name: Validate release contracts
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          plugin = root / 'plugins.v3' / 'shukguangyadisk'
          assert json.loads((plugin / 'plugin.json').read_text(encoding='utf-8'))['version'] == '3.6.15'
          assert json.loads((root / 'package.v3.json').read_text(encoding='utf-8'))['ShukGuangYaDisk']['version'] == '3.6.15'
          assert 'plugin_version = "3.6.15"' in (plugin / '__init__.py').read_text(encoding='utf-8')
          assert '?v=3.6.15' in (plugin / 'dist' / 'assets' / 'remoteEntry.js').read_text(encoding='utf-8')
          PY
      - name: Commit v3.6.15 release and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/release-shukguangyadisk-v3615.yml
          git add plugins.v3/shukguangyadisk/plugin.json \
                  plugins.v3/shukguangyadisk/__init__.py \
                  plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js \
                  package.v3.json
          git commit -m "release(shukguangyadisk): v3.6.15 pending fairness"
          git push origin main
