name: One-time Branch Cleanup v393

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-v393-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete v3.9.3 development branch
        run: |
          set -euo pipefail
          git push origin --delete "fix/shukguangyadisk-worker-handoff-v393" || true
