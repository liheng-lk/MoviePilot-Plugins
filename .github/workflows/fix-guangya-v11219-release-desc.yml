name: Fix GuangYa v1.12.19 Release Description
on:
  push:
    branches:
      - feat/guangya-v1.12.19-ranking-learning
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guangya-v1.12.19-ranking-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve prior safety contract in current description
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          desc = (
              "更新日历驱动的固定分流助手。v1.12.19 统一电影与剧集/动漫的高置信真实资源匹配：电影四来源均以真实 payload 视频和 MoviePilot/TMDB 可信标题证据为最终门禁；"
              "剧集拆分 requested/candidate/resolved/transfer episodes，未解析候选不再提前占缺集；Provider 在全局截断前排序并受进程级 4 并发预算约束，来源质量只学习真实可归因结果。"
              "同时完整保留 v1.12.18 空目录安全边界：待落盘验证继续使用 get_item 纯只读查询；失败且没有服务端 taskId 时才允许回收本次新建并再次确认仍为空的目录，已有/非空/事实未知/taskId/pending/root 均 fail-closed 保留。"
              "来源优先级仍为观影迅雷秒传 > 光鸭直接转存 > Magnet > ED2K。"
          )

          plugin_path = Path("plugins.v3/guangyatransferassistant/plugin.json")
          plugin = json.loads(plugin_path.read_text(encoding="utf-8"))
          plugin["description"] = desc
          plugin_path.write_text(json.dumps(plugin, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          package_path = Path("package.v3.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["GuangYaTransferAssistant"]["description"] = desc
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fix-guangya-v11219-release-desc.yml
      - name: Commit description compatibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(guangya): retain v1.12.18 safety contract in v1.12.19"
          git push origin HEAD:feat/guangya-v1.12.19-ranking-learning
