name: Finalize GuangYa 1.11 release docs

on:
  push:
    branches: [feature/daily-gysub-v1110]
    paths: [.github/workflows/tmp-release-v1110.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-gysub-v1110
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize release documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          entry = Path('plugins.v3/guangyatransferassistant/__init__.py')
          text = entry.read_text(encoding='utf-8')
          text = text.replace('"""光鸭转存助手 v1.10.24 运行入口。', '"""光鸭转存助手 v1.11.0 运行入口。', 1)
          marker = '同时增加跨来源集级终止栅栏：秒传/分享转存/Magnet/ED2K 共用已成功集与在途集，成功一集立即终止该集其它任务。'
          replacement = marker + '\n' + 'v1.11.0 在此终态栅栏之上加入 TMDB 更新日历、临近播出补漏和每天一次全员缺集复核，覆盖提前更新与漏检。'
          text = text.replace(marker, replacement, 1)
          entry.write_text(text, encoding='utf-8')

          readme = Path('plugins.v3/guangyatransferassistant/README.md')
          text = readme.read_text(encoding='utf-8')
          section = '''## v1.11.0：跨来源集级终止 + 更新日历 + 每日全员补漏

- 迅雷秒传、光鸭直接转存、Magnet 与 ED2K 统一使用同一套“成功集 + 在途集”栅栏；任一来源先真实获得某集，该集立即回写 MoviePilot 订阅进度并终止其它来源重复任务。
- 已在途的 Magnet/ED2K 若与新成功集部分重叠，会先取消旧 cloudcollection task，再只为剩余缺集重新解析/提交；旧 taskId 不再继续轮询。远端取消失败时本地永久停止该来源重试，优先避免重复入库。
- 光鸭直接转存提交前再次按已成功集裁剪；电影已有成功或在途正片时不再启动第二份电影资源。
- 使用 MoviePilot/TMDB `next_episode_to_air` 建立下一集更新日历；昨天、今天、明天播出的订阅每小时进入一次到期检查，单订阅至少间隔 2 小时，以覆盖提前放出和日期漂移。
- 每天 04:10 对全部固定路线订阅执行一次强制缺集复核，不依赖当天是否收到新频道消息；仍完整经过缺集、质量、在途 reservation 和集级终态门禁。
- Magnet/ED2K 始终使用光鸭原生云添加，不进入 MoviePilot 本地下载器。

'''
          if '## v1.11.0：跨来源集级终止 + 更新日历 + 每日全员补漏' not in text:
              text = text.replace('# 光鸭转存助手\n\n', '# 光鸭转存助手\n\n' + section, 1)
          readme.write_text(text, encoding='utf-8')

          daily = Path('plugins.v3/dailyassistant/README.md')
          text = daily.read_text(encoding='utf-8')
          section = '''## v1.1.0：多榜单合并、故障缓存与 GYSub 对账

- 同一媒体同时出现在多个榜单时合并为一个候选并保留全部来源，不再由“第一个榜单命中”覆盖其它来源的自动订阅资格。
- 每个榜单保留最近 48 小时成功缓存；实时来源短暂失败时页面仍可展示最近候选，但缓存候选绝不会触发新的自动 GYSub，避免旧榜单误订阅。
- GYSub 请求后每 5 分钟主动与 MoviePilot 实际订阅事实对账，从 `requested/pending` 转为 `confirmed` 不再依赖下一次整榜刷新。
- HBO 标签与当前产品分类对齐；腾讯少儿使用 TMDB Kids 类型 `10762`，不再误用 Family 类型。

'''
          if '## v1.1.0：多榜单合并、故障缓存与 GYSub 对账' not in text:
              text = text.replace('# 每日助手\n\n', '# 每日助手\n\n' + section, 1)
          text = text.replace('HBO/Max、Apple TV+', 'HBO、Apple TV+')
          daily.write_text(text, encoding='utf-8')
          PY
      - name: Validate docs-adjacent Python
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant plugins.v3/dailyassistant
          find plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3 -type f -name '*.pyc' -delete
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v3/guangyatransferassistant/__init__.py plugins.v3/guangyatransferassistant/README.md plugins.v3/dailyassistant/README.md
          git diff --cached --check
          git commit -m "docs: finalize GuangYa 1.11 and DailyAssistant 1.1" || exit 0
          git push origin HEAD:feature/daily-gysub-v1110
