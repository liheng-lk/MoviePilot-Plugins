name: Temporary GuangYa v1.4.0 Executor
on:
  pull_request:
    branches: [main]
    paths:
      - '.guangya-v140-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guangya-reliability-v1.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reliability patch
        run: |
          python tools/patch_guangya_v140.py
          python tools/fix_guangya_v140_tests.py
      - name: Validate generated plugin
        run: |
          python -m py_compile plugins.v3/guangyatransferassistant/__init__.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/v3/guangyatransferassistant/test_plugin_contract.py')
          tests = [(name, fn) for name, fn in ns.items() if name.startswith('test_') and callable(fn)]
          for name, fn in tests:
              fn()
              print(f'PASS {name}')
          print(f'{len(tests)} GuangYa contract tests passed')
          PY
          python -m json.tool package.v3.json >/dev/null
          python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Commit generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .guangya-v140-trigger tools/patch_guangya_v140.py tools/fix_guangya_v140_tests.py
          git add package.v3.json plugins.v3/guangyatransferassistant/__init__.py plugins.v3/guangyatransferassistant/plugin.json tests/v3/guangyatransferassistant/test_plugin_contract.py
          git commit -m 'feat: harden GuangYa transfer reliability v1.4.0'
          git push origin HEAD:feat/guangya-reliability-v1.4.0
