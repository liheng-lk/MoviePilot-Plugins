name: Plugin Release
on:
  push:
    branches:
      - main
    paths:
      - 'package.v3.json'
      - 'plugins.v3/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - name: Build and publish release=true plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pkg_file="package.v3.json"
          mapfile -t entries < <(jq -r 'to_entries | map(select(.value.release == true)) | .[] | "\(.key)|\(.value.version)"' "$pkg_file")
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "No plugins with release=true"
            exit 0
          fi

          # Phase 1: validate + build all assets BEFORE deleting any existing release.
          declare -a publish_rows=()
          for entry in "${entries[@]}"; do
            plugin_id="${entry%%|*}"
            plugin_version="${entry##*|}"
            plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"
            plugin_dir="plugins.v3/${plugin_id_lc}"
            if [ ! -d "$plugin_dir" ]; then
              echo "Missing plugin directory: $plugin_dir" >&2
              exit 1
            fi
            code_version="$(PLUGIN_DIR="$plugin_dir" python - <<'PY'
          from pathlib import Path
          import os, re
          text = Path(os.environ["PLUGIN_DIR"]).joinpath("__init__.py").read_text(encoding="utf-8")
          match = re.search(r'plugin_version\s*=\s*["\']([^"\']+)["\']', text)
          print(match.group(1) if match else "")
          PY
          )"
            if [ "$code_version" != "$plugin_version" ]; then
              echo "Version mismatch for $plugin_id: package=$plugin_version code=$code_version" >&2
              exit 1
            fi
            tag="${plugin_id}_v${plugin_version}"
            asset="${plugin_id_lc}_v${plugin_version}.zip"
            notes_file="${plugin_id_lc}_v${plugin_version}.notes.txt"
            jq -r --arg plugin_id "$plugin_id" --arg version "v$plugin_version" '.[$plugin_id].history[$version] // empty' "$pkg_file" > "$notes_file"
            if [ ! -s "$notes_file" ]; then
              printf 'Automated release of %s %s\n' "$plugin_id" "$plugin_version" > "$notes_file"
            fi
            rm -f "$asset"
            (
              cd plugins.v3
              zip -r "../$asset" "$plugin_id_lc" \
                -x '*/__pycache__/*' '*.pyc' '*/.DS_Store' '*/tests/*'
            )
            if [ ! -s "$asset" ]; then
              echo "Failed to build asset: $asset" >&2
              exit 1
            fi
            publish_rows+=("${plugin_id}|${plugin_version}|${tag}|${asset}|${notes_file}")
            echo "Built $asset ($(wc -c < "$asset") bytes)"
          done

          # Phase 2: publish only after every asset exists.
          for row in "${publish_rows[@]}"; do
            IFS='|' read -r plugin_id plugin_version tag asset notes_file <<<"$row"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes || true
              git push origin ":refs/tags/$tag" || true
            fi
            gh release create "$tag" "$asset" \
              --target "${GITHUB_SHA}" \
              --title "$plugin_id v$plugin_version" \
              --notes-file "$notes_file"
            echo "Published $tag with $asset at ${GITHUB_SHA}"
          done
