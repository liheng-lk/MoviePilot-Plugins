name: Validate GuangYa v1.12.12 alias query

on:
  push:
    branches:
      - fix/guangya-v1.12.12-gying-alias-query

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.12-gying-alias-query
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare nested candidate contracts
        run: python tools/_wire_gying_alias_v11212.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Root unit tests
        run: python -m unittest discover -s tests -v
      - name: GuangYa V3 contract tests
        run: python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Remove one-shot tooling
        run: |
          rm tools/_wire_gying_alias_v11212.py
          rm .github/workflows/validate-guangya-v11212-alias.yml
      - name: Commit validated candidate wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            plugins.v3/guangyatransferassistant/gying_alias_query_v11212.py \
            plugins.v3/guangyatransferassistant/manual_check_v11211.py \
            plugins.v3/guangyatransferassistant/movie_identity_v1129.py \
            tests/v3/guangyatransferassistant/test_gying_alias_query_v11212.py \
            tests/v3/guangyatransferassistant/test_manual_check_v11211.py \
            tests/v3/guangyatransferassistant/test_xunlei_season_fence_v11210.py \
            tools/_wire_gying_alias_v11212.py \
            .github/workflows/validate-guangya-v11212-alias.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(guangya): finalize nested v1.12.12 alias-query candidate'
          git push origin HEAD:fix/guangya-v1.12.12-gying-alias-query
