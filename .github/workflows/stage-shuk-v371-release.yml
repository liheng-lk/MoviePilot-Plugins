name: Stage ShukGuangYaDisk v3.7.1 release
on:
  push:
    branches: [refactor/shukguangya-organizer-core-v371]
permissions:
  contents: write
jobs:
  stage-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shukguangya-organizer-core-v371
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage v3.7.1 metadata
        run: python .github/scripts/stage_shuk_v371_release.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v3/shukguangyadisk
          find plugins.v3/shukguangyadisk -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v3/shukguangyadisk -type f -name '*.pyc' -delete
      - name: Full Shuk tests and contracts
        run: |
          python -m unittest discover -s tests/v3/shukguangyadisk -p 'test_*.py' -v
          python tests/v3/shukguangyadisk/run_contract_tests.py
      - name: Repository regression
        run: |
          python -m unittest discover -s tests -v
          python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Validate manifests and cross-plugin isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('package.v3.json').read_text(encoding='utf-8'))
          plugin = json.loads(Path('plugins.v3/shukguangyadisk/plugin.json').read_text(encoding='utf-8'))
          init = Path('plugins.v3/shukguangyadisk/__init__.py').read_text(encoding='utf-8')
          remote = Path('plugins.v3/shukguangyadisk/dist/assets/remoteEntry.js').read_text(encoding='utf-8')
          assert plugin['version'] == '3.7.1'
          assert package['ShukGuangYaDisk']['version'] == '3.7.1'
          assert 'plugin_version = "3.7.1"' in init
          assert '?v=3.7.1' in remote
          assert package['GuangYaTransferAssistant']['version'] == '1.12.14'
          PY
      - name: Commit release staging and remove one-time tooling
        run: |
          rm -f .github/scripts/stage_shuk_v371_release.py
          rm -f .github/workflows/stage-shuk-v371-release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'release(shukguangyadisk): stage v3.7.1 explicit policy core' || exit 0
          git push origin HEAD:refactor/shukguangya-organizer-core-v371
