name: Validate GYSub airing UI v1.12.0 once

on:
  push:
    branches:
      - feature/gysub-airing-calendar-v1120
    paths:
      - .github/workflows/feature-gysub-airing-ui-v1120-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gysub-airing-calendar-v1120
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install -q pytest

      - name: Apply UI integration
        run: python tools/apply_airing_ui_v1120.py

      - name: Compile changed modules
        run: |
          python -m py_compile \
            plugins.v3/guangyatransferassistant/__init__.py \
            plugins.v3/guangyatransferassistant/airing_scheduler_v1120.py \
            plugins.v3/guangyatransferassistant/airing_ui_v1120.py \
            plugins.v3/dailyassistant/airing_calendar_v120.py

      - name: Run focused and compatibility regressions
        run: |
          python -m pytest \
            tests/test_dailyassistant_calendar_v120.py \
            tests/test_dailyassistant_loader_v111.py \
            tests/test_dailyassistant_service_v112.py \
            tests/test_guangya_release_v1110.py \
            tests/test_guangya_episode_fence_v1124.py \
            tests/test_guangya_receipt_completion_v1124.py \
            tests/v3/guangyatransferassistant/test_airing_scheduler_v1120.py \
            tests/v3/guangyatransferassistant/test_airing_ui_v1120.py \
            tests/v3/guangyatransferassistant/test_plugin_contract.py \
            tests/v3/guangyatransferassistant/test_runtime_v170_contract.py \
            tests/v3/guangyatransferassistant/test_experience_v170_contract.py \
            tests/v3/guangyatransferassistant \
            -q

      - name: Remove one-shot tooling
        run: |
          rm -f tools/apply_airing_ui_v1120.py
          rm -f .github/workflows/feature-gysub-airing-ui-v1120-once.yml

      - name: Commit validated UI candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose airing calendar window settings"
          git push origin HEAD:feature/gysub-airing-calendar-v1120
