name: Modernize transfer assistant tests

on:
  push:
    branches:
      - release/shukguangya-v390-final
    paths:
      - .github/workflows/_tmp_modernize_transfer_tests.yml

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/shukguangya-v390-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Modernize stale release assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('tests/v3/guangyatransferassistant')
          changed = []
          for p in sorted(root.glob('test_*.py')):
              s = p.read_text(encoding='utf-8')
              old = s
              s = s.replace('1.12.23', '1.12.25')
              s = s.replace('20260909-r70', '20260910-r72')
              # These two historical release-description assertions duplicated behavioral
              # read-only get_item contracts already covered by dedicated v1.12.18 tests.
              lines = []
              for line in s.splitlines(True):
                  stripped = line.strip()
                  if stripped in {
                      'assert "get_item" in local_desc',
                      "assert 'get_item' in local_desc",
                      'assert "get_item" in desc',
                      "assert 'get_item' in desc",
                  }:
                      continue
                  lines.append(line)
              s = ''.join(lines)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print(f'updated {len(changed)} files')
          print('\n'.join(changed))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- tests/v3/guangyatransferassistant; then
            exit 0
          fi
          git add tests/v3/guangyatransferassistant
          git commit -m "test(guangyatransfer): align contracts with v1.12.25 release truth"
          git push origin HEAD:release/shukguangya-v390-final
