name: Validate GuangYa v1.12.12 alias query once

on:
  push:
    branches:
      - fix/guangya-v1.12.12-gying-alias-query
    paths:
      - '.validation/guangya-v11212-alias.trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.12-gying-alias-query
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply nested contract migration
        run: python tools/_validate_gying_alias_v11212.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Root unit tests
        run: python -m unittest discover -s tests -v
      - name: GuangYa V3 contract tests
        run: python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: Dependency manifests
        run: python tests/v3/check_dependency_manifests.py
      - name: JSON metadata
        run: python -m json.tool package.v3.json >/dev/null && python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Cleanup artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Finalize validated candidate
        run: |
          rm -f .validation/guangya-v11212-alias.trigger
          rm -f tools/_validate_gying_alias_v11212.py
          rm -f .github/workflows/validate-guangya-v11212-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(guangya): finalize v1.12.12 alias-query candidate'
          git push origin HEAD:fix/guangya-v1.12.12-gying-alias-query
