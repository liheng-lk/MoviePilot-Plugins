name: Validate GuangYa v1.12.12 alias query once

on:
  push:
    branches:
      - fix/guangya-v1.12.12-gying-alias-query
    paths:
      - '.validation/guangya-v11212-alias.trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guangya-v1.12.12-gying-alias-query
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply nested contract migration
        run: python tools/_validate_gying_alias_v11212.py
      - name: Python syntax
        run: |
          python -m compileall -q plugins.v2 plugins.v3
          find plugins.v2 plugins.v3 -type d -name '__pycache__' -prune -exec rm -rf {} +
          find plugins.v2 plugins.v3 -type f -name '*.pyc' -delete
      - name: Root unit tests
        run: python -m unittest discover -s tests -v
      - name: GuangYa V3 contract tests
        run: python tests/v3/guangyatransferassistant/run_contract_tests.py
      - name: V3 dependency manifests
        run: |
          test -z "$(find plugins.v3 -type f -name 'requirements.txt' -print)"
          python - <<'PY'
          from pathlib import Path
          import tomllib
          for path in Path('plugins.v3').glob('*/pyproject.toml'):
              with path.open('rb') as f:
                  project = tomllib.load(f)['project']
              assert project.get('dynamic') == ['version'], path
              assert project.get('requires-python') == '>=3.12', path
          shuk = Path('plugins.v3/shukguangyadisk')
          assert not (shuk / 'pyproject.toml').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          assert not (shuk / 'requirements.txt').exists(), 'ShukGuangYaDisk V3 must remain dependency-free'
          PY
      - name: JSON indexes
        run: python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['plugin.json','package.v2.json','package.v3.json']]"
      - name: Cleanup artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: No generated Python artifacts
        run: test -z "$(find . -type f -name '*.pyc' -o -type d -name '__pycache__')"
      - name: Finalize validated candidate
        run: |
          rm -f .validation/guangya-v11212-alias.trigger
          rm -f tools/_validate_gying_alias_v11212.py
          rm -f .github/workflows/validate-guangya-v11212-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(guangya): finalize v1.12.12 alias-query candidate'
          git push origin HEAD:fix/guangya-v1.12.12-gying-alias-query
