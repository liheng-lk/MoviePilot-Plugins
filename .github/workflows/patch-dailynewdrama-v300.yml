name: Build DailyNewDrama 3.0.0 V3 adaptation
on:
  push:
    branches: [dailynewdrama-v3.0.0-adaptation]
    paths: [.github/workflows/patch-dailynewdrama-v300.yml]
permissions:
  contents: write
jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dailynewdrama-v3.0.0-adaptation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create V3 implementation and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil

          src = Path('plugins.v2/dailynewdrama')
          dst = Path('plugins.v3/dailynewdrama')
          dst.mkdir(parents=True, exist_ok=True)
          shutil.copy2(src / '__init__.py', dst / '__init__.py')
          shutil.copy2(src / 'platform_sources.py', dst / 'platform_sources.py')
          shutil.copy2(src / 'movie.jpg', dst / 'movie.jpg')

          p = dst / '__init__.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('from app.core.config import settings', 'from app.sdk.config import settings')
          s = s.replace('from app.core.context import MediaInfo', 'from app.sdk.media import MediaInfo, MetaInfo')
          s = s.replace('from app.core.event import Event, eventmanager', 'from app.sdk.events import Event, eventmanager')
          s = s.replace('from app.core.metainfo import MetaInfo\n', '')
          s = s.replace('from app.log import logger', 'from app.sdk.logging import logger')
          s = s.replace('from app.schemas import MediaType\nfrom app.schemas.types import EventType, MediaSource', 'from app.schemas.types import EventType, MediaSource, MediaType')
          s = s.replace('from app.utils.http import RequestUtils', 'from app.sdk.network import RequestUtils')
          s = s.replace('plugin_version = "1.3.6"', 'plugin_version = "3.0.0"', 1)
          if 'def stop_service(self)' not in s:
              s = s.rstrip() + '''\n\n    def stop_service(self) -> None:\n        \"\"\"V3 生命周期：停用插件并释放本插件持有的运行状态。\"\"\"\n        self._enabled = False\n'''
          p.write_text(s, encoding='utf-8')

          p = dst / 'platform_sources.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('from app.core.config import settings', 'from app.sdk.config import settings')
          s = s.replace('from app.log import logger', 'from app.sdk.logging import logger')
          s = s.replace('from app.utils.http import RequestUtils', 'from app.sdk.network import RequestUtils')
          p.write_text(s, encoding='utf-8')

          # V3 README
          (dst / 'README.md').write_text('''# 每日新剧助手 3.0.0\n\nMoviePilot V3 专用实现。\n\n- 基于 `plugins.v2/dailynewdrama` 1.3.6 功能迁移；\n- 使用 V3 稳定 SDK 导入；\n- 使用 `MediaSource + media_id` 统一媒体身份；\n- 支持豆瓣、腾讯视频、爱奇艺、优酷、芒果TV、哔哩哔哩；\n- 已入库/已订阅内容不展示，候选不限数量，详情页支持一键订阅。\n''', encoding='utf-8')

          # V3 index
          v3 = {
              'DailyNewDrama': {
                  'name': '每日新剧助手',
                  'description': 'MoviePilot V3 新剧与在播剧聚合助手，聚合豆瓣、腾讯视频、爱奇艺、优酷、芒果TV、哔哩哔哩，仅展示未入库且未订阅内容，并支持页面一键订阅。',
                  'labels': '豆瓣,腾讯视频,爱奇艺,优酷,芒果TV,哔哩哔哩,电视剧,订阅,推荐,通知',
                  'version': '3.0.0',
                  'icon': 'movie.jpg',
                  'author': 'liheng-lk',
                  'level': 1,
                  'system_version': '>=3.0.0',
                  'history': {
                      'v3.0.0': 'MoviePilot V3 专用首版：迁移至 plugins.v3 与 package.v3.json，采用 app.sdk 稳定接口和 media_source + media_id 统一媒体身份，保留多平台新剧发现、媒体库/订阅过滤、无限候选和页面一键订阅能力。'
                  }
              }
          }
          Path('package.v3.json').write_text(json.dumps(v3, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # V2 explicitly disabled under V3 host
          for name in ('package.v2.json', 'plugin.json'):
              path = Path(name)
              data = json.loads(path.read_text(encoding='utf-8'))
              data['DailyNewDrama']['v3'] = False
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # V3 tests kept outside plugin runtime tree
          testdir = Path('tests/v3/dailynewdrama')
          testdir.mkdir(parents=True, exist_ok=True)
          (testdir / 'test_plugin_contract.py').write_text(r'''from pathlib import Path
import json

ROOT = Path(__file__).resolve().parents[3]
V3 = ROOT / 'plugins.v3' / 'dailynewdrama'
text = (V3 / '__init__.py').read_text(encoding='utf-8')
platform = (V3 / 'platform_sources.py').read_text(encoding='utf-8')
index = json.loads((ROOT / 'package.v3.json').read_text(encoding='utf-8'))['DailyNewDrama']
v2 = json.loads((ROOT / 'package.v2.json').read_text(encoding='utf-8'))['DailyNewDrama']

assert V3.exists()
assert (V3 / 'movie.jpg').exists()
assert 'plugin_version = "3.0.0"' in text
assert index['version'] == '3.0.0'
assert index['system_version'] == '>=3.0.0'
assert v2.get('v3') is False
assert 'def stop_service(self)' in text

# V3 stable SDK contracts
for old in ('from app.core.config import', 'from app.core.context import', 'from app.core.event import',
            'from app.core.metainfo import', 'from app.log import', 'from app.utils.http import'):
    assert old not in text
assert 'from app.sdk.config import settings' in text
assert 'from app.sdk.media import MediaInfo, MetaInfo' in text
assert 'from app.sdk.events import Event, eventmanager' in text
assert 'from app.sdk.logging import logger' in text
assert 'from app.sdk.network import RequestUtils' in text
assert 'from app.sdk.config import settings' in platform
assert 'from app.sdk.logging import logger' in platform
assert 'from app.sdk.network import RequestUtils' in platform

# New media identity contract must remain in V3
assert 'recognize_media(meta=meta, tmdbid=' not in text
assert 'recognize_media(meta=meta, doubanid=' not in text
assert 'media_source=MediaSource.TMDB' in text
assert 'media_id=str(item.get("tmdbid"))' in text
assert 'media_source=subscribe_media_source' in text
assert 'media_id=str(subscribe_media_id)' in text

# Previously fixed UI/API contract remains intact
assert '"method": "get"' in text
assert '"apikey": settings.API_TOKEN' in text
''', encoding='utf-8')
          PY
          python -m compileall -q plugins.v3/dailynewdrama
          python tests/v3/dailynewdrama/test_plugin_contract.py
          python -m unittest discover -s tests -p 'test_dailynewdrama*.py' -v
      - name: Commit V3 adaptation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins.v3/dailynewdrama package.v3.json package.v2.json plugin.json tests/v3/dailynewdrama
          git commit -m 'feat: add DailyNewDrama 3.0.0 for MoviePilot V3'
          git push origin HEAD:dailynewdrama-v3.0.0-adaptation
