name: Temporary GuangYa v1.3.0 Message Executor
on:
  pull_request:
    branches: [main]
    paths:
      - '.guangya-v130-message-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guangya-missing-episodes-airing-v1.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix patch script quoting
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/patch_guangya_v130_dedupe_v2.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("addition = r'''", 'addition = r"""', 1)
          marker = "\n'''\nif 'test_same_share_in_new_message_is_kept_as_new_entry' not in tests:"
          replacement = '\n"""\nif \'test_same_share_in_new_message_is_kept_as_new_entry\' not in tests:'
          if marker not in text:
              raise SystemExit('closing test addition marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
      - name: Apply final patch
        run: python tools/patch_guangya_v130_dedupe_v2.py
      - name: Validate
        run: |
          python -m py_compile plugins.v3/guangyatransferassistant/__init__.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/v3/guangyatransferassistant/test_plugin_contract.py')
          tests = [(name, fn) for name, fn in ns.items() if name.startswith('test_') and callable(fn)]
          for name, fn in tests:
              fn()
              print(f'PASS {name}')
          print(f'{len(tests)} GuangYa contract tests passed')
          PY
          python -m json.tool package.v3.json >/dev/null
          python -m json.tool plugins.v3/guangyatransferassistant/plugin.json >/dev/null
      - name: Commit feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .guangya-v130-message-trigger tools/patch_guangya_v130_dedupe_v2.py
          git add plugins.v3/guangyatransferassistant/__init__.py tests/v3/guangyatransferassistant/test_plugin_contract.py
          git commit -m 'fix: preserve new GuangYa messages and sync library before matching'
          git push origin HEAD:feat/guangya-missing-episodes-airing-v1.3.0
