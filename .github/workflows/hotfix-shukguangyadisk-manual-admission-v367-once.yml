name: Hotfix ShukGuangYaDisk v3.6.7 once

on:
  push:
    branches:
      - fix/shukguangyadisk-manual-admission-v367
    paths:
      - .github/workflows/hotfix-shukguangyadisk-manual-admission-v367-once.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shukguangyadisk-manual-admission-v367
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install -q pytest

      - name: Apply hotfix candidate
        run: python tools/hotfix_shukguangyadisk_v367.py

      - name: Compile patched modules
        run: python -m py_compile plugins.v3/shukguangyadisk/organizer_monitor_v366.py plugins.v3/shukguangyadisk/organizer_folder_batch_v342.py

      - name: Run regression tests
        run: python -m pytest tests/v3/shukguangyadisk/test_monitor_v366.py tests/v3/shukguangyadisk/test_folder_batch_v342.py tests/v3/shukguangyadisk/test_queue_recovery_v332.py tests/v3/shukguangyadisk/test_engine_v360.py tests/v3/shukguangyadisk/test_pending_revisit_v361.py tests/v3/shukguangyadisk/test_move_transaction_guard_v364.py -q

      - name: Commit validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(shukguangyadisk): manual admission conflict v3.6.7"
          git push origin HEAD:fix/shukguangyadisk-manual-admission-v367
