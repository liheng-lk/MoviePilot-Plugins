name: Release GuangYaTransferAssistant v1.12.10

on:
  pull_request:
    paths:
      - 'plugins.v3/guangyatransferassistant/**'
      - 'tests/**/guangya*'
      - 'tests/v3/guangyatransferassistant/**'
      - '.github/workflows/release-guangyatransferassistant-v11210.yml'
  push:
    branches: [main]
    paths:
      - 'plugins.v3/guangyatransferassistant/xunlei_season_fence_v11210.py'
      - 'plugins.v3/guangyatransferassistant/movie_identity_v1129.py'
      - 'tests/v3/guangyatransferassistant/test_xunlei_season_fence_v11210.py'
      - '.github/workflows/release-guangyatransferassistant-v11210.yml'

permissions:
  contents: write

concurrency:
  group: release-guangyatransferassistant-v11210
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify v1.12.10 regression code
        run: |
          test -f plugins.v3/guangyatransferassistant/xunlei_season_fence_v11210.py
          test -f tests/v3/guangyatransferassistant/test_xunlei_season_fence_v11210.py
          grep -q '迅雷无季号资源结构冲突' plugins.v3/guangyatransferassistant/xunlei_season_fence_v11210.py
          grep -q 'test_datang_s02_rejects_seasonless_60_episode_s01_package_before_import' tests/v3/guangyatransferassistant/test_xunlei_season_fence_v11210.py
          grep -q 'class GuangYaMovieIdentityV1129Mixin(GuangYaXunleiSeasonFenceV11210Mixin)' plugins.v3/guangyatransferassistant/movie_identity_v1129.py

      - name: Materialize v1.12.10 release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          plugin_dir = ROOT / 'plugins.v3' / 'guangyatransferassistant'
          new_version = '1.12.10'
          new_build = '20260905-r56'
          description = (
              '更新日历驱动的固定分流助手：5 分钟频道 Push 被动消费；当天应播 TV/动漫每 10 分钟快速追更；'
              '电影每 60 分钟复查并在新订阅时立即进入资源链。v1.12.10 新增迅雷跨季物理资源栅栏：'
              '无季号整包先校验本季总集数，同一系列的同一真实迅雷 share 只允许首个成功 season 消费，'
              '阻止 01.mp4 / 01(1).mp4 等跨季重复入库；保留 v1.12.9 精确 TMDB 电影官方别名。'
              '来源优先级：观影迅雷秒传 > 光鸭直接转存 > Magnet > ED2K。'
          )
          history_text = (
              '修复同一真实迅雷分享被同一剧集多个 season 订阅重复消费、产生 01.mp4/01(1).mp4 等物理重复文件：'
              'TV 无明确季号的包在秒传前先校验完整集号结构，若解析集号超过当前季总集数则整包拒绝，禁止裁剪目标集后冒充当前季；'
              '同一系列+同一 seasonless share 在首个真实秒传成功后写入持久 season claim，其它订阅/season 不得再次消费；'
              '升级时可从旧 xunlei_flash_state completed 事实恢复 claim，同系列迅雷 dispatch 串行化关闭并发竞态；'
              '显式带 Sxx/Season/第x季 的真实多季包继续交给既有媒体身份与文件级 planner，电影、GYING、迅雷 JSON 协议和来源优先级不变。'
          )

          package_path = ROOT / 'package.v3.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          meta = package['GuangYaTransferAssistant']
          assert meta['version'] == '1.12.9', meta['version']
          meta['version'] = new_version
          meta['description'] = description
          old_history = dict(meta.get('history') or {})
          meta['history'] = {'v1.12.10': history_text, **old_history}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          plugin_path = plugin_dir / 'plugin.json'
          plugin = json.loads(plugin_path.read_text(encoding='utf-8'))
          assert plugin['version'] == '1.12.9', plugin['version']
          plugin['version'] = new_version
          plugin['description'] = description
          plugin_path.write_text(json.dumps(plugin, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          entry_path = plugin_dir / '__init__.py'
          entry = entry_path.read_text(encoding='utf-8')
          entry = entry.replace('"""光鸭转存助手 v1.12.9 运行入口。', '"""光鸭转存助手 v1.12.10 运行入口。', 1)
          anchor = (
              'v1.12.9 修复电影观影已命中但真实英文原名被媒体身份门禁误杀：仅按订阅精确 TMDB ID 从 MoviePilot MediaChain '
              '补全官方 title/en_title/original_title 等可信别名；错误 TMDB/年份仍拒绝，不引入模糊电影匹配。\n'
          )
          release_line = (
              'v1.12.10 修复同一迅雷分享被同媒体不同季重复消费：无季号整包先校验完整集号结构，成功后持久占用真实 share，'
              '同系列迅雷流程串行化；显式多季包仍由既有 planner 拆分。\n'
          )
          assert anchor in entry
          if release_line not in entry:
              entry = entry.replace(anchor, anchor + release_line, 1)
          old_marker = '    plugin_version = "1.12.9"\n    build_id = "20260905-r55"'
          new_marker = f'    plugin_version = "{new_version}"\n    build_id = "{new_build}"'
          assert old_marker in entry
          entry = entry.replace(old_marker, new_marker, 1)
          entry_path.write_text(entry, encoding='utf-8')

          readme_path = plugin_dir / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          section = '''## v1.12.10：迅雷跨季物理资源去重\n\n- 修复同一个真实迅雷分享被同一剧集的多个 Season 订阅同时消费，导致光鸭出现 `01.mp4 / 01(1).mp4` 等重复文件。\n- 无明确季号的 TV 整包会先解析完整集号结构；当前季总集数为 32 但资源包实际到 E60 时整包拒绝，不再裁剪 E01-E32 后冒充 S02。\n- 同一系列、同一无季号 Xunlei share 在首个真实秒传成功后持久绑定到该 Season；其它 Season 不再重复导入。\n- 同系列 Xunlei 主流程串行，关闭 S01/S02 同时越过门禁的竞态；旧成功状态可自动恢复 share claim。\n- 显式带 Sxx/Season/第x季 的真实多季包继续由原媒体身份与文件级 planner 拆分；电影、GYING、Magnet/ED2K 和来源优先级不变。\n\n'''
          if '## v1.12.10：迅雷跨季物理资源去重' not in readme:
              marker = '## v1.12.9：电影精确 TMDB 官方别名桥接'
              assert marker in readme
              readme = readme.replace(marker, section + marker, 1)
              readme_path.write_text(readme, encoding='utf-8')

          # Current-release marker tests follow the public package version. Keep the historical
          # v1.12.9 movie-identity layer test pinned to its own layer version/build.
          excluded = {
              (ROOT / 'tests/v3/guangyatransferassistant/test_movie_identity_v1129.py').resolve(),
          }
          for path in (ROOT / 'tests').rglob('*.py'):
              if path.resolve() in excluded:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('1.12.9', new_version).replace('20260905-r55', new_build)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Historical implementation remains pinned; only the final runtime/public metadata advances.
          movie_layer = (plugin_dir / 'movie_identity_v1129.py').read_text(encoding='utf-8')
          assert 'plugin_version = "1.12.9"' in movie_layer
          assert 'build_id = "20260905-r55"' in movie_layer
          final_entry = entry_path.read_text(encoding='utf-8')
          assert f'plugin_version = "{new_version}"' in final_entry
          assert f'build_id = "{new_build}"' in final_entry
          PY

      - name: Validate transformed v1.12.10 tree
        run: |
          python -m compileall -q plugins.v3/guangyatransferassistant
          python -m unittest discover -s tests -v
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('package.v3.json').read_text(encoding='utf-8'))['GuangYaTransferAssistant']
          plugin = json.loads(Path('plugins.v3/guangyatransferassistant/plugin.json').read_text(encoding='utf-8'))
          entry = Path('plugins.v3/guangyatransferassistant/__init__.py').read_text(encoding='utf-8')
          assert package['version'] == plugin['version'] == '1.12.10'
          assert 'v1.12.10' in package.get('history', {})
          assert 'plugin_version = "1.12.10"' in entry
          assert 'build_id = "20260905-r56"' in entry
          PY
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit guarded release and self-delete
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/release-guangyatransferassistant-v11210.yml
          git add -A
          git commit -m 'release(guangyatransferassistant): v1.12.10 Xunlei season share fence'
          git fetch origin main
          git rebase origin/main
          python -m compileall -q plugins.v3/guangyatransferassistant
          python tests/v3/guangyatransferassistant/run_contract_tests.py
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('package.v3.json').read_text(encoding='utf-8'))['GuangYaTransferAssistant']
          plugin = json.loads(Path('plugins.v3/guangyatransferassistant/plugin.json').read_text(encoding='utf-8'))
          assert package['version'] == plugin['version'] == '1.12.10'
          assert 'v1.12.10' in package.get('history', {})
          PY
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git status --short
          git push origin HEAD:main
